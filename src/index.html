        const ok = await hubConfirm({
          message: `End ${memberName(input.child_id)}'s holiday schedule?`,
          description: "You have not ticked any days. Once this is countersigned, every day follows the regular rotation again. "
            + "The schedule in force until then stays in the record.",
          confirmLabel: "Propose ending it",
          destructive: true,
        });
        if (!ok) return;
      }
      const terms = holidayProposalTerms(input);
      if (!terms) { hubAlert("This holiday schedule is not complete."); return; }
      const btn = modalEl.querySelector("#save-hol");
      btn.disabled = true; btn.textContent = "Sending…";
      try {
        let result = { locked: true };
        if (!DEMO) {
          const key = JSON.stringify(terms);
          let id = unsignedHoliday?.key === key ? unsignedHoliday.id : null;
          if (!id) {
            ({ id } = await requestJson(`/run/${APP_ID}/api/propose-agreement`, {
              body: { table: "holiday_versions", values: terms },
              fallbackError: "Could not record the proposal",
            }));
            unsignedHoliday = { key, id };
          }
          try {
            result = await agreeHoliday(id, true);
            unsignedHoliday = null;
          } catch (e) {
            const withdrawn = await agreeHoliday(id, false, true).then(() => true, () => false);
            if (withdrawn) unsignedHoliday = null;
            throw e;
          }
          await loadData();
        } else {
          holidayVersions = holidayVersions.filter(v => !(v.child_id === terms.child_id && v.status === "agreed"));
          holidayVersions.unshift({ id: crypto.randomUUID(), ...terms, proposed_by: me?.id, status: "agreed",
            household_a_agreed: 1, household_b_agreed: 0, agreed_at: new Date().toISOString() });
        }
        closeModal(); render();
        announceProposal(result);
        // An empty document ends the schedule; telling the other parent that a
        // schedule was "proposed" would have them open it expecting holidays.
        const ending = !input.rules.length;
        const kid = memberName(terms.child_id);
        if (ending) {
          notifySchedule(result.locked ? "Holiday schedule ended" : "Ending the holiday schedule proposed",
            result.locked
              ? `${me?.name} ended the holiday schedule for ${kid}.`
              : `${me?.name} proposed ending the holiday schedule for ${kid}. It ends once you countersign.`,
            { view: "holidays" });
        } else {
          notifySchedule(result.locked ? "Holiday schedule in force" : "Holiday schedule proposed",
            result.locked
              ? `${me?.name} set a holiday schedule for ${kid}.`
              : `${me?.name} proposed a holiday schedule for ${kid}. It takes effect once you countersign it.`,
            { view: "holidays" });
        }
      } catch (e) {
        btn.disabled = false; btn.textContent = "Propose and sign";
        console.error("propose holiday schedule failed", e);
        hubAlert(agreementFailureLine(e, { action: "send this holiday schedule", thing: "holiday schedule" }));
      }
    }

    function notifyHolidayAgreed(holiday) {
      const ending = !parseHolidayRules(holiday.rules).length;
      notifySchedule(ending ? "Holiday schedule ended" : "Holiday schedule agreed",
        ending
          ? `${me?.name} countersigned ending ${memberName(holiday.child_id)}'s holiday schedule. Every day follows the regular rotation again.`
          : `${me?.name} countersigned ${memberName(holiday.child_id)}'s holiday schedule. It's now in force.`,
        { view: "holidays" });
    }

    async function onSignHoliday(id, btn) {
      const holiday = holidayVersions.find(v => v.id === id);
      if (!holiday) return;
      if (btn) { btn.disabled = true; btn.textContent = "Signing…"; }
      try {
        const result = await agreeHoliday(id, true);
        // `already_agreed` with `locked` is a retry that finished the job: the
        // hub records a signature before it applies the lock, so a countersign
        // it turned away ("try again") left the signature on the row, and this
        // one locked it. Only an unlocked row is still waiting on anyone.
        if (result.already_agreed && !result.locked) {
          signedElsewhere.add(id);
          await loadData(); render();
          hubAlert("You've already countersigned this. It takes effect once your co-parent does too.");
          return;
        }
        // The custody days are rewritten in the same transaction as the lock.
        await loadData(); render();
        if (result.locked) notifyHolidayAgreed(holiday);
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = "Countersign"; }
        console.error("countersign holiday schedule failed", e);
        // A refusal usually means the proposal moved on; show where it is now.
        await loadData().catch(() => {});
        render();
        // The answer was lost but the countersignature locked it: done.
        if (landedUnheard(e, holidayVersions, id, v => v.status === "agreed")) { notifyHolidayAgreed(holiday); return; }
        hubAlert(agreementFailureLine(e, {
          action: "countersign this holiday schedule", thing: "proposal",
          state: reReadState(holidayVersions, id),
        }));
      }
    }

    // Sign a holiday schedule that is ALREADY in force on the other parent's
    // signature alone. Same rules as onCountersignInForce: nothing about the
    // schedule changes, the terms go back with the signature so the hub can
    // refuse a stale screen, and there is no declining — only proposing changes.
    async function onCountersignHolidayInForce(id) {
      const holiday = holidayVersions.find(v => v.id === id);
      if (!holiday) return;
      const ok = await hubConfirm({
        message: `Countersign ${memberName(holiday.child_id)}'s holiday schedule?`,
        description: "It is already in force and stays exactly as it is; this records that you agree to it. "
          + "If it is not what you agreed, cancel and propose changes instead.",
        confirmLabel: "Countersign",
      });
      if (!ok) return;
      const notifyCountersigned = () => notifySchedule("Holiday schedule countersigned",
        `${me?.name} countersigned ${memberName(holiday.child_id)}'s holiday schedule. It was already in force and has not changed.`,
        { view: "holidays" });
      try {
        const result = await agreeHoliday(id, true, undefined, holidaySnapshot(holiday));
        await loadData(); render();
        if (result.late_signature) notifyCountersigned();
      } catch (e) {
        console.error("countersign holiday schedule in force failed", e);
        await loadData().catch(() => {});
        render();
        // Lost answer, and the late signature is now on the row: it landed.
        if (landedUnheard(e, holidayVersions, id, v => v.status === "agreed" && !!v.countersigned_at)) { notifyCountersigned(); return; }
        hubAlert(agreementFailureLine(e, {
          action: "countersign this holiday schedule", thing: "holiday schedule",
          state: reReadState(holidayVersions, id, "agreed"),
        }));
      }
    }

    async function onDeclineHoliday(id, btn) {
      const holiday = holidayVersions.find(v => v.id === id);
      if (!holiday) return;
      const mine = holiday.proposed_by === me?.id;
      const ok = await hubConfirm({
        message: mine ? "Withdraw your proposed holiday schedule?" : "Decline this proposed holiday schedule?",
        description: "Any holiday schedule currently in force is unaffected.",
        destructive: true,
      });
      if (!ok) return;
      if (btn) { btn.disabled = true; btn.textContent = mine ? "Withdrawing…" : "Declining…"; }
      const notifyResolved = (withdrew) => notifySchedule(withdrew ? "Holiday schedule withdrawn" : "Holiday schedule declined",
        `${me?.name} ${withdrew ? "withdrew their proposed" : "declined the proposed"} holiday schedule for ${memberName(holiday.child_id)}.`,
        { view: "holidays" });
      try {
        // `resolution: true`: the hub resolves it the way OUR side resolves and
        // says which word it used (see onDeclineAmendment).
        const result = await agreeHoliday(id, false, true);
        await loadData(); render();
        notifyResolved(result.status === "withdrawn");
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = mine ? "Withdraw" : "Decline"; }
        console.error("decline holiday schedule failed", e);
        await loadData().catch(() => {});
        render();
        // Lost answer, and the row carries this side's own word: it landed.
        const landed = landedUnheard(e, holidayVersions, id, v => v.status === (mine ? "withdrawn" : "declined"));
        if (landed) { notifyResolved(landed.status === "withdrawn"); return; }
        hubAlert(agreementFailureLine(e, {
          action: mine ? "withdraw this proposal" : "decline this proposal", thing: "proposal",
          state: reReadState(holidayVersions, id),
        }));
      }
    }

    // ── Records view ─────────────────────────────────────────────────────────
    // The hub renders the documents (GET api/reports). Each runs as the
    // signed-in parent through the same row policies as this app's own reads,
    // so a document cannot hold a row the parent could not already see, and
    // each is stamped with who generated it, when, a row count and a SHA-256
    // checksum. The full record binds every report for one date range into a
    // single print-styled document with a cover page. Where the hub lists
    // `pdf` among the full record's formats it also renders that document to a
    // PDF itself: one file, the same for whoever is handed it, which a PDF
    // printed from a browser is not. "Save as PDF" from the print dialog stays
    // for every document. Opened in a new tab, not this frame: the document
    // carries its own strict CSP, and a CSV or PDF arrives as an attachment.
    const REPORTS_URL = window.__REPORTS_URL ?? "";
    let reportViews = null, reportFullRecord = null, reportsLoading = null;
    /** A list that FAILED to load is not an empty list (see custodyReadFailed):
     *  "No records are offered" would be a false statement about the record. */
    let reportsFailed = false;
    let recordFrom = "", recordTo = "";
    /** Until a parent picks a date the range is the default, and the default
     *  ends "today" — so it is recomputed each time it is used, not kept from
     *  whenever the tab was first drawn. Once they pick, it is theirs, including
     *  a cleared bound (which asks for every date on that side). */
    let recordRangeEdited = false;

    function loadReports() {
      if (!REPORTS_URL || reportViews || reportsLoading) return;
      reportsFailed = false;
      reportsLoading = (async () => {
        try {
          const res = await fetch(REPORTS_URL, { headers: { Accept: "application/json" } });
          if (!res.ok) throw new Error(`reports ${res.status}`);
          const body = await res.json();
          reportViews = Array.isArray(body?.views) ? body.views : [];
          reportFullRecord = body?.full_record ?? null;
        } catch {
          reportsFailed = true;
        } finally {
          reportsLoading = null;
        }
        // Every outcome re-renders: the view is showing "Loading records…".
        if (view === "records") render();
      })();
    }

    // The default is the WHOLE record up to today: From is left empty, which
    // the hub reads as "from the beginning". Any computed start (a year back,
    // the earliest schedule anchor) is a guess at where the record begins, and
    // a wrong guess silently leaves the oldest messages or custody days out of
    // a document that looks complete. A parent who wants a period picks one.
    //
    // The end is the LATER of the household's today and UTC's. Messages, swap
    // requests and schedule versions are stamped by the server in UTC and the
    // reports filter on that UTC date, so west of Greenwich an evening message
    // already carries tomorrow's date: ending at the local today would leave
    // tonight's messages out of a record generated tonight. The cost is that
    // the custody record can then include tomorrow's scheduled day, which is
    // the agreed schedule and labelled as such — an extra true row, where the
    // alternative is a missing one.
    function defaultRecordRange() {
      const now = new Date();
      const localToday = todayStr(now), utcToday = now.toISOString().slice(0, 10);
      return { from: "", to: utcToday > localToday ? utcToday : localToday };
    }

    // Opening a record does NOT set "First viewed": the hub stamps that only
    // when a conversation is opened in Messages.
    /** The range a document is made for, refreshed and checked; false after
     *  telling the person why there is nothing to make. */
    function settleRecordRange() {
      // A tab left open past midnight (the household's or UTC's) still shows
      // yesterday as the default end; the document must not stop there.
      if (!recordRangeEdited) {
        ({ from: recordFrom, to: recordTo } = defaultRecordRange());
        const fromEl = document.getElementById("rec-from"), toEl = document.getElementById("rec-to");
        if (fromEl) fromEl.value = recordFrom;
        if (toEl) toEl.value = recordTo;
      }
      // The hub refuses an inverted range; say so here rather than in a new tab.
      if (recordFrom && recordTo && recordFrom > recordTo) { hubAlert("From must not be later than To."); return false; }
      return true;
    }

    function openReport(id, format) {
      if (!settleRecordRange()) return;
      const url = new URL(`${REPORTS_URL}/${encodeURIComponent(id)}`, window.location.href);
      url.searchParams.set("format", format);
      if (recordFrom) url.searchParams.set("from", recordFrom);
      if (recordTo) url.searchParams.set("to", recordTo);
      window.open(url.toString(), "_blank", "noopener");
    }

    /**
     * A verified copy is issued by a POST (it records an attestation that
     * outlives the household), so it cannot be a link. "download" hands the
     * file back here and to the browser under the name the hub gave it;
     * "email" has the hub send it to the member's own sign-in address — the
     * way to get one on a phone, where a download from the app cannot land.
     * One at a time; the hub takes a few seconds to make it.
     */
    let verifiedBusy = null; // null, or the delivery being made: "download" | "email"
    async function requestVerifiedCopy(id, deliver) {
      if (verifiedBusy || !settleRecordRange()) return;
      // Drawn from this flag by renderRecords, so a redraw mid-request (a tab
      // switch and back) still shows the copy being made.
      // Taken before the first redraw replaces the pressed (now disabled) button.
      const hadFocus = document.activeElement?.dataset?.verifiedDeliver === deliver;
      verifiedBusy = deliver;
      redrawRecordsKeepingFocus(deliver, hadFocus);
      try {
        const res = await fetch(`${REPORTS_URL}/${encodeURIComponent(id)}/verified`, {
          method: "POST",
          headers: { "Content-Type": "application/json", Accept: deliver === "email" ? "application/json" : "application/pdf" },
          body: JSON.stringify({
            ...(recordFrom ? { from: recordFrom } : {}),
            ...(recordTo ? { to: recordTo } : {}),
            deliver,
          }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => null);
          hubAlert(body?.error || "The verified copy could not be made. Try again.");
          return;
        }
        if (deliver === "email") {
          const body = await res.json().catch(() => null);
          hubAlert(`Verified copy sent to ${body?.sent_to || "your email"}. Forward the attached PDF as it is.`);
          return;
        }
        const name = /filename="([^"]+)"/.exec(res.headers.get("Content-Disposition") || "")?.[1] || "verified-record.pdf";
        const url = URL.createObjectURL(await res.blob());
        const a = document.createElement("a");
        a.href = url;
        a.download = name;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60_000);
      } catch {
        hubAlert("The verified copy could not be made. Check your connection and try again.");
      } finally {
        verifiedBusy = null;
        redrawRecordsKeepingFocus(deliver, hadFocus);
      }
    }
    /** Redraws only while Records is showing (a redraw elsewhere would reset a
     *  half-filled form). Focus goes back to the button the person pressed
     *  only when nothing else has taken it since: the redraw dropped it to the
     *  page, never out of a dialog they opened meanwhile. While the button is
     *  disabled it cannot hold focus; the last redraw puts it back. */
    function redrawRecordsKeepingFocus(deliver, hadFocus) {
      if (view !== "records") return;
      const dropped = document.activeElement === document.body || document.activeElement?.dataset?.verifiedDeliver === deliver;
      render();
      if (hadFocus && dropped) document.querySelector(`[data-verified-deliver="${deliver}"]:not([disabled])`)?.focus();
    }

    function renderRecords(el) {
      if (!canManage()) { el.innerHTML = `<div class="empty">Records are available to the parents.</div>`; return; }
      if (DEMO || !REPORTS_URL) { el.innerHTML = `<div class="empty">Records are generated by the hub once Co-Parenting is installed in a household or space.</div>`; return; }
      if (!reportViews && reportsFailed) {
        el.innerHTML = `<div class="empty">Couldn’t load the records list.
          <div style="margin-top:8px"><button class="btn btn-primary" data-testid="records-retry">Try again</button></div></div>`;
        el.querySelector("[data-testid=records-retry]").addEventListener("click", () => { reportsFailed = false; render(); });
        return;
      }
      if (!reportViews) { loadReports(); el.innerHTML = `<div class="empty">Loading records…</div>`; return; }
      if (!recordRangeEdited) ({ from: recordFrom, to: recordTo } = defaultRecordRange());

      const row = (id, title, desc, actions) => `
        <div class="card" data-testid="record-row" data-record="${esc(id)}">
          <div class="spread">
            <div><b>${esc(title)}</b>${desc ? `<div class="muted">${esc(desc)}</div>` : ""}</div>
            <div>${actions}</div>
          </div>
        </div>`;
      // Offered only when the hub says it can make one: a hub without the
      // renderer lists html and json alone, and the button would only 503.
      const fullRecordPdf = !!reportFullRecord && Array.isArray(reportFullRecord.formats)
        && reportFullRecord.formats.includes("pdf");
      const fullRecordVerified = !!reportFullRecord && Array.isArray(reportFullRecord.verified_formats)
        && reportFullRecord.verified_formats.includes("pdf");
      // Both disabled while either is working; the label changes on the one pressed.
      const verifiedBtn = (deliver, label, busyLabel) =>
        `<button class="btn btn-sm" data-verified="${esc(reportFullRecord.id)}" data-verified-deliver="${deliver}" data-testid="record-verified-${deliver}"`
        + `${verifiedBusy ? ` disabled aria-busy="${verifiedBusy === deliver}"` : ""}>${verifiedBusy === deliver ? busyLabel : label}</button>`;
      const btn = (id, format, label, primary) =>
        `<button class="btn btn-sm${primary ? " btn-primary" : ""}" data-report="${esc(id)}" data-format="${format}">${esc(label)}</button>`;

      el.innerHTML = `
        <div class="card">
          <p class="muted">Each document is generated by the hub as you, from the records you can see here, and is stamped with who generated it, when, a row count and a SHA-256 checksum. Open one, then use Print / Save as PDF${fullRecordPdf ? ", or download the full record as a PDF made by the hub" : ""}. Times stamped by the server are printed in UTC, and the dates below select those records by their UTC date. Leave From empty for the whole record from the beginning.</p>
          <div class="row">
            <label class="field"><span>From</span><input type="date" id="rec-from" value="${esc(recordFrom)}"></label>
            <label class="field"><span>To</span><input type="date" id="rec-to" value="${esc(recordTo)}"></label>
          </div>
        </div>
        ${reportFullRecord ? row(reportFullRecord.id, reportFullRecord.title,
          fullRecordPdf
            ? "Every report below for the dates chosen, in one document with a cover page, a checksum per section and a package checksum. The PDF is made by the hub and takes a few seconds; every page carries the package checksum."
            : "Every report below for the dates chosen, in one document with a cover page, a checksum per section and a package checksum. Open it and save it as a PDF.",
          btn(reportFullRecord.id, "html", "Open full record", true)
            + (fullRecordPdf ? " " + btn(reportFullRecord.id, "pdf", "Download PDF") : "")
            + (fullRecordVerified ? " " + verifiedBtn("download", "Download verified copy", "Making verified copy…")
              + " " + verifiedBtn("email", "Email me a verified copy", "Sending verified copy…") : "")) : ""}
        ${fullRecordVerified ? `<div class="card muted" data-testid="record-verified-note">A verified copy is a PDF with a verification ID and QR code on its cover. Whoever you give it to can open the address printed on it, choose the file, and see that it is exactly what was issued and unchanged. Send the file itself: a printout, a scan or a copy saved again from a PDF viewer cannot be checked. On a phone, use Email me: the copy arrives as an attachment you can forward.</div>` : ""}
        ${reportViews.map(v => row(v.id, v.title, v.description,
          btn(v.id, "html", "Open") + " " + btn(v.id, "csv", "CSV"))).join("")}
        ${!reportViews.length && !reportFullRecord ? `<div class="empty">No records are offered.</div>` : ""}`;

      el.querySelector("#rec-from").addEventListener("change", e => { recordFrom = e.target.value; recordRangeEdited = true; });
      el.querySelector("#rec-to").addEventListener("change", e => { recordTo = e.target.value; recordRangeEdited = true; });
      el.querySelectorAll("[data-report]").forEach(b =>
        b.addEventListener("click", () => openReport(b.dataset.report, b.dataset.format)));
      el.querySelectorAll("[data-verified]").forEach(b =>
        b.addEventListener("click", () => requestVerifiedCopy(b.dataset.verified, b.dataset.verifiedDeliver)));
    }

    // ── Handoffs view ────────────────────────────────────────────────────────
    const CATEGORIES = ["health", "school", "mood", "items", "general"];
    function renderHandoffs(el) {
      if (!canManage()) { el.innerHTML = `<div class="empty">Handoff notes are shared between the parents.</div>`; return; }

      // Notes are grouped under the exchange they were written for. The
      // association is derived by date (see groupNotesByTransition) — notes
      // that match no transition still appear, under "Other notes", because an
      // append-only record must never become invisible.
      // The loaded window reaches six weeks back; a note older than that needs
      // its handoff fetched before it can be filed under it.
      ensureOlderTransitions();
      const { groups, unanchored } = groupNotesByTransition(handoffs, [...olderTransitions, ...custodyDays], todayStr());

      const groupHtml = groups.map(g => `
        <div class="card">
          <div class="spread" style="margin-bottom:8px">
            <div>
              <strong>${esc(g.transition.title)}</strong>
              <div class="muted">${esc(fmtHandoffDay(g.transition.day))}${g.transition.exchange_time ? ` · ${esc(fmtExchangeTimeLabel(g.transition))}` : ""}</div>
            </div>
            <span class="badge ${g.isUpcoming ? "b-pending" : "b-cancelled"}">${g.isUpcoming ? "Upcoming" : "Past"}</span>
          </div>
          ${g.notes.map(h => noteRow(h)).join("")}
          ${g.isUpcoming ? `<div style="margin-top:10px"><button class="btn btn-sm" data-addfor="${esc(g.transition.child_id)}|${esc(g.transition.day)}">+ Add another note</button></div>` : ""}
        </div>`).join("");

      // What happened at the exchanges of the last two weeks. Each is one
      // parent's account; the other parent answers it rather than editing it.
      const recent = recentTransitions(custodyDays, todayStr());
      const recentHtml = recent.length ? `
        <div class="card" data-testid="recent-exchanges">
          <div class="spread" style="margin-bottom:8px">
            <strong>Recent exchanges</strong>
            <span class="muted">What actually happened</span>
          </div>
          ${recent.map(t => exchangeRow(t)).join("")}
        </div>` : "";

      const otherHtml = unanchored.length ? `
        <div class="card">
          <div class="spread" style="margin-bottom:8px">
            <strong>Other notes</strong>
            <span class="muted">Not tied to an exchange</span>
          </div>
          ${unanchored.map(h => noteRow(h, { dated: true })).join("")}
        </div>` : "";

      const body = recentHtml + ((groups.length || unanchored.length)
        ? groupHtml + otherHtml
        : `<div class="empty"><div>${chickadee("nest", { size: 72 })}</div>No handoff notes yet.<br><span class="muted">Write one ahead of the next exchange — meds, school, mood, items to pack.</span></div>`);

      el.innerHTML = `
        <div class="spread" style="margin-bottom:12px">
          <span class="muted">Notes for an exchange — meds, school, mood, items to pack.</span>
          ${childIds().length ? `<button class="btn btn-primary btn-sm" data-newnote>+ Add note</button>` : ""}
        </div>
        ${childIds().length ? body : `<div class="empty">Add a custody schedule in Setup first.</div>`}`;

      el.querySelector("[data-newnote]")?.addEventListener("click", () => openHandoffModal());
      el.querySelectorAll("[data-addfor]").forEach(b => b.addEventListener("click", () => {
        const [child_id, day] = b.dataset.addfor.split("|");
        openHandoffModal({ child_id, day });
      }));
      el.querySelectorAll("[data-outcome]").forEach(b => b.addEventListener("click", () => {
        const [child_id, day, kind] = b.dataset.outcome.split("|");
        const t = recent.find(r => r.child_id === child_id && r.day === day);
        if (kind === "exchange_as_planned") saveLogEntry({ child_id, day, kind }, b, "Happened as planned");
        else openOutcomeModal(t, kind);
      }));
      el.querySelectorAll("[data-answer]").forEach(b => b.addEventListener("click", () => {
        const [entryId, kind] = b.dataset.answer.split("|");
        const entry = custodyLog.find(e => e.id === entryId);
        if (!entry) return;
        if (kind === "acknowledge") saveLogEntry({ child_id: entry.child_id, day: entry.day, kind, responds_to_id: entry.id }, b, "Acknowledge");
        else openResponseModal(entry);
      }));
    }

    const OUTCOME_LABEL = {
      exchange_as_planned: "Happened as planned",
      exchange_late: "Late",
      exchange_missed: "Didn't happen",
      disputed: "Disputed",
    };

    function exchangeRow(t) {
      const o = exchangeOutcome(custodyLog, t.child_id, t.day);
      const when = `${esc(fmtHandoffDay(t.day, todayStr()))}${t.exchange_time ? ` · ${esc(fmtExchangeTimeLabel(t))}` : ""}`;
      // The journal is append-only, so a mistake is corrected by appending: a
      // parent's LATEST account is the one that stands, and their latest answer
      // to the other parent's standing account is the one that counts. The
      // controls therefore never go away — they change from "record" to
      // "correct" — and an entry that has been replaced says so.
      const standingIds = new Set(o.standing.map(e => e.id));
      const myStanding = o.standing.find(e => e.created_by === me?.id) ?? null;
      const head = `
        <div class="spread">
          <div><strong>${esc(t.title)}</strong><div class="muted">${when}</div></div>
          ${o.state === "unrecorded" ? "" : `<span class="badge ${o.state === "disputed" ? "b-pending" : o.state === "exchange_as_planned" ? "b-locked" : "b-cancelled"}">${esc(OUTCOME_LABEL[o.state] ?? o.state)}</span>`}
        </div>`;
      const entries = o.entries.map(e => {
        const answered = o.responses.filter(r => r.responds_to_id === e.id);
        const mine = e.created_by === me?.id;
        const stands = standingIds.has(e.id);
        // My answer that currently counts against this entry, if any.
        const myAnswer = o.current.find(r => r.created_by === me?.id && r.responds_to_id === e.id) ?? null;
        const answerButtons = mine || !stands ? "" : `
              <div style="margin:4px 0 0 12px">
                ${myAnswer?.kind === "acknowledge" ? "" : `<button class="btn btn-sm" data-answer="${esc(e.id)}|acknowledge">${myAnswer ? "Acknowledge instead" : "Acknowledge"}</button>`}
                ${myAnswer?.kind === "dispute" ? "" : `<button class="btn btn-sm" data-answer="${esc(e.id)}|dispute">${myAnswer ? "Dispute instead…" : "Dispute…"}</button>`}
              </div>`;
        return `
          <div class="muted" style="margin-top:6px${stands ? "" : ";opacity:.7"}" data-entry="${esc(e.id)}">
            ${esc(memberName(e.created_by))}: <b>${esc(OUTCOME_LABEL[e.kind] ?? e.kind)}</b>${e.actual_time ? ` at ${esc(fmtExchangeTime(e.actual_time))}` : ""}${e.note ? ` — ${esc(e.note)}` : ""}${stands ? "" : ` <span class="note-cat">replaced</span>`}
            ${answered.map(r => `<div style="margin-left:12px">${esc(memberName(r.created_by))} ${r.kind === "dispute" ? "disputes this" : "acknowledges this"}${r.note ? `: ${esc(r.note)}` : ""}</div>`).join("")}
            ${answerButtons}
          </div>`;
      }).join("");
      // Correcting offers the outcomes other than the one already standing.
      const outcomeBtn = (kind, label, primary) => myStanding?.kind === kind && kind === "exchange_as_planned" ? ""
        : `<button class="btn btn-sm${primary && !myStanding ? " btn-primary" : ""}" data-outcome="${esc(t.child_id)}|${esc(t.day)}|${kind}">${label}</button>`;
      const buttons = `
        <div class="row" style="margin-top:8px;gap:6px;flex-wrap:wrap" data-testid="${myStanding ? "exchange-correct" : "exchange-record"}">
          ${myStanding ? `<span class="muted">Correct your account:</span>` : ""}
          ${outcomeBtn("exchange_as_planned", "Happened as planned", true)}
          ${outcomeBtn("exchange_late", "Late…", false)}
          ${outcomeBtn("exchange_missed", "Didn't happen…", false)}
        </div>`;
      return `<div data-testid="exchange-row" data-exchange="${esc(t.child_id)}|${esc(t.day)}" style="padding:8px 0;border-top:1px solid var(--hub-border,#f3f4f6)">${head}${entries}${buttons}</div>`;
    }

    // The views that draw from the journal: the exchange list and its notes,
    // and the calendar's "recorded otherwise" markers and monthly totals.
    const JOURNAL_VIEWS = new Set(["handoffs", "schedule"]);
    let journalVersion = 0;        // bumped on a local append, so a stale read cannot unsend it
    let journalRefresh = null;
    /** New journal rows were adopted while a modal covered the view. Paid by
     *  closeModal, and cleared by any render, which draws them anyway. */
    let journalRedrawOwed = false;

    /**
     * Re-read the journal and the handoff notes. The other parent's entries,
     * answers and notes arrive no other way — there is no realtime channel —
     * so this runs when a journal view is opened and when the app is returned
     * to on one. One at a time; a read that a local append overtook is dropped.
     */
    function refreshJournal() {
      if (DEMO || !canManage() || loadFailed) return Promise.resolve();
      if (journalRefresh) return journalRefresh;
      const versionBefore = journalVersion;
      journalRefresh = Promise.all([
        db(`SELECT * FROM ${P}custody_log ORDER BY day DESC, created_at DESC`),
        db(`SELECT * FROM ${P}handoff_notes ORDER BY note_date DESC, created_at DESC`),
      ]).then(([log, notes]) => {
        if (versionBefore !== journalVersion) return;
        const sameIds = (a, b) => a.length === b.length && a.every((row, i) => row.id === b[i]?.id);
        const changed = !sameIds(log.rows, custodyLog) || !sameIds(notes.rows, handoffs);
        custodyLog = log.rows; handoffs = notes.rows;
        if (!changed || !JOURNAL_VIEWS.has(view)) return;
        // Not while a modal is open: redrawing the view under it is harmless,
        // but the modal's own text was drawn from the old rows. The redraw is
        // OWED instead, and paid when the modal closes — the rows are already
        // adopted, so no later refresh would see a difference and draw them.
        if (modalEl) journalRedrawOwed = true;
        else render();
      })
        // Non-fatal: the rows already shown stay, and the next look tries again.
        .catch(() => {})
        .finally(() => { journalRefresh = null; });
      return journalRefresh;
    }

    /** Append one journal entry. `btn` is disabled while it saves; the entry is
     *  shown at once and the other parent is told. */
    async function saveLogEntry(data, btn, label) {
      if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
      const now = new Date().toISOString();
      try {
        let id = crypto.randomUUID();
        if (!DEMO) {
          // An answer goes through its own record, which the hub refuses unless
          // the entry it names exists and is one this parent can read.
          // And "where the child was" has its own, which requires a parent.
          const record = data.kind === "acknowledge" || data.kind === "dispute" ? "custody_answers"
            : data.kind === "child_with" ? "custody_facts" : "custody_log";
          const r = await appendRecord(record, data);
          id = r.id ?? id;
        }
        // A refresh that read the table after the hub stored this entry, and
        // landed before the append's own answer did, has already adopted it.
        // Replace that copy rather than add a second one: the same entry drawn
        // twice reads as two accounts.
        custodyLog = custodyLog.filter(e => e.id !== id);
        custodyLog.unshift({ id, parent_id: null, actual_time: null, responds_to_id: null, note: null, ...data, created_by: me?.id, created_at: now });
        journalVersion++;
        closeModal(); render();
        const what = data.kind === "child_with" ? `recorded where ${memberName(data.child_id)} was on ${fmtHandoffDay(data.day)}`
          : data.kind === "acknowledge" || data.kind === "dispute" ? `${data.kind === "dispute" ? "disputed" : "acknowledged"} your entry for ${fmtHandoffDay(data.day)}`
          : `recorded ${memberName(data.child_id)}'s exchange on ${fmtHandoffDay(data.day)}: ${(OUTCOME_LABEL[data.kind] ?? data.kind).toLowerCase()}`;
        notifyPartner("Custody journal", `${me?.name} ${what}.`, { view: "handoffs" });
        return true;
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = label ?? "Save"; }
        console.error("save journal entry failed", e);
        // An answer names the entry it answers: a 404 or 409 is about THAT entry.
        hubAlert(failureLine(e, { action: "save the journal entry", thing: "journal entry" }));
        return false;
      }
    }

    function openOutcomeModal(t, kind) {
      const late = kind === "exchange_late";
      openModal(`
        <h3>${late ? "Late exchange" : "Exchange didn't happen"}</h3>
        <p class="muted">${esc(t.title)} · ${esc(fmtHandoffDay(t.day, todayStr()))}${t.exchange_time ? ` · planned ${esc(fmtExchangeTimeLabel(t))}` : ""}</p>
        ${late ? `<label class="field"><span>Actual time</span><input type="time" id="o-time" data-autofocus value="${esc(t.exchange_time ?? "")}"></label>` : ""}
        <label class="field"><span>Note (optional)</span><textarea id="o-note" ${late ? "" : "data-autofocus"} maxlength="2000" placeholder="${late ? "e.g. Traffic on the bridge." : "e.g. No one at the pickup point; waited 30 minutes."}"></textarea></label>
        <p class="hint">This is your account. ${esc(memberName(partnerId) || "The other parent")} can acknowledge or dispute it, and both accounts stay on the record.</p>
        <div class="modal-actions">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" id="save-outcome">Record</button>
        </div>`);
      modalEl.querySelector("#save-outcome").addEventListener("click", async () => {
        const actual_time = late ? modalEl.querySelector("#o-time").value : "";
        if (late && !/^\d{2}:\d{2}$/.test(actual_time)) { modalEl.querySelector("#o-time").focus(); return; }
        const note = modalEl.querySelector("#o-note").value.trim();
        await saveLogEntry({ child_id: t.child_id, day: t.day, kind, ...(late ? { actual_time } : {}), ...(note ? { note } : {}) },
          modalEl.querySelector("#save-outcome"), "Record");
      });
    }

    function openResponseModal(entry) {
      openModal(`
        <h3>Dispute this entry</h3>
        <p class="muted">${esc(memberName(entry.created_by))} recorded: <b>${esc(OUTCOME_LABEL[entry.kind] ?? entry.kind)}</b>${entry.actual_time ? ` at ${esc(fmtExchangeTime(entry.actual_time))}` : ""} for ${esc(memberName(entry.child_id))} on ${esc(fmtHandoffDay(entry.day, todayStr()))}.</p>
        <label class="field"><span>Your account</span><textarea id="r-note" data-autofocus maxlength="2000" placeholder="What happened, as you saw it."></textarea></label>
        <div class="modal-actions">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" id="save-response">Record dispute</button>
        </div>`);
      modalEl.querySelector("#save-response").addEventListener("click", async () => {
        const note = modalEl.querySelector("#r-note").value.trim();
        if (!note) { modalEl.querySelector("#r-note").focus(); return; }
        await saveLogEntry({ child_id: entry.child_id, day: entry.day, kind: "dispute", responds_to_id: entry.id, note },
          modalEl.querySelector("#save-response"), "Record dispute");
      });
    }

    function openActualModal(child_id, day, plannedParentId) {
      const existing = actualParentForDay(custodyLog, child_id, day);
      const choices = adults().filter(m => m.id === plannedParentId || schedules.some(s => s.child_id === child_id && (s.parent_a_id === m.id || s.parent_b_id === m.id)));
      openModal(`
        <h3>Where was ${esc(memberName(child_id))}?</h3>
        <p class="muted">${esc(fmtHandoffDay(day, todayStr()))}${plannedParentId ? ` · agreed schedule: with ${esc(memberName(plannedParentId))}` : ""}</p>
        ${existing ? `<p class="muted">${existing.entries.map(e => `${esc(memberName(e.created_by))} recorded: with ${esc(memberName(e.parent_id))}`).join("<br>")}</p>` : ""}
        <div class="field"><span>Actually with</span>
          ${choices.map(m => `<label class="row" style="gap:8px"><input type="radio" name="actual" value="${esc(m.id)}" ${m.id === plannedParentId ? "checked" : ""}> ${esc(m.name)}</label>`).join("")}
        </div>
        <label class="field"><span>Note (optional)</span><textarea id="a-note" maxlength="2000"></textarea></label>
        <div class="modal-actions">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" id="save-actual">Record</button>
        </div>`);
      modalEl.querySelector("#save-actual").addEventListener("click", async () => {
        const parent_id = modalEl.querySelector('input[name="actual"]:checked')?.value;
        if (!parent_id) return;
        const note = modalEl.querySelector("#a-note").value.trim();
        await saveLogEntry({ child_id, day, kind: "child_with", parent_id, ...(note ? { note } : {}) },
          modalEl.querySelector("#save-actual"), "Record");
      });
    }

    // `dated` for a note with no handoff heading above it to say when: under
    // "Other notes" the row itself is the only place the date can appear.
    function noteRow(h, { dated = false } = {}) {
      return `
        <div style="padding:8px 0;border-top:1px solid var(--hub-border,#f3f4f6)">
          <div class="row" style="margin-bottom:4px">
            <span class="note-cat">${esc(h.category)}</span>
            <span class="muted">${esc(memberName(h.child_id))}${dated && h.note_date ? ` · ${esc(fmtHandoffDay(h.note_date))}` : ""}</span>
          </div>
          <div style="white-space:pre-wrap;word-break:break-word">${esc(h.body)}</div>
          <p class="muted" style="margin:6px 0 0">— ${esc(memberName(h.created_by))}</p>
        </div>`;
    }

    // ── Setup view ───────────────────────────────────────────────────────────
    function renderSetup(el) {
      if (!canManage()) { el.innerHTML = `<div class="empty">Only a parent can configure Co-Parenting.</div>`; return; }
      const others = adults().filter(m => me && m.id !== me.id);
      const suggested = partnerId ? null : likelyCoParent();
      const pairStatus = {
        unpaired: suggested
          ? `<p class="muted">Confirm <b>${esc(suggested.name)}</b> as your co-parent to enable swap requests.</p>`
          : `<p class="muted">Not paired yet. Choose your co-parent so you can send each other swap requests.</p>`,
        active: `<p>${glyph("tick")} Paired with <b>${esc(memberName(partnerId))}</b>.</p>`,
        awaiting: `<p>${glyph("hourglass")} You chose <b>${esc(memberName(partnerId))}</b> — waiting for them to choose you back. We've let them know.</p>`,
        ended: `<p>${glyph("warning")} Your pairing with <b>${esc(memberName(partnerId))}</b> has ended. Everything already recorded is kept.</p>`,
      }[currentPairingState()];
      // Pre-checked, never pre-saved: the radio still has to be confirmed, so
      // nobody is named a swap counterparty without a deliberate act.
      const checkedId = partnerId ?? suggested?.id ?? null;

      // One row per child, showing the agreed version and — separately, never
      // mixed in with it — any proposal awaiting a countersignature. A pending
      // amendment must never read as though it were the schedule.
      const scheduledChildIds = [...new Set([
        ...schedules.map(s => s.child_id),
        ...versions.filter(v => v.status === "pending" || v.status === "draft").map(v => v.child_id),
        // A child whose only schedule work so far is this parent's private
        // draft still needs a row — otherwise the draft is saved somewhere the
        // author cannot find it again.
        ...drafts.map(d => d.child_id),
      ])].filter(Boolean);

      const schedRows = scheduledChildIds.length ? scheduledChildIds.map(cid => {
        const agreed = agreedVersion(versions, cid);
        const pending = openAmendment(versions, cid);
        const signed = pending ? signedElsewhere.has(pending.id) : false;
        const stance = pending ? amendmentStance(pending, me?.id, signed) : null;
        const changed = pending && agreed ? describeScheduleChange(agreed, pending) : null;
        const draft = draftFor(cid);
        const draftBlocker = draft ? draftSendBlocker(draft, agreed, spaceTimeZone) : null;
        const agreedEnded = scheduleHasEnded(agreed, todayStr());
        return `
        <div style="padding:8px 0;border-top:1px solid var(--hub-border,#eee)">
          <div class="spread">
            <div>
              <strong>${esc(memberName(cid))}</strong>
              ${agreed
                ? `<div class="muted">${esc(patternLabel(agreed))} · ${esc(memberName(agreed.parent_a_id))} / ${esc(memberName(agreed.parent_b_id))}
                     ${agreed.effective_to ? ` · ${agreedEnded ? "ended" : "ends"} ${esc(agreed.effective_to)}` : ""}</div>
                   <div class="muted">${versionSignatures(agreed) === "both"
                     ? (agreed.countersigned_at
                       // Signed by the second parent after it took effect: two
                       // dates, so it never reads as agreed by both from the start.
                       ? `In force since ${esc(fmtDateTime(agreed.agreed_at))} · countersigned ${esc(fmtDateTime(agreed.countersigned_at))}`
                       : `Countersigned ${esc(fmtDateTime(agreed.agreed_at))}`)
                     // In force, and NOT countersigned: the hub locks on one
                     // signature when there is no second parent to ask. Read
                     // off the row's own signatures, so it stays true later.
                     : `In force since ${esc(fmtDateTime(agreed.agreed_at))} on one parent's signature — nobody else was here to countersign it`}
                     · days counted in ${esc(agreed.timezone ?? "UTC")}</div>
                   ${unilateralStance(agreed, me?.id) === "unsigned_parent" && !agreedEnded
                     // The one reader this version can surprise: it was never
                     // put to them as a proposal, so say so and name the remedy.
                     ? `<div class="muted">${glyph("warning")} ${esc(agreed.proposed_by ? memberName(agreed.proposed_by) : "The other parent")} put this in force
                          on their signature alone. You have not signed it — countersign it if it is what you agreed, or propose a change.</div>`
                     : ""}`
                : `<div class="muted">No agreed schedule yet.</div>`}
            </div>
            <div class="row">
              ${unilateralStance(agreed, me?.id) === "unsigned_parent" && !agreedEnded
                ? `<button class="btn btn-primary btn-sm" data-latesign="${esc(agreed.id)}">Countersign</button>` : ""}
              ${pending || draft ? "" : `<button class="btn btn-sm" data-editsch="${esc(cid)}">${agreedEnded ? "Propose a new schedule" : agreed ? "Propose change" : "Propose schedule"}</button>`}
              ${agreed && !pending && !agreedEnded ? `<button class="btn btn-sm btn-danger" data-retiresch="${esc(agreed.id)}">Propose ending it</button>` : ""}
            </div>
          </div>
          ${pending ? `
            <div class="card" style="margin:8px 0 0">
              <strong>${glyph("hourglass")} Change proposed${pending.proposed_by ? ` by ${esc(memberName(pending.proposed_by))}` : ""}</strong>
              <div class="muted">${changed ? `Changes ${esc(changed)}.` : "Sets the standing schedule."}
                ${pending.rationale ? ` “${esc(pending.rationale)}”` : ""}</div>
              <div class="muted">${esc(patternLabel(pending))} · from ${esc(pending.anchor_date ?? "?")}
                ${pending.exchange_time ? ` · exchange ${esc(pending.exchange_time)}` : ""}
                · days counted in ${esc(pending.timezone ?? "UTC")}</div>
              <p class="muted" style="margin:6px 0 0">${stance === "awaiting_them"
                ? "Waiting for your co-parent to countersign. The current schedule stays in force until they do."
                : "This takes effect only once you countersign it."}</p>
              <div class="row" style="margin-top:8px;gap:8px">
                ${canSignAmendment(pending, me?.id, signed)
                  ? `<button class="btn btn-primary btn-sm" data-signsch="${esc(pending.id)}">Countersign</button>` : ""}
                <button class="btn btn-sm btn-danger" data-declinesch="${esc(pending.id)}">${
                  pending.proposed_by === me?.id ? "Withdraw" : "Decline"}</button>
              </div>
            </div>` : ""}
          ${draft ? `
            <div class="card" style="margin:8px 0 0">
              <strong>${glyph("pencil")} Your draft — only you can see this</strong>
              <div class="muted">${esc(patternLabel(draft))}${draft.anchor_date ? ` · from ${esc(draft.anchor_date)}` : ""}
                ${draft.exchange_time ? ` · exchange ${esc(draft.exchange_time)}` : ""}
                ${draft.timezone ? ` · days counted in ${esc(draft.timezone)}` : ""}</div>
              <p class="muted" style="margin:6px 0 0">Your co-parent has not been told about this and cannot see it.
                ${draftBlocker ? esc(draftBlocker) : "Sending it asks them to countersign — it takes effect only when they do."}</p>
              <div class="row" style="margin-top:8px;gap:8px">
                <button class="btn btn-sm" data-editdraft="${esc(cid)}">Keep working on it</button>
                ${draftBlocker ? "" : `<button class="btn btn-primary btn-sm" data-senddraft="${esc(cid)}">Send to your co-parent</button>`}
                <button class="btn btn-sm btn-danger" data-dropdraft="${esc(draft.id)}">Discard</button>
              </div>
            </div>` : ""}
        </div>`;
      }).join("") : `<p class="muted">No schedules yet.</p>`;

      el.innerHTML = `
        <div class="card">
          <h3>Co-parent</h3>
          ${pairStatus}
          <div class="radio-list" style="margin-top:8px">
            ${others.length ? others.map(m => `
              <label><input type="radio" name="partner" value="${esc(m.id)}" ${m.id === checkedId ? "checked" : ""}>
              <span class="avatar" style="background:${memberColor(m.id, members)}">${esc(initial(m.name))}</span> ${esc(m.name)}</label>
            `).join("") : `<p class="muted">No other adults in this household yet.</p>`}
          </div>
          ${others.length ? `<button class="btn btn-primary btn-sm" id="save-partner">${suggested ? `Confirm ${esc(suggested.name)}` : "Save co-parent"}</button>` : ""}
          ${partnerId ? `<button class="btn btn-sm" id="unpair">End pairing</button>` : ""}
        </div>
        <div class="card">
          <div class="spread"><h3 style="margin:0">Custody schedules</h3>
            <button class="btn btn-primary btn-sm" data-newsch>+ Add child</button></div>
          <p class="hint" style="margin:4px 0 0">The standing schedule is an agreement: once you are both here it changes
            only when both parents countersign, and every version that has been in force is kept.</p>
          ${schedRows}
        </div>`;

      el.querySelector("#save-partner")?.addEventListener("click", onSavePartner);
      el.querySelector("#unpair")?.addEventListener("click", unpair);
      el.querySelector("[data-newsch]")?.addEventListener("click", () => openScheduleModal(null));
      el.querySelectorAll("[data-editsch]").forEach(b =>
        b.addEventListener("click", () => openScheduleModal(
          agreedVersion(versions, b.dataset.editsch), draftFor(b.dataset.editsch))));
      el.querySelectorAll("[data-editdraft]").forEach(b =>
        b.addEventListener("click", () => openScheduleModal(
          agreedVersion(versions, b.dataset.editdraft), draftFor(b.dataset.editdraft))));
      el.querySelectorAll("[data-senddraft]").forEach(b =>
        b.addEventListener("click", () => onSendDraft(b.dataset.senddraft)));
      el.querySelectorAll("[data-dropdraft]").forEach(b =>
        b.addEventListener("click", () => discardDraft(b.dataset.dropdraft)));
      el.querySelectorAll("[data-retiresch]").forEach(b =>
        b.addEventListener("click", () => onProposeRetirement(b.dataset.retiresch)));
      el.querySelectorAll("[data-signsch]").forEach(b =>
        b.addEventListener("click", () => onSignAmendment(b.dataset.signsch)));
      el.querySelectorAll("[data-latesign]").forEach(b =>
        b.addEventListener("click", () => onCountersignInForce(b.dataset.latesign)));
      el.querySelectorAll("[data-declinesch]").forEach(b =>
        b.addEventListener("click", () => onDeclineAmendment(b.dataset.declinesch)));
    }

    /** Children with no schedule work at all yet — the only ones "+ Add child"
     *  may start one for. Rule lives in logic.js (tested). */
    function newScheduleChildren() {
      return childrenOpenForNewSchedule(members.filter(m => !isAdult(m, members)), versions, drafts);
    }

    /** The co-parent's name where there is one to name. memberName() answers
     *  "Unknown" for nobody, which is right in a list and wrong in a sentence. */
    function coParentLabel() {
      return partnerId && memberMap.has(partnerId) ? memberName(partnerId) : "your co-parent";
    }

    /**
     * What sending a proposal will do, said without promising a countersignature
     * that may never be asked for.
     *
     * The app cannot see households, so it cannot know in advance whether the
     * hub will find a second party: with none (a household install, or a space
     * the other parent has not joined) the proposal takes effect on this
     * parent's signature alone. Both outcomes are stated, and the one that
     * actually happened is reported afterwards (see announceProposal).
     */
    const PROPOSAL_EFFECT = "If your co-parent is here, this takes effect only once they countersign it. "
      + "If you are the only parent here so far, there is nobody to countersign and it takes effect "
      + "straight away on your signature alone — save it as a draft instead if you would rather wait for them.";

    // ══════════════════════════════════════════════════════════════════════════
    //  Modals
    // ══════════════════════════════════════════════════════════════════════════
    let modalEl = null;
    function openModal(html) {
      closeModal();
      modalEl = document.createElement("div");
      modalEl.className = "modal-backdrop";
      modalEl.innerHTML = `<div class="modal">${html}</div>`;
      modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
      document.body.appendChild(modalEl);
      modalEl.querySelector("[data-close]")?.addEventListener("click", closeModal);
      focusAutofocus(modalEl);
    }
    function closeModal() {
      modalEl?.remove(); modalEl = null;
      // Cancelled or saved, the view underneath may be showing rows older than
      // the ones a refresh adopted while this was open (see refreshJournal).
      if (journalRedrawOwed) {
        journalRedrawOwed = false;
        if (JOURNAL_VIEWS.has(view)) render();
      }
    }
    function focusAutofocus(root) {
      const t = root.querySelector("[data-autofocus]");
      if (t) setTimeout(() => t.focus(), 30);
    }
    function optionList(ids, selected) {
      return ids.map(id => `<option value="${esc(id)}" ${id === selected ? "selected" : ""}>${esc(memberName(id))}</option>`).join("");
    }

    // Propose a standing-schedule amendment.
    //
    // `existing` is the currently AGREED version being amended (null for a
    // child that has none yet). The form is pre-filled from it so the other
    // parent is asked to countersign a specific difference rather than a fresh
    // schedule they have to diff themselves.
    function openScheduleModal(existing, draft = null) {
      // Amending, or continuing a draft, is about ONE child — the one the row
      // it was opened from belongs to. Only a brand-new schedule picks a child,
      // and then only from those with nothing started (see newScheduleChildren).
      const fixedChild = existing?.child_id ?? draft?.child_id ?? null;
      const kids = fixedChild
        ? members.filter(m => m.id === fixedChild)
        : newScheduleChildren();
      if (!fixedChild && !kids.length) {
        hubAlert(members.some(m => !isAdult(m, members))
          ? "Every child already has a schedule, a proposal or a draft. Change it from that child's row."
          : "There are no children here to make a schedule for yet.");
        return;
      }
      const adultIds = adults().map(a => a.id);
      // A draft wins the form's values over the agreed version it amends — it is
      // the author's own later thinking about the same schedule — while
      // `existing` stays the version being amended, which is what the proposal's
      // base_version_id and its change summary are computed against.
      const e = { ...(existing || {}), ...(draft || {}) };
      // The proposer's own zone is offered, and is the default when the tenant
      // has nothing better than UTC to suggest — see timeZoneChoices.
      let deviceZone = null;
      try { deviceZone = Intl.DateTimeFormat().resolvedOptions().timeZone || null; } catch { /* no Intl zone: offer what we have */ }
      const { zones, selected: zone } = timeZoneChoices({ current: e.timezone, space: spaceTimeZone, device: deviceZone });
      openModal(`
        <h3>${existing ? "Propose a schedule change" : "Propose a custody schedule"}</h3>
        <p class="hint">${esc(PROPOSAL_EFFECT)}${existing ? " Until then the current schedule stays in force." : ""}</p>
        <label class="field"><span>Child</span>
          <select id="f-child" ${fixedChild ? "disabled" : ""}>
            ${kids.length ? kids.map(k => `<option value="${esc(k.id)}" ${k.id === e.child_id ? "selected" : ""}>${esc(k.name)}</option>`).join("")
              // The child this row is for has left the roster; the id still
              // names the schedule, so keep it selectable rather than blank.
              : `<option value="${esc(fixedChild)}" selected>${esc(memberName(fixedChild))}</option>`}
          </select></label>
        <div class="row" style="gap:10px">
          <label class="field" style="flex:1"><span>Parent A</span><select id="f-pa">${optionList(adultIds, e.parent_a_id ?? me?.id)}</select></label>
          <label class="field" style="flex:1"><span>Parent B</span><select id="f-pb">${optionList(adultIds, e.parent_b_id ?? partnerId ?? adultIds.find(id => id !== me?.id))}</select></label>
        </div>
        <label class="field"><span>Pattern</span>
          <select id="f-pattern">
            <option value="alternating_weeks" ${e.pattern === "alternating_weeks" ? "selected" : ""}>Alternating weeks (7/7)</option>
            <option value="two_two_three" ${e.pattern === "two_two_three" ? "selected" : ""}>2-2-3 rotation</option>
            <option value="alternating_weekends" ${e.pattern === "alternating_weekends" ? "selected" : ""}>Alternating weekends (Fri–Sun)</option>
            <option value="custom" ${e.pattern === "custom" ? "selected" : ""}>Custom cycle</option>
          </select></label>
        <div id="f-custom-wrap" style="display:${e.pattern === "custom" ? "block" : "none"}">
          <label class="field"><span>Start from a named pattern</span>
            <select id="f-preset">
              <option value="">Write my own cycle</option>
              ${CYCLE_PRESETS.map(pre => `<option value="${esc(pre.key)}" ${presetForCycle(e.cycle)?.key === pre.key ? "selected" : ""}>${esc(pre.label)}</option>`).join("")}
            </select></label>
          <label class="field"><span>Cycle — a = Parent A day, b = Parent B day</span>
            <input id="f-cycle" placeholder="a,a,b,b,a,a,a" value="${esc(normalizeCycle(e.cycle).join(","))}"></label>
          <p class="hint">One letter per day; the sequence repeats. Picking a named pattern fills this in — edit it afterwards if your arrangement differs.</p>
        </div>
        <label class="field"><span>Cycle start date (day 1 of the pattern)</span>
          <input type="date" id="f-anchor" value="${esc(e.anchor_date ?? todayStr())}"></label>
        <p class="hint" id="f-anchor-hint">${esc(anchorHint(e.pattern ?? "alternating_weeks", e.cycle))}</p>
        <label class="field"><span>Exchange time (optional)</span>
          <input type="time" id="f-time" value="${esc(e.exchange_time ?? "")}"></label>
        <label class="field"><span>Custody days are counted in</span>
          <select id="f-tz">${zones.map(z => `<option value="${esc(z)}" ${z === zone ? "selected" : ""}>${esc(z)}</option>`).join("")}</select></label>
        <p class="hint">Whose midnight ends a custody day. Agreed as part of the schedule, so a
          later settings change can't quietly move a handoff — only a new countersigned change can.
          ${timeZoneDefaultSource({ current: e.timezone, space: spaceTimeZone, device: deviceZone }) === "device"
            ? "This was taken from your device, because no timezone has been set here. Check it is the one you both mean."
            : ""}</p>
        <label class="field"><span>Reason for the change (optional)</span>
          <textarea id="f-why" maxlength="500" placeholder="Why you're proposing this…">${esc(draft?.rationale ?? "")}</textarea></label>
        <div class="modal-actions">
          <button class="btn" data-close>Cancel</button>
          <button class="btn" id="save-draft">Save as draft</button>
          <button class="btn btn-primary" id="save-sch">Send for countersignature</button>
        </div>
        <p class="hint">A draft stays private to you — your co-parent is not told about it and cannot
          see it. Nothing is proposed to them until you send it.</p>`);
      const patSel = modalEl.querySelector("#f-pattern");
      const cycleEl = modalEl.querySelector("#f-cycle");
      const presetSel = modalEl.querySelector("#f-preset");
      /** The cycle as typed, for the hint and the preset picker's own state. */
      const typedCycle = () => parseCycleInput(cycleEl.value).cycle;
      const anchorEl = modalEl.querySelector("#f-anchor");
      const refreshHint = () => {
        const cycle = patSel.value === "custom" ? typedCycle() : compileCycle(patSel.value, []);
        // Advice, plus what this start date actually makes the pattern. The
        // read-back is the whole guard now: nothing refuses an "unusual"
        // anchor — a Saturday-Sunday rotation is a real arrangement — so the
        // form says which one you are about to propose instead.
        const named = nameForCycle(cycle, anchorEl.value);
        modalEl.querySelector("#f-anchor-hint").textContent =
          named ? `${anchorHint(patSel.value, typedCycle())} From this date it is ${named}.`
                : anchorHint(patSel.value, typedCycle());
      };
      anchorEl.addEventListener("change", refreshHint);
      patSel.addEventListener("change", () => {
        modalEl.querySelector("#f-custom-wrap").style.display = patSel.value === "custom" ? "block" : "none";
        refreshHint();
      });
      presetSel.addEventListener("change", () => {
        const preset = CYCLE_PRESETS.find(pre => pre.key === presetSel.value);
        // "Write my own" clears nothing: a parent who picked a preset and then
        // changed their mind still wants the fourteen letters in front of them
        // to edit, which is the whole reason the field stayed editable.
        if (preset) cycleEl.value = preset.cycle.join(",");
        refreshHint();
      });
      cycleEl.addEventListener("input", () => {
        // Typing a known shape by hand selects it too — and, more to the point,
        // brings its anchor advice up before the date is picked.
        presetSel.value = presetForCycle(typedCycle())?.key ?? "";
        refreshHint();
      });
      modalEl.querySelector("#save-sch").addEventListener("click", () => onProposeAmendment(existing, draft));
      modalEl.querySelector("#save-draft").addEventListener("click", () => onSaveDraft(existing, draft));
    }

    // Swap proposal
    function openSwapModal(preChild) {
      if (!partnerId) { hubAlert("Pair with your co-parent in Setup before proposing a swap."); return; }
      const live = swappableSchedules();
      if (!live.length) { hubAlert("There is no schedule in force for a swap to change."); return; }
      const kids = live.map(sch => sch.child_id);
      const parentsOf = (childId) => {
        const sch = live.find(x => x.child_id === childId) ?? live[0];
        return [sch.parent_a_id, sch.parent_b_id];
      };
      const firstChild = kids.includes(preChild) ? preChild : kids[0];
      // The furthest day a swap can start and still be countersigned — the hub
      // works the calendar out no further than this (see SWAP_HORIZON_DAYS).
      const lastStart = addDays(todayStr(), SWAP_HORIZON_DAYS);
      openModal(`
        <h3>Propose a swap</h3>
        <p class="hint">The other parent must agree before it changes the calendar.</p>
        <label class="field"><span>Child</span><select id="s-child">${kids.map(c => `<option value="${esc(c)}" ${c === firstChild ? "selected" : ""}>${esc(memberName(c))}</option>`).join("")}</select></label>
        <div class="row" style="gap:10px">
          <label class="field" style="flex:1"><span>From</span><input type="date" id="s-start" data-autofocus min="${esc(todayStr())}" max="${esc(lastStart)}" value="${esc(addDays(todayStr(), 1))}"></label>
          <label class="field" style="flex:1"><span>To</span><input type="date" id="s-end" min="${esc(todayStr())}" value="${esc(addDays(todayStr(), 1))}"></label>
        </div>
        <p class="hint">A swap can start up to ${SWAP_HORIZON_DAYS} days ahead (${esc(fmtHandoffDay(lastStart))}) — the calendar is worked out that far.</p>
        <label class="field"><span>Who should have them?</span><select id="s-parent">${optionList(parentsOf(firstChild), me?.id)}</select></label>
        <label class="field"><span>Note (optional)</span><textarea id="s-note" maxlength="500" placeholder="Reason for the swap…"></textarea></label>
        <div class="modal-actions">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" id="save-swap">Send request</button>
        </div>`);
      // The two parents are per child, so the choice follows the child picked.
      modalEl.querySelector("#s-child").addEventListener("change", (e) => {
        modalEl.querySelector("#s-parent").innerHTML = optionList(parentsOf(e.target.value), me?.id);
      });
      modalEl.querySelector("#save-swap").addEventListener("click", onCreateSwap);
    }

    // Handoff note
    // `preset` — a custody_days transition row to pre-select (from "Add note for
    // this handoff" on the schedule card).
    function openHandoffModal(preset) {
      const kids = childIds();
      const initialChild = preset?.child_id ?? kids[0];
      const initialDate  = preset?.day ?? todayStr();

      openModal(`
        <h3>Add handoff note</h3>
        <label class="field"><span>Child</span><select id="h-child">${kids.map(c =>
          `<option value="${esc(c)}" ${c === initialChild ? "selected" : ""}>${esc(memberName(c))}</option>`).join("")}</select></label>
        <label class="field"><span>For which handoff</span>
          <select id="h-when"></select>
        </label>
        <div class="row" style="gap:10px">
          <label class="field" style="flex:1"><span>Date</span><input type="date" id="h-date" value="${esc(initialDate)}"></label>
          <label class="field" style="flex:1"><span>Category</span><select id="h-cat">${CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join("")}</select></label>
        </div>
        <p class="hint" id="h-hint"></p>
        <label class="field"><span>Note</span><textarea id="h-body" data-autofocus maxlength="2000" placeholder="e.g. Needs library books returned Monday."></textarea></label>
        <div class="modal-actions">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" id="save-note">Add note</button>
        </div>`);

      // The picker and the date field are two views of one value. The picker is
      // the discoverable path (it knows when the next exchange actually is);
      // the date field stays because a note for an ordinary day is still valid.
      const whenEl = modalEl.querySelector("#h-when");
      const dateEl = modalEl.querySelector("#h-date");
      const childEl = modalEl.querySelector("#h-child");

      function refreshWhen() {
        const childId = childEl.value;
        const options = upcomingTransitions(custodyDays, todayStr(), { childId });
        whenEl.innerHTML = options.map(t =>
          `<option value="${esc(t.day)}">${esc(fmtHandoffDay(t.day))} · ${esc(t.title)}${t.exchange_time ? ` · ${esc(fmtExchangeTimeLabel(t))}` : ""}</option>`
        ).join("") + `<option value="">Another day…</option>`;
        // Keep whatever date is already chosen if it's one of the options.
        whenEl.value = options.some(t => t.day === dateEl.value) ? dateEl.value : "";
        syncHint();
      }
      function syncHint() {
        const hint = modalEl.querySelector("#h-hint");
        const filed = notesForTransition(handoffs, childEl.value, dateEl.value).length;
        hint.textContent = filed
          ? `${filed} note${filed === 1 ? "" : "s"} already filed for that day.`
          : "";
      }

      whenEl.addEventListener("change", () => {
        if (whenEl.value) dateEl.value = whenEl.value;
        syncHint();
      });
      dateEl.addEventListener("change", () => {
        whenEl.value = [...whenEl.options].some(o => o.value === dateEl.value) ? dateEl.value : "";
        syncHint();
      });
      childEl.addEventListener("change", refreshWhen);
      refreshWhen();

      modalEl.querySelector("#save-note").addEventListener("click", onSaveHandoff);
    }

    /** "6:00 PM" for a custody_days row, from its stored 'HH:MM'. */
    function fmtExchangeTimeLabel(t) {
      return (t.subtitle ?? "").replace(/^Handoff /, "");
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  Actions
    // ══════════════════════════════════════════════════════════════════════════
    async function onSavePartner() {
      const chosen = document.querySelector('input[name="partner"]:checked')?.value;
      if (!chosen) { hubAlert("Choose a co-parent first."); return; }
      await pairWith(chosen, document.getElementById("save-partner"), "Save co-parent");
    }

    /**
     * Record `chosen` as this member's co-parent.
     *
     * Pairing is one row per member — mine names them, theirs names me — and
     * it is only complete once BOTH exist. So the second parent has to act
     * too. Nudging them is what turns pairing
     * from a step you have to discover into one that completes itself.
     */
    async function pairWith(chosen, btn, restoreLabel) {
      if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
      try {
        if (!DEMO) {
          // The POST answers with the resulting pairing status, so no
          // follow-up GET is needed.
          applyPartnerStatus(await requestJson(`/run/${APP_ID}/api/partner`, {
            body: { partner_id: chosen }, fallbackError: "Could not save",
          }));
        } else { partnerId = chosen; partnerReciprocal = true; }
        // Notified directly rather than via notifyPartner, which targets the
        // *paired* partner — and from this side the pairing may not be mutual
        // yet, which is precisely what they are being asked to fix.
        if (!partnerReciprocal && !DEMO) {
          sendHubNotification({
            title: "Confirm your co-parent",
            body: `${me?.name} named you as their co-parent. Confirm to finish pairing.`,
            audience: [chosen],
            url: hubAppUrl(APP_ID, { view: "setup" }),
          }).catch(() => {});
        }
        render();
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = restoreLabel; }
        console.error("save co-parent failed", e);
        hubAlert(failureLine(e, { action: "save your co-parent", thing: "pairing" }));
      }
    }

    /**
     * Propose a standing-schedule amendment.
     *
     * Two calls, deliberately, and in this order:
     *
     *   1. `/api/propose-agreement` writes the amendment row. The app cannot
     *      write it directly — it is endpoint_only, and its party columns hold
     *      the two participating HOUSEHOLD ids, which the hub resolves from the
     *      live roster. That is what makes a supporting adult unable to propose
     *      a custody change, and what keeps a demoted-and-refilled co-parent
     *      seat a party to a proposal it did not personally make.
     *   2. `/api/agree` records the proposer's own signature, which is also
     *      what LOCKS the amendment when there is only one participating
     *      household (a household install, or a space the other parent never
     *      joined) — there is no second party to protect, so the same rule
     *      governed operations use applies here.
     *
     * The pattern the parents picked is compiled to a canonical cycle array
     * BEFORE it is sent, because that array is what gets countersigned and what
     * the hub projects. See compileCycle in logic.js.
     */
    /**
     * The schedule form's current values as raw draft fields.
     *
     * Deliberately unvalidated: a DRAFT is allowed to be half-finished — that is
     * the whole point of one — so the checks live at send time, in
     * onProposeAmendment and draftSendBlocker, not here. The cycle is compiled
     * on the way out either way, because the canonical day array is what a draft
     * has to carry for `draftProposalTerms` to produce the same proposal this
     * form would have.
     */
    function readScheduleForm(existing, draft = null) {
      const pattern = modalEl.querySelector("#f-pattern").value;
      // Read strictly: a letter that is not a or b is an error to show, not a
      // day to drop (see parseCycleInput). `cycleError` travels out so each
      // caller can decide what an unreadable cycle means for it.
      const typed = pattern === "custom" ? parseCycleInput(modalEl.querySelector("#f-cycle").value) : { cycle: [], error: null };
      const cycleArr = compileCycle(pattern, typed.cycle);
      return {
        cycleError: typed.error,
        cycleTyped: pattern === "custom" && modalEl.querySelector("#f-cycle").value.trim() !== "",
        // The row the form was opened from decides the child; the select is
        // only live for a brand-new schedule. A draft's child in particular
        // must come from the draft: saving UPDATEs that row by id and never
        // rewrites its child, so a child read off the select could name one
        // child while the save overwrote another's draft.
        child_id: existing?.child_id ?? draft?.child_id ?? modalEl.querySelector("#f-child").value,
        parent_a_id: modalEl.querySelector("#f-pa").value,
        parent_b_id: modalEl.querySelector("#f-pb").value,
        pattern,
        cycle: JSON.stringify(cycleArr),
        cycle_length: cycleArr.length,
        anchor_date: modalEl.querySelector("#f-anchor").value,
        exchange_time: modalEl.querySelector("#f-time").value || null,
        timezone: modalEl.querySelector("#f-tz").value,
        rationale: modalEl.querySelector("#f-why").value.trim() || null,
        base_version_id: existing?.id ?? null,
      };
    }

    async function onProposeAmendment(existing, draft = null) {
      const form = readScheduleForm(existing, draft);
      const { child_id, parent_a_id, parent_b_id, pattern, anchor_date } = form;
      // Already compiled by readScheduleForm; re-read rather than re-derived so
      // a draft and a directly-typed proposal cannot compile differently.
      const cycleArr = normalizeCycle(form.cycle);

      if (!child_id) { hubAlert("Pick a child."); return; }
      if (parent_a_id === parent_b_id) { hubAlert("The two parents must be different people."); return; }
      if (!anchor_date) { hubAlert("Pick a cycle start date."); return; }
      if (form.cycleError) { hubAlert(form.cycleError); return; }
      if (!cycleArr.length) { hubAlert("That pattern can’t be worked out into a rotation."); return; }

      // The SAME function a saved draft is sent through, so the two lanes
      // cannot build different proposals from the same fields — which they
      // did: this one used to copy the amended version's end date forward.
      const terms = scheduleProposalTerms(form, spaceTimeZone);
      if (!terms) { hubAlert("This schedule is missing something — check the pattern, start date and parents."); return; }
      // Nothing to countersign is not a proposal. Refused here rather than sent,
      // so the other parent is never asked to sign an identical schedule.
      if (existing && !describeScheduleChange(existing, terms)) {
        hubAlert("Nothing has changed, so there is nothing to propose.");
        return;
      }

      const btn = modalEl.querySelector("#save-sch");
      btn.disabled = true; btn.textContent = "Sending…";
      try {
        const result = await proposeAndSign(terms);
        // The draft existed to hold work that was not yet a proposal. It is one
        // now, and the amendment row is the record — a surviving draft would be
        // a second, private, silently diverging copy of the same schedule.
        if (draft) await discardDraft(draft.id, { silent: true });
        closeModal();
        currentChildId = child_id;
        await loadData();
        render();
        notifySchedule(
          result.locked ? "Custody schedule updated" : "Custody schedule change proposed",
          result.locked
            ? `${me?.name} set the standing schedule for ${memberName(child_id)}.`
            : `${me?.name} proposed a change to ${memberName(child_id)}'s schedule. It takes effect when you countersign it.`,
          { view: "setup" });
        announceProposal(result);
      } catch (e) {
        btn.disabled = false; btn.textContent = "Send for countersignature";
        // The refusal may be about a schedule that moved under this form (the
        // other parent's change was agreed meanwhile), so show what is true now.
        console.error("propose schedule failed", e);
        await loadData().catch(() => {});
        render();
        hubAlert(agreementFailureLine(e, {
          action: "send this schedule", thing: "custody schedule",
          // Proposed against a version that is no longer in force: say so.
          state: existing ? reReadState(versions, existing.id, "agreed") : undefined,
        }));
      }
    }

    /**
     * Write a proposal and put the proposer's signature on it — as one act, as
     * far as the app can make two hub calls one.
     *
     * They are two calls (see the note above onProposeAmendment), and the
     * second can be refused after the first has landed: the proposal names a
     * base version that was replaced a moment ago, say. That used to leave the
     * row behind as an open proposal nobody had signed and nobody had meant to
     * leave, blocking the next one. So a refused signature WITHDRAWS the
     * proposal it was for.
     *
     * And a retry must not propose twice. The hub mints the proposal's id, so
     * there is no client id to replay; instead the id of a proposal that was
     * written but could be neither signed nor withdrawn (the network went) is
     * remembered against its exact terms, and sending those terms again signs
     * THAT row.
     */
    let unsignedProposal = null;   // { key, id }

    async function proposeAndSign(terms) {
      const key = JSON.stringify(terms);
      let id = unsignedProposal?.key === key ? unsignedProposal.id : null;
      if (!id) {
        ({ id } = await requestJson(`/run/${APP_ID}/api/propose-agreement`, {
          body: { table: "schedule_versions", values: terms },
          fallbackError: "Could not record the proposal",
        }));
        unsignedProposal = { key, id };
      }
      try {
        const result = await agreeSchedule(id, true);
        unsignedProposal = null;
        return result;
      } catch (e) {
        // `resolution: true` resolves it the way the proposer's side resolves
        // (withdrawn), whether or not the agreement row exists yet.
