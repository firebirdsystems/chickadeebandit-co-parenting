        const withdrawn = await agreeSchedule(id, false, true).then(() => true, () => false);
        if (withdrawn) unsignedProposal = null;
        throw e;
      }
    }

    /** Tell the proposer when their proposal did NOT wait for anyone. `locked`
     *  on the proposer's own signature means the hub found no second party. */
    function announceProposal(result) {
      if (!result?.locked) return;
      hubAlert("There is no other parent here to countersign, so this took effect on your signature alone. "
        + "It is recorded as agreed by one parent, not as countersigned, and the other parent named on it is shown that.");
    }

    // ══════════════════════════════════════════════════════════════════════
    //  Private drafts
    //
    //  A draft is one parent's working copy of a schedule they have not
    //  proposed. It is the answer to the first hour of a co-parenting space,
    //  when the other parent has not arrived yet and every way of expressing
    //  what you want is a proposal addressed to nobody.
    //
    //  Three rules hold the feature together:
    //    1. Nobody but the author can read it — enforced by row_policies
    //       (owner_only, adults_bypass:false), not by this file.
    //    2. One per parent per child, updated in place — enforced by the
    //       policy's max_per_member, which is why saving UPDATEs an existing
    //       draft rather than inserting a second.
    //    3. Sending runs the ordinary proposal path unchanged, then deletes the
    //       draft. There is no such thing as a "sent draft".
    // ══════════════════════════════════════════════════════════════════════

    /** This parent's draft for a child, if they have one. */
    function draftFor(childId) {
      return drafts.find(d => d.child_id === childId) ?? null;
    }

    async function onSaveDraft(existing, draft) {
      const form = readScheduleForm(existing, draft);
      if (!form.child_id) { hubAlert("Pick a child."); return; }
      // A draft may be unfinished, and an EMPTY cycle is just that. A cycle
      // with a wrong letter in it is different: it would be saved as no cycle
      // at all, and the typing would be gone when the draft was reopened.
      if (form.cycleError && form.cycleTyped) { hubAlert(form.cycleError); return; }
      const btn = modalEl.querySelector("#save-draft");
      btn.disabled = true; btn.textContent = "Saving…";
      const now = new Date().toISOString();
      // A new draft's id is minted once per form and kept on its button, so a
      // second press after a lost answer looks for the first one's row instead
      // of inserting another (which the one-per-child cap would refuse).
      const newId = draft?.id ? null : (btn.dataset.rowId ||= crypto.randomUUID());
      // The draft's own columns, as the form holds them now.
      const fields = {
        parent_a_id: form.parent_a_id, parent_b_id: form.parent_b_id, pattern: form.pattern,
        cycle: form.cycle, cycle_length: form.cycle_length, anchor_date: form.anchor_date,
        exchange_time: form.exchange_time, timezone: form.timezone, rationale: form.rationale,
        base_version_id: form.base_version_id,
      };
      try {
        if (!DEMO) {
          // UPDATE, never a second INSERT: max_per_member caps this table at one
          // row per parent per child, so an insert here would be refused by the
          // policy rather than quietly making a duplicate.
          let updateId = draft?.id ?? null;
          if (!updateId) {
            try {
              // author_id is forced by the hub on insert (owner_only). Passing it
              // is how the SQL reads honestly, not how the value is decided.
              await db(`INSERT INTO ${P}schedule_drafts (id, author_id, child_id, parent_a_id, parent_b_id,
                          pattern, cycle, cycle_length, anchor_date, exchange_time, timezone, rationale,
                          base_version_id, created_at, updated_at)
                        VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)`,
                [newId, me?.id, form.child_id, form.parent_a_id, form.parent_b_id,
                 form.pattern, form.cycle, form.cycle_length, form.anchor_date, form.exchange_time,
                 form.timezone, form.rationale, form.base_version_id, now, now]);
            } catch (e) {
              // Unknown outcome, or the cap's 403 (an earlier press's row
              // already fills it): read back by the kept id. Found means an
              // earlier press landed.
              if (!outcomeUnknown(e) && e?.status !== 403) throw e;
              // The id is ours: with the read-back failed, a UNIQUE answer (or the
              // cap's 403) may be this form's own first press, so nothing is
              // known — "try again", not "already exists" or the permission line.
              const read = await db(`SELECT * FROM ${P}schedule_drafts WHERE id = ?`, [newId]).catch((readErr) => { console.error(readErr); return null; });
              if (!read) throw new Error("draft outcome unknown", { cause: e });
              const stored = read.rows?.[0];
              if (!stored) throw e;
              // An earlier press stored a draft for another child (the select
              // changed since): that one stands, and this child's gets its own id.
              if (stored.child_id !== form.child_id) { btn.dataset.rowId = crypto.randomUUID(); throw e; }
              console.error("draft was saved by an earlier press; its answer was lost", e);
              // Edited since that press: what the form holds now goes through
              // the ordinary update.
              if (storedDiffers(stored, fields)) updateId = newId;
            }
          }
          if (updateId) {
            await db(`UPDATE ${P}schedule_drafts SET parent_a_id=?, parent_b_id=?, pattern=?, cycle=?,
                        cycle_length=?, anchor_date=?, exchange_time=?, timezone=?, rationale=?,
                        base_version_id=?, updated_at=? WHERE id=?`,
              [form.parent_a_id, form.parent_b_id, form.pattern, form.cycle, form.cycle_length,
               form.anchor_date, form.exchange_time, form.timezone, form.rationale,
               form.base_version_id, now, updateId]);
          }
        }
        closeModal();
        await loadData();
        currentChildId = form.child_id;
        view = "setup";
        render();
      } catch (e) {
        btn.disabled = false; btn.textContent = "Save as draft";
        console.error("save draft failed", e);
        hubAlert(failureLine(e, { action: "save the draft", thing: "draft" }));
      }
    }

    /**
     * Send a saved draft as a proposal.
     *
     * The draft is checked against what is in force RIGHT NOW rather than
     * against what was in force when it was written: a draft written before the
     * other parent countersigned a change would otherwise propose reverting them
     * while looking like an ordinary edit. draftSendBlocker holds that rule; the
     * remedy is to reopen the draft, not to rebase it silently.
     */
    async function onSendDraft(childId) {
      const draft = draftFor(childId);
      const agreed = agreedVersion(versions, childId);
      const blocker = draftSendBlocker(draft, agreed, spaceTimeZone);
      if (blocker) {
        hubAlert(blocker);
        if (draft) openScheduleModal(agreed, draft);
        return;
      }
      const terms = draftProposalTerms(draft, spaceTimeZone);
      // Plain text: the hub's dialog escapes what it is given, so escaping
      // here as well put "&amp;" in front of a parent whose co-parent's name
      // has an ampersand in it.
      const ok = await hubConfirm({
        message: `Send this schedule to ${coParentLabel()}?`,
        // The zone is a term like any other, and this lane has no form in
        // front of it to show it — so it is said here, before it is signed.
        description: `Until now only you could see it. Custody days are counted in ${terms.timezone}. ${PROPOSAL_EFFECT}`,
        confirmLabel: "Send for countersignature",
      });
      if (!ok) return;
      try {
        const result = await proposeAndSign(terms);
        await discardDraft(draft.id, { silent: true });
        await loadData();
        render();
        announceProposal(result);
        notifySchedule(
          result.locked ? "Custody schedule updated" : "Custody schedule change proposed",
          result.locked
            ? `${me?.name} set the standing schedule for ${memberName(terms.child_id)}.`
            : `${me?.name} proposed a schedule for ${memberName(terms.child_id)}. It takes effect when you countersign it.`,
          { view: "setup" });
      } catch (e) {
        console.error("send draft failed", e);
        hubAlert(agreementFailureLine(e, { action: "send the draft", thing: "custody schedule" }));
      }
    }

    /** Delete a draft. Nothing else ever saw it, so there is nothing to retain
     *  and nobody to tell — unlike every other deletion in this app. */
    async function discardDraft(id, { silent = false } = {}) {
      if (!silent) {
        const ok = await hubConfirm({
          message: "Discard this draft?",
          description: "Only you could see it, so nothing is announced. This cannot be undone.",
          destructive: true,
        });
        if (!ok) return;
      }
      try {
        if (!DEMO) await db(`DELETE FROM ${P}schedule_drafts WHERE id = ?`, [id]);
        drafts = drafts.filter(d => d.id !== id);
        if (!silent) { await loadData(); render(); }
      } catch (e) {
        console.error("discard draft failed", e);
        if (!silent) hubAlert(failureLine(e, { action: "discard the draft", thing: "draft" }));
      }
    }

    /**
     * Propose retiring a schedule.
     *
     * There is no delete. A standing schedule is a record both parents rely on,
     * so ending one is an amendment like any other: the terms are unchanged
     * except for an end date, and it takes effect only when the other parent
     * countersigns. Every prior agreed version is kept regardless.
     */
    async function onProposeRetirement(versionId) {
      const current = versions.find(v => v.id === versionId);
      if (!current) return;
      const until = todayStr();
      const ok = await hubConfirm({
        message: `Propose ending ${memberName(current.child_id)}'s schedule?`,
        description: "Once it is agreed, custody days after "
          + `${until} stop being published; everything already agreed is kept. ${PROPOSAL_EFFECT}`,
        destructive: true,
      });
      if (!ok) return;
      try {
        // The one place an end date is set — scheduleProposalTerms never
        // carries one, so ending a schedule is always this deliberate act.
        const result = await proposeAndSign({
          child_id: current.child_id,
          parent_a_id: current.parent_a_id,
          parent_b_id: current.parent_b_id,
          pattern: current.pattern,
          cycle: current.cycle,
          cycle_length: current.cycle_length,
          anchor_date: current.anchor_date,
          exchange_time: current.exchange_time ?? null,
          timezone: current.timezone ?? spaceTimeZone,
          effective_from: current.effective_from ?? null,
          effective_to: until,
          rationale: "Ending this schedule.",
          base_version_id: current.id,
        });
        await loadData();
        render();
        notifySchedule(
          result.locked ? "Custody schedule ended" : "End of custody schedule proposed",
          result.locked
            ? `${me?.name} ended ${memberName(current.child_id)}'s standing schedule.`
            : `${me?.name} proposed ending ${memberName(current.child_id)}'s schedule. It stays in force until you countersign.`,
          { view: "setup" });
        announceProposal(result);
      } catch (e) {
        console.error("propose ending schedule failed", e);
        await loadData().catch(() => {});
        render();
        hubAlert(agreementFailureLine(e, {
          action: "propose ending this schedule", thing: "custody schedule",
          state: reReadState(versions, versionId, "agreed"),
        }));
      }
    }

    /** Countersign, decline, or withdraw a standing-schedule amendment. */
    function agreeSchedule(id, agreed, resolution, expectedSnapshot) {
      return requestJson(`/run/${APP_ID}/api/agree`, {
        body: {
          table: "schedule_versions", id, agreed,
          ...(resolution ? { resolution } : {}),
          ...(expectedSnapshot ? { expected_snapshot: expectedSnapshot } : {}),
        },
        fallbackError: "Could not record your decision",
      });
    }

    /**
     * Amendment ids the hub has told us this side had already signed.
     *
     * The app infers which side it is from who proposed, which is exact except
     * for a co-parent seat replaced while a proposal is open. `/api/agree`
     * answers that authoritatively — it resolves the caller's household live —
     * so one countersign attempt corrects the view for the rest of the session.
     */
    const signedElsewhere = new Set();

    async function onSignAmendment(id) {
      const amendment = versions.find(v => v.id === id);
      if (!amendment) return;
      const notifyAgreed = () => notifySchedule("Custody schedule agreed",
        `${me?.name} countersigned the change to ${memberName(amendment.child_id)}'s schedule. It's now in force.`,
        { view: "schedule" });
      try {
        const result = await agreeSchedule(id, true);
        // `already_agreed` with `locked` is a retry that finished the job (see
        // onSignHoliday): only an unlocked row is still waiting on anyone.
        if (result.already_agreed && !result.locked) {
          signedElsewhere.add(id);
          await loadData();
          render();
          hubAlert("You've already countersigned this change. It takes effect once your co-parent does too.");
          return;
        }
        // The projection is written in the same transaction as the lock, so a
        // successful countersignature means the calendar is already correct.
        await loadData();
        render();
        if (result.locked) notifyAgreed();
      } catch (e) {
        console.error("countersign schedule change failed", e);
        await loadData().catch(() => {});
        render();
        // The answer was lost but the countersignature locked it: done.
        if (landedUnheard(e, versions, id, v => v.status === "agreed")) { notifyAgreed(); return; }
        hubAlert(agreementFailureLine(e, {
          action: "countersign this change", thing: "proposal",
          state: reReadState(versions, id),
        }));
      }
    }

    /**
     * Sign a schedule that is ALREADY in force — the one the other parent set
     * up before this parent had joined, which took effect on their signature
     * alone.
     *
     * Nothing about the schedule changes: the hub adds this parent's signature
     * and the date, and that is all. The terms are sent back with it, so the
     * hub refuses if what is in force is not what this screen showed. There is
     * no declining here — a schedule in force is changed by proposing a change.
     */
    async function onCountersignInForce(id) {
      const version = versions.find(v => v.id === id);
      if (!version) return;
      const ok = await hubConfirm({
        message: `Countersign ${memberName(version.child_id)}'s schedule?`,
        description: `${patternLabel(version)}, with custody days counted in ${version.timezone ?? "UTC"}. `
          + "It is already in force and stays exactly as it is; this records that you agree to it. "
          + "If it is not what you agreed, cancel and propose a change instead.",
        confirmLabel: "Countersign",
      });
      if (!ok) return;
      const notifyCountersigned = () => notifySchedule("Custody schedule countersigned",
        `${me?.name} countersigned ${memberName(version.child_id)}'s schedule. It was already in force and has not changed.`,
        { view: "setup" });
      try {
        const result = await agreeSchedule(id, true, undefined, scheduleSnapshot(version));
        await loadData();
        render();
        if (result.late_signature) notifyCountersigned();
      } catch (e) {
        // The usual cause is that it stopped being the version in force while
        // this screen was open, so show what is true now.
        console.error("countersign schedule in force failed", e);
        await loadData().catch(() => {});
        render();
        // Lost answer, and the late signature is now on the row: it landed.
        if (landedUnheard(e, versions, id, v => v.status === "agreed" && !!v.countersigned_at)) { notifyCountersigned(); return; }
        hubAlert(agreementFailureLine(e, {
          action: "countersign this schedule", thing: "custody schedule",
          state: reReadState(versions, id, "agreed"),
        }));
      }
    }

    async function onDeclineAmendment(id) {
      const amendment = versions.find(v => v.id === id);
      if (!amendment) return;
      const mine = amendment.proposed_by === me?.id;
      const ok = await hubConfirm({
        message: mine ? "Withdraw your proposed change?" : "Decline this proposed change?",
        description: "The schedule currently in force is unaffected.",
        destructive: true,
      });
      if (!ok) return;
      const notifyResolved = (withdrew) => notifySchedule(
        withdrew ? "Schedule change withdrawn" : "Schedule change declined",
        withdrew
          ? `${me?.name} withdrew their proposed change to ${memberName(amendment.child_id)}'s schedule.`
          : `${me?.name} declined the proposed change to ${memberName(amendment.child_id)}'s schedule.`,
        { view: "setup" });
      try {
        // `resolution: true` asks the hub to resolve this the way OUR side
        // resolves, rather than naming "withdrawn" or "declined" ourselves. The
        // app can only guess which of those applies, and the hub rejects a
        // resolution belonging to the other party — so a replaced co-parent
        // seat would have its decline refused for naming the wrong word. The
        // hub returns the value it used, which is also the honest source for
        // the wording below.
        const result = await agreeSchedule(id, false, true);
        await loadData();
        render();
        notifyResolved(result.status === "withdrawn");
      } catch (e) {
        console.error("decline schedule change failed", e);
        await loadData().catch(() => {});
        render();
        // Lost answer, and the row carries this side's own word: it landed.
        const landed = landedUnheard(e, versions, id, v => v.status === (mine ? "withdrawn" : "declined"));
        if (landed) { notifyResolved(landed.status === "withdrawn"); return; }
        hubAlert(agreementFailureLine(e, {
          action: mine ? "withdraw this proposal" : "decline this proposal", thing: "proposal",
          state: reReadState(versions, id),
        }));
      }
    }

    // One id per REQUEST, not per click. The insert and the requester's
    // signature are two calls; when the second failed, pressing "Send request"
    // again minted a new id and inserted the same swap a second time, leaving
    // the first as an unsigned duplicate on both parents' lists. Keyed on the
    // terms, so a retry of the same request re-sends the same row and an
    // edited one is a new request.
    let swapAttempt = null;

    async function onCreateSwap() {
      const child_id = modalEl.querySelector("#s-child").value;
      const start_date = modalEl.querySelector("#s-start").value;
      const end_date = modalEl.querySelector("#s-end").value;
      const to_parent_id = modalEl.querySelector("#s-parent").value;
      const note = modalEl.querySelector("#s-note").value.trim() || null;
      const responder_id = partnerId;
      // `schedule` makes this refuse a swap whose other party is not the
      // child's other parent on the agreed version. That is the app declining
      // to create one — NOT what stops one: see swapPartyIssue in logic.js.
      const v = validateSwap({ requester_id: me?.id, responder_id, child_id, start_date, end_date, to_parent_id }, todayStr(),
        { schedule: swappableSchedules().find(sch => sch.child_id === child_id) ?? null });
      if (!v.ok) { hubAlert(v.error); return; }

      const btn = modalEl.querySelector("#save-swap");
      btn.disabled = true; btn.textContent = "Sending…";
      const attemptKey = JSON.stringify([responder_id, child_id, start_date, end_date, to_parent_id, note]);
      if (swapAttempt?.key !== attemptKey) swapAttempt = { key: attemptKey, id: crypto.randomUUID(), now: new Date().toISOString() };
      const { id, now } = swapAttempt;
      try {
        if (!DEMO) {
          // DO NOTHING on a repeat: the row from the first attempt is this
          // request, already written.
          await db(`INSERT INTO ${P}swap_requests (id, requester_id, responder_id, child_id, start_date, end_date, to_parent_id, note, status, created_at, updated_at)
            VALUES (?,?,?,?,?,?,?,?,'pending',?,?) ON CONFLICT (id) DO NOTHING`,
            [id, me.id, responder_id, child_id, start_date, end_date, to_parent_id, note, now, now]);
          // Bootstraps the agreement row + sets the requester's flag, bound to
          // the terms this tab just wrote.
          await agree(id, true, { child_id, start_date, end_date, to_parent_id, note });
        }
        swapAttempt = null;
        swaps.unshift({ id, requester_id: me?.id, responder_id, child_id, start_date, end_date, to_parent_id, note, status: "pending", created_at: now, updated_at: now, requester_agreed: 1, responder_agreed: 0, locked_at: null });
        closeModal();
        view = "swaps"; render();
        notifyPartner("Swap request", `${me?.name} proposed a schedule swap for ${memberName(child_id)}.`, { view: "swaps" });
      } catch (e) {
        btn.disabled = false; btn.textContent = "Send request";
        console.error("send swap request failed", e);
        hubAlert(agreementFailureLine(e, { action: "send the swap request", thing: "swap request" }));
      }
    }

    async function onAgree(id) {
      const s = swaps.find(x => x.id === id); if (!s) return;
      // The card does not offer the button in this state; this is for a click
      // that was already on its way. App-side only, like the card.
      const sch = agreedVersion(versions, s.child_id);
      if (sch && swapPartyIssue(s, sch)) { hubAlert(swapPartyIssue(s, sch)); return; }
      try {
        const result = DEMO ? {
          locked: true,
          snapshot: {
            child_id: s.child_id, start_date: s.start_date, end_date: s.end_date,
            to_parent_id: s.to_parent_id, note: s.note ?? null,
          },
        } : await agree(id, true, {
          child_id: s.child_id, start_date: s.start_date, end_date: s.end_date,
          to_parent_id: s.to_parent_id, note: s.note ?? null,
        });
        // The lock is the only fact that matters: the hub froze the terms into
        // the agreement row server-side, and the schedule effect is derived
        // from that. Nothing else to persist — if this tab dies right here,
        // the next load (any parent's) derives the same calendar.
        if (me?.id === s.requester_id) s.requester_agreed = 1;
        if (me?.id === s.responder_id) s.responder_agreed = 1;
        if (!result.locked) {
          // The requester may have withdrawn their consent in another tab. A
          // successful HTTP response records this parent's flag but does not
          // manufacture a lock or calendar exception.
          s.status = "pending";
          render();
          return;
        }
        if (!result.snapshot) throw new Error("The locked agreement did not return its frozen terms");
        Object.assign(s, result.snapshot);
        s.status = "locked"; s.locked_at = new Date().toISOString();
        overrides = lockedSwapOverrides(swaps);
        // Locking a swap re-projects the affected child in the SAME hub
        // transaction (the swap agreements table is this app's declared
        // `cycle_projection.exceptions` source), so the days are already right
        // on the server — this is a read, not a rebuild.
        await reloadCustodyDays();
        render();
        notifyPartner("Swap confirmed", `${me?.name} agreed to the swap for ${memberName(s.child_id)}.`, { view: "swaps" });
      } catch (e) {
        // A refused LOCK is not a refused signature: the hub records this
        // parent's consent first and only then finds it cannot apply the swap,
        // so the row may now carry both signatures and still be pending. Re-read
        // it, or the card goes on offering "Agree" for a state that is gone —
        // and the next reload shows a swap with no buttons at all.
        console.error("agree to swap failed", e);
        if (!DEMO) { await loadData().catch(() => {}); render(); }
        // The answer was lost but this parent's consent is on the row: locked
        // means the swap is done (the re-read drew it), still pending with only
        // this parent's flag means it waits on the other parent, as an answered
        // unlocked consent does. Pending with BOTH flags is the hub's refused
        // lock (its 500 keeps the consent), which is a failure to report.
        const mine = v => (me?.id === v.requester_id ? v.requester_agreed : me?.id === v.responder_id ? v.responder_agreed : 0);
        const landed = DEMO ? null : landedUnheard(e, swaps, id, v => v.status === "locked"
          || (v.status === "pending" && !!mine(v) && !(v.requester_agreed && v.responder_agreed)));
        if (landed) {
          if (landed.status === "locked") notifyPartner("Swap confirmed", `${me?.name} agreed to the swap for ${memberName(landed.child_id)}.`, { view: "swaps" });
          return;
        }
        hubAlert(agreementFailureLine(e, {
          action: "agree to the swap", thing: "swap request",
          state: DEMO ? undefined : reReadState(swaps, id),
        }));
      }
    }

    async function onDecline(id) {
      const s = swaps.find(x => x.id === id); if (!s) return;
      try {
        if (!DEMO) {
          // The endpoint-only agreement status is the authority. It races the
          // final consent under status='pending', so exactly one can win and a
          // writable request row can never resurrect the decision.
          await agree(id, false, undefined, "declined");
          // Keep the presentation row in sync when possible. The endpoint-only
          // agreement already made the decision durable, so mirror failure must
          // not tell the parent their decline failed.
          await db(`UPDATE ${P}swap_requests SET status='declined', updated_at=? WHERE id=?`, [new Date().toISOString(), id]).catch(() => {});
        }
        s.status = "declined";
        render();
        notifyPartner("Swap declined", `${me?.name} declined the swap for ${memberName(s.child_id)}.`, { view: "swaps" });
      } catch (e) {
        console.error("decline swap failed", e);
        if (!DEMO) { await loadData().catch(() => {}); render(); }
        // The answer was lost but the decline is on the row: finish as the
        // success path does (mirror, then tell the other parent).
        if (!DEMO && landedUnheard(e, swaps, id, v => v.status === "declined")) {
          await db(`UPDATE ${P}swap_requests SET status='declined', updated_at=? WHERE id=?`, [new Date().toISOString(), id]).catch(() => {});
          notifyPartner("Swap declined", `${me?.name} declined the swap for ${memberName(s.child_id)}.`, { view: "swaps" });
          return;
        }
        hubAlert(agreementFailureLine(e, {
          action: "decline the swap", thing: "swap request",
          state: DEMO ? undefined : reReadState(swaps, id),
        }));
      }
    }

    async function onCancel(id) {
      const s = swaps.find(x => x.id === id); if (!s) return;
      if (!await hubConfirm({ message: "Cancel this swap request?" })) return;
      try {
        if (!DEMO) {
          await agree(id, false, undefined, "cancelled");
          await db(`UPDATE ${P}swap_requests SET status='cancelled', updated_at=? WHERE id=?`, [new Date().toISOString(), id]).catch(() => {});
        }
        s.status = "cancelled";
        render();
      } catch (e) {
        console.error("cancel swap failed", e);
        if (!DEMO) { await loadData().catch(() => {}); render(); }
        // The answer was lost but the cancellation is on the row: it landed.
        if (!DEMO && landedUnheard(e, swaps, id, v => v.status === "cancelled")) {
          await db(`UPDATE ${P}swap_requests SET status='cancelled', updated_at=? WHERE id=?`, [new Date().toISOString(), id]).catch(() => {});
          return;
        }
        hubAlert(agreementFailureLine(e, {
          action: "cancel the swap request", thing: "swap request",
          state: DEMO ? undefined : reReadState(swaps, id),
        }));
      }
    }

    async function onSaveHandoff() {
      const child_id = modalEl.querySelector("#h-child").value;
      const note_date = modalEl.querySelector("#h-date").value;
      const category = modalEl.querySelector("#h-cat").value;
      const body = modalEl.querySelector("#h-body").value.trim();
      if (!body) { modalEl.querySelector("#h-body").focus(); return; }
      if (!child_id || !note_date) { hubAlert("Pick a child and date."); return; }
      const btn = modalEl.querySelector("#save-note");
      btn.disabled = true; btn.textContent = "Saving…";
      const now = new Date().toISOString();
      try {
        let id = crypto.randomUUID();
        if (!DEMO) {
          const r = await appendRecord("handoff_notes", { child_id, note_date, category, body });
          id = r.id ?? id;
        }
        handoffs.unshift({ id, child_id, note_date, category, body, created_by: me?.id, created_at: now });
        journalVersion++;
        closeModal(); render();
        notifyPartner("Handoff note", `${me?.name} added a ${category} note for ${memberName(child_id)}.`, { view: "handoffs" });
      } catch (e) {
        btn.disabled = false; btn.textContent = "Add note";
        console.error("add handoff note failed", e);
        hubAlert(failureLine(e, { action: "add the note", thing: "handoff note" }));
      }
    }

    // ── Deep link + init ───────────────────────────────────────────────────────
    function handleDeepLink() {
      const v = new URLSearchParams(window.location.search).get("view");
      if (v && TABS.some(([id]) => id === v)) view = v;
    }

    // Coming back to the tab is the other moment a stale journal gets noticed.
    // Scoped to its views so returning to the calendar costs nothing.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      if (JOURNAL_VIEWS.has(view)) refreshJournal();
    });

    async function firstLoad() {
      // Members, the partner link and the data are independent requests; only
      // loadData's adult-only reads wait on members (see loadData).
      // A roster or pairing that could not be read fails the load: caught here
      // so the other reads still settle before the banner is drawn.
      let contextFailed = false;
      const membersReady = loadMembers().catch(() => { contextFailed = true; });
      await Promise.all([membersReady, loadPartner({ first: true }).catch(() => { contextFailed = true; }), loadData(membersReady)]);
      // loadData swallows each read's failure, since some are refused by policy
      // for a child; these are the ones it already knows to be real.
      loadFailed = contextFailed || custodyReadFailed || versionsReadFailed || adultReadsFailed;
      handleDeepLink();
      render();
      // No journal refresh here: loadData has just read it.
    }
    firstLoad();
  </script>
</body>
</html>
