          signedElsewhere.add(id);
          await loadData();
          render();
          hubAlert("You've already countersigned this change. It takes effect once your co-parent does too.");
          return;
        }
        // The projection is written in the same transaction as the lock, so a
        // successful countersignature means the calendar is already correct.
        await loadData();
        render();
        if (result.locked) {
          notifySchedule("Custody schedule agreed",
            `${me?.name} countersigned the change to ${memberName(amendment.child_id)}'s schedule. It's now in force.`,
            { view: "schedule" });
        }
      } catch (e) { hubAlert(e.message); }
    }

    async function onDeclineAmendment(id) {
      const amendment = versions.find(v => v.id === id);
      if (!amendment) return;
      const mine = amendment.proposed_by === me?.id;
      const ok = await hubConfirm({
        message: mine ? "Withdraw your proposed change?" : "Decline this proposed change?",
        description: "The schedule currently in force is unaffected.",
        destructive: true,
      });
      if (!ok) return;
      try {
        // `resolution: true` asks the hub to resolve this the way OUR side
        // resolves, rather than naming "withdrawn" or "declined" ourselves. The
        // app can only guess which of those applies, and the hub rejects a
        // resolution belonging to the other party — so a replaced co-parent
        // seat would have its decline refused for naming the wrong word. The
        // hub returns the value it used, which is also the honest source for
        // the wording below.
        const result = await agreeSchedule(id, false, true);
        const withdrew = result.status === "withdrawn";
        await loadData();
        render();
        notifySchedule(
          withdrew ? "Schedule change withdrawn" : "Schedule change declined",
          withdrew
            ? `${me?.name} withdrew their proposed change to ${memberName(amendment.child_id)}'s schedule.`
            : `${me?.name} declined the proposed change to ${memberName(amendment.child_id)}'s schedule.`,
          { view: "setup" });
      } catch (e) { hubAlert(e.message); }
    }

    async function onCreateSwap() {
      const child_id = modalEl.querySelector("#s-child").value;
      const start_date = modalEl.querySelector("#s-start").value;
      const end_date = modalEl.querySelector("#s-end").value;
      const to_parent_id = modalEl.querySelector("#s-parent").value;
      const note = modalEl.querySelector("#s-note").value.trim() || null;
      const responder_id = partnerId;
      const v = validateSwap({ requester_id: me?.id, responder_id, child_id, start_date, end_date, to_parent_id }, todayStr());
      if (!v.ok) { hubAlert(v.error); return; }

      const btn = modalEl.querySelector("#save-swap");
      btn.disabled = true; btn.textContent = "Sending…";
      const id = crypto.randomUUID();
      const now = new Date().toISOString();
      try {
        if (!DEMO) {
          await db(`INSERT INTO ${P}swap_requests (id, requester_id, responder_id, child_id, start_date, end_date, to_parent_id, note, status, created_at, updated_at)
            VALUES (?,?,?,?,?,?,?,?,'pending',?,?)`,
            [id, me.id, responder_id, child_id, start_date, end_date, to_parent_id, note, now, now]);
          // Bootstraps the agreement row + sets the requester's flag, bound to
          // the terms this tab just wrote.
          await agree(id, true, { child_id, start_date, end_date, to_parent_id, note });
        }
        swaps.unshift({ id, requester_id: me?.id, responder_id, child_id, start_date, end_date, to_parent_id, note, status: "pending", created_at: now, updated_at: now, requester_agreed: 1, responder_agreed: 0, locked_at: null });
        closeModal();
        view = "swaps"; render();
        notifyPartner("Swap request", `${me?.name} proposed a schedule swap for ${memberName(child_id)}.`, { view: "swaps" });
      } catch (e) {
        btn.disabled = false; btn.textContent = "Send request";
        hubAlert(e.message);
      }
    }

    async function onAgree(id) {
      const s = swaps.find(x => x.id === id); if (!s) return;
      try {
        const result = DEMO ? {
          locked: true,
          snapshot: {
            child_id: s.child_id, start_date: s.start_date, end_date: s.end_date,
            to_parent_id: s.to_parent_id, note: s.note ?? null,
          },
        } : await agree(id, true, {
          child_id: s.child_id, start_date: s.start_date, end_date: s.end_date,
          to_parent_id: s.to_parent_id, note: s.note ?? null,
        });
        // The lock is the only fact that matters: the hub froze the terms into
        // the agreement row server-side, and the schedule effect is derived
        // from that. Nothing else to persist — if this tab dies right here,
        // the next load (any parent's) derives the same calendar.
        if (me?.id === s.requester_id) s.requester_agreed = 1;
        if (me?.id === s.responder_id) s.responder_agreed = 1;
        if (!result.locked) {
          // The requester may have withdrawn their consent in another tab. A
          // successful HTTP response records this parent's flag but does not
          // manufacture a lock or calendar exception.
          s.status = "pending";
          render();
          return;
        }
        if (!result.snapshot) throw new Error("The locked agreement did not return its frozen terms");
        Object.assign(s, result.snapshot);
        s.status = "locked"; s.locked_at = new Date().toISOString();
        overrides = lockedSwapOverrides(swaps);
        // Locking a swap re-projects the affected child in the SAME hub
        // transaction (the swap agreements table is this app's declared
        // `cycle_projection.exceptions` source), so the days are already right
        // on the server — this is a read, not a rebuild.
        await reloadCustodyDays();
        render();
        notifyPartner("Swap confirmed", `${me?.name} agreed to the swap for ${memberName(s.child_id)}.`, { view: "swaps" });
      } catch (e) { hubAlert(e.message); }
    }

    async function onDecline(id) {
      const s = swaps.find(x => x.id === id); if (!s) return;
      try {
        if (!DEMO) {
          // The endpoint-only agreement status is the authority. It races the
          // final consent under status='pending', so exactly one can win and a
          // writable request row can never resurrect the decision.
          await agree(id, false, undefined, "declined");
          // Keep the presentation row in sync when possible. The endpoint-only
          // agreement already made the decision durable, so mirror failure must
          // not tell the parent their decline failed.
          await db(`UPDATE ${P}swap_requests SET status='declined', updated_at=? WHERE id=?`, [new Date().toISOString(), id]).catch(() => {});
        }
        s.status = "declined";
        render();
        notifyPartner("Swap declined", `${me?.name} declined the swap for ${memberName(s.child_id)}.`, { view: "swaps" });
      } catch (e) { hubAlert(e.message); }
    }

    async function onCancel(id) {
      const s = swaps.find(x => x.id === id); if (!s) return;
      if (!await hubConfirm({ message: "Cancel this swap request?" })) return;
      try {
        if (!DEMO) {
          await agree(id, false, undefined, "cancelled");
          await db(`UPDATE ${P}swap_requests SET status='cancelled', updated_at=? WHERE id=?`, [new Date().toISOString(), id]).catch(() => {});
        }
        s.status = "cancelled";
        render();
      } catch (e) { hubAlert(e.message); }
    }

    // Minted per DRAFT, not per attempt: a retry after a timeout must replay
    // the same message, not append a duplicate to a permanent record — a key
    // regenerated on every click never dedupes anything.
    let draftIdempotencyKey = null;

    async function onSendMessage() {
      const ta = document.getElementById("msg-body");
      const body = ta.value.trim();
      if (!body) { ta.focus(); return; }
      const btn = document.getElementById("msg-send");
      btn.disabled = true; btn.textContent = "…";
      let now = new Date().toISOString();
      draftIdempotencyKey ??= crypto.randomUUID();
      try {
        let id = draftIdempotencyKey;
        let sessionId = partnerSessionId;
        if (!DEMO) {
          // The hub derives the recipient from the reciprocal pairing and
          // stamps the author, the timestamp and the session itself — we send
          // only the text.
          const r = await pairedMessage({ action: "send", content: body, idempotency_key: draftIdempotencyKey });
          id = r.id ?? id;
          now = r.sent_at ?? now;
          sessionId = r.session_id ?? sessionId;   // authoritative, survives a rotation this tab missed
        }
        draftIdempotencyKey = null;   // the next draft gets its own key
        messagesVersion++;            // an in-flight refresh SELECT predates this row — it must not clobber it
        // A refresh that resolved during the send may already carry the row.
        if (!messages.some(m => m.id === id)) {
          messages.push({ id, author_id: me?.id, recipient_id: partnerId, body, sent_at: now, read_at: null, session_id: sessionId });
        }
        ta.value = "";                // sent — don't let the redraw restore it as a draft
        render();
      } catch (e) {
        // Looked up fresh: a background refresh may have replaced the DOM the
        // captured button belonged to.
        const sendBtn = document.getElementById("msg-send");
        if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = "Send"; }
        // The pairing can end — or rotate — between page load and send. All
        // three of the hub's stale-pairing 409s land here: say so plainly,
        // re-read the pairing so the view stops offering a composer that
        // cannot work, and keep the unsent words; they are the user's.
        if (/reciprocal|no partner|session changed/i.test(e.message)) {
          await loadPartner();
          render();
          const box = document.getElementById("msg-body");
          if (box) { box.value = body; box.setSelectionRange(body.length, body.length); }
          hubAlert("That pairing is no longer active, so the message wasn't sent.");
          return;
        }
        hubAlert(e.message);
      }
    }

    async function onSaveHandoff() {
      const child_id = modalEl.querySelector("#h-child").value;
      const note_date = modalEl.querySelector("#h-date").value;
      const category = modalEl.querySelector("#h-cat").value;
      const body = modalEl.querySelector("#h-body").value.trim();
      if (!body) { modalEl.querySelector("#h-body").focus(); return; }
      if (!child_id || !note_date) { hubAlert("Pick a child and date."); return; }
      const btn = modalEl.querySelector("#save-note");
      btn.disabled = true; btn.textContent = "Saving…";
      const now = new Date().toISOString();
      try {
        let id = crypto.randomUUID();
        if (!DEMO) {
          const r = await appendRecord("handoff_notes", { child_id, note_date, category, body });
          id = r.id ?? id;
        }
        handoffs.unshift({ id, child_id, note_date, category, body, created_by: me?.id, created_at: now });
        closeModal(); render();
        notifyPartner("Handoff note", `${me?.name} added a ${category} note for ${memberName(child_id)}.`, { view: "handoffs" });
      } catch (e) {
        btn.disabled = false; btn.textContent = "Add note";
        hubAlert(e.message);
      }
    }

    // ── Deep link + init ───────────────────────────────────────────────────────
    function handleDeepLink() {
      const v = new URLSearchParams(window.location.search).get("view");
      if (v && TABS.some(([id]) => id === v)) view = v;
    }

    // Coming back to the tab is the other moment a stale thread gets noticed.
    // Scoped to the messages view so returning to the calendar costs nothing.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && view === "messages") refreshMessages();
    });

    (async () => {
      await loadMembers();
      await loadPartner();
      await loadData();
      handleDeepLink();
      render();
      // A deep link can land straight on the thread (notifications point here).
      if (view === "messages") refreshMessages();
    })();
  </script>
</body>
</html>
