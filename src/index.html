<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/run/co-parenting/" />
  <title>Co-Parenting</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      font-size: var(--hub-font-size, 15px);
      background: var(--hub-bg, #f9fafb);
      color: var(--hub-text, #000000);
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.35rem; margin: 0 0 2px; }
    .sub { color: var(--hub-text-muted, #6b7280); font-size: 0.85rem; margin: 0 0 16px; }

    /* Tabs */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hub-border, #e5e7eb); margin-bottom: 16px; overflow-x: auto; }
    .tab { padding: 8px 14px; border: none; background: none; cursor: pointer; color: var(--hub-text-muted, #6b7280);
      font-size: 0.9rem; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab.active { color: var(--hub-primary, #4f46e5); border-bottom-color: var(--hub-primary, #4f46e5); font-weight: 600; }

    /* Cards */
    .card { background: var(--hub-surface, #fff); border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 10px); padding: 14px; margin-bottom: 12px; }
    .card h3 { margin: 0 0 8px; font-size: 1rem; }

    .row { display: flex; align-items: center; gap: 8px; }
    .spread { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .muted { color: var(--hub-text-muted, #6b7280); font-size: 0.85rem; }
    .empty { text-align: center; color: var(--hub-text-muted, #6b7280); padding: 32px 16px; }

    /* Buttons */
    .btn { border: 1px solid var(--hub-border, #d1d5db); background: var(--hub-surface, #fff); color: var(--hub-text, #000000);
      padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 0.88rem; }
    .btn:hover { background: var(--hub-bg, #f3f4f6); }
    .btn-primary { background: var(--hub-primary, #4f46e5); color: var(--hub-primary-fg, #fff); border-color: var(--hub-primary, #4f46e5); }
    .btn-primary:hover { background: var(--hub-primary-hover, #4338ca); }
    .btn-danger { color: #b91c1c; border-color: #fca5a5; }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .btn-sm { padding: 4px 9px; font-size: 0.8rem; }

    /* Avatars */
    .avatar { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.72rem; font-weight: 700; flex-shrink: 0; }

    /* Calendar */
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow { text-align: center; font-size: 0.68rem; color: var(--hub-text-muted, #6b7280); padding: 2px 0; text-transform: uppercase; }
    .cal-cell { aspect-ratio: 1 / 1; border-radius: 7px; padding: 3px 4px; font-size: 0.72rem; position: relative;
      display: flex; flex-direction: column; justify-content: space-between; color: var(--hub-text, #1f2937); overflow: hidden; }
    .cal-cell.empty-cell { background: transparent; }
    .cal-cell .dnum { font-weight: 600; opacity: 0.85; }
    .cal-cell .who { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
    .cal-cell.today { outline: 2px solid var(--hub-primary, #4f46e5); outline-offset: -2px; }
    .cal-cell .ov-dot { position: absolute; top: 3px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: #1f2937; }
    .cal-cell .hol-dot, .hol-dot { background: #d97706; }
    .cal-cell .act-dot { position: absolute; bottom: 3px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: #2563eb; }
    .cal-cell .act-dot.disputed { background: #dc2626; }
    .cal-cell.past { cursor: pointer; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 0.8rem; }
    .legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

    /* Child tabs (pills) */
    .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .pill { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--hub-border, #e5e7eb); background: var(--hub-surface,#fff);
      cursor: pointer; font-size: 0.85rem; }
    .pill.active { background: var(--hub-primary, #4f46e5); color: var(--hub-primary-fg, #fff); border-color: var(--hub-primary, #4f46e5); }

    .immutable-note { font-size: 0.75rem; color: var(--hub-text-muted, #6b7280); margin: 0 0 10px; }

    /* Badges */
    .badge { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.02em; }
    .b-pending { background: var(--hub-tint-warning, #fef3c7); color: var(--hub-tint-warning-fg, #92400e); }
    .b-locked { background: var(--hub-tint-success, #dcfce7); color: var(--hub-tint-success-fg, #166534); }
    .b-declined { background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #991b1b); }
    .b-cancelled { background: var(--hub-bg, #f3f4f6); color: var(--hub-text-muted, #4b5563); }

    /* Forms */
    label.field { display: block; margin-bottom: 10px; font-size: 0.85rem; }
    label.field > span { display: block; margin-bottom: 4px; color: var(--hub-text-muted, #6b7280); }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--hub-border, #d1d5db);
      border-radius: 8px; font: inherit; background: var(--hub-surface, #fff); color: var(--hub-text, #000000); }
    textarea { resize: vertical; min-height: 44px; }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center;
      justify-content: center; padding: 16px; z-index: 50; }
    .modal { background: var(--hub-surface, #fff); border-radius: var(--hub-radius, 12px); padding: 18px;
      max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal h3 { margin: 0 0 14px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

    .radio-list label { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
    .radio-list input { width: auto; }
    .hint { font-size: 0.78rem; color: var(--hub-text-muted, #6b7280); margin-top: -4px; margin-bottom: 10px; }
    .note-cat { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 5px;
      background: var(--hub-bg, #eef0f3); color: var(--hub-text-muted, #4b5563); }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1><span id="page-glyph"></span> Co-Parenting</h1>
    <p class="sub">Custody schedule, swaps, and a shared record — kept straight between two homes.</p>
    <div id="tabs" class="tabs"></div>
    <div id="content"></div>
  </div>

  <script type="module">
    import {
      memberColor, initial, esc, isAdult, hubConfirm, hubAlert,
      sendHubNotification, hubAppUrl, hubToday, glyph, chickadee,
    } from "/hub-sdk.js";

    // Static markup cannot call the SDK helpers, so fill the heading glyph from script.
    document.getElementById("page-glyph").innerHTML = glyph("compass");
    import {
      effectiveForDate, normalizeCycle, addDays, validateSwap, buildCustodyDays,
      nextTransition, upcomingTransitions, groupNotesByTransition, recentTransitions, exchangeOutcome, actualParentForDay, parentingTimeSummary,
      HOLIDAY_PRESETS, holidayForDate, nextHolidayOccurrence, describeHolidayRule, parseHolidayRules,
      holidayRulesBlocker, holidayProposalTerms, mergeHolidayVersion, holidaySnapshot,
      notesForTransition, describeScheduleChange,
      soleCoParentCandidate, lockedSwapOverrides, mergeSwapRecord, canMemberAgreeToSwap,
      pairingState, messagesCoParent, hubMessagesUrl,
      compileCycle, mergeScheduleVersion, agreedVersion, openAmendment,
      amendmentStance, canSignAmendment, scheduleNoticeAudience,
      draftProposalTerms, draftSendBlocker, scheduleProposalTerms,
      CYCLE_PRESETS, nameForCycle, presetForCycle, cycleAnchorHint, parseCycleInput,
      calendarCell, monthBounds, CUSTODY_LOOKBACK_DAYS, scheduleHasEnded,
      SWAP_HORIZON_DAYS, swapIsStalled, swapStallReason, swapPartyIssue,
      versionSignatures, unilateralStance, scheduleSnapshot, childrenOpenForNewSchedule, timeZoneChoices, timeZoneDefaultSource,
      fmtHandoffDay as fmtHandoffDayFrom, fmtExchangeTime,
      failureLine, agreementRowState, agreementFailureLine, outcomeUnknown, storedDiffers,
    } from "./logic.js";

    // ── Runtime globals ──────────────────────────────────────────────────────
    const CONTEXT       = window.__CONTEXT_URL       ?? "";
    const DB            = window.__DB_URL            ?? "";
    const APPEND_RECORD = window.__APPEND_RECORD_URL ?? "";
    const APP_ID        = window.__APP_ID            ?? "co-parenting";
    const HUB_ORIGIN    = window.__HUB_ORIGIN        ?? "";
    const P             = "app_co_parenting__";       // table prefix

    async function db(sql, params = []) {
      if (!DB) return { rows: [] };
      const res = await fetch(DB, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sql, params }),
      });
      const json = await res.json().catch(() => null);
      if (!res.ok || !json || typeof json !== "object" || json.error) {
        // `status` and `code` are what failureLine reads; the text is for the console.
        throw Object.assign(new Error(json?.error || "Couldn’t reach the hub. Try again."),
          { status: res.status, ...(json?.code ? { code: json.code } : {}) });
      }
      return json;
    }

    // The HOUSEHOLD's calendar day, not the viewer device's. These dates are
    // STORED and COMPARED against stored dates, and the hub's own surfaces
    // (glance, kiosk, cron, `:today` in declared SQL) are all on the household
    // calendar — a date built from the device clock names a different day near
    // midnight or for a member in another timezone, and nothing reconciles the
    // two. hubToday() degrades to the device calendar when no zone is
    // published, so it is never worse than what it replaces.
    const todayStr = (now = new Date()) => hubToday(now);

    // ── State ────────────────────────────────────────────────────────────────
    let me = window.__CURRENT_MEMBER ?? null;   // may be replaced with a demo adult below
    let members = [], memberMap = new Map();
    let partnerId = null, partnerReciprocal = false;
    // The id of the CURRENT pairing, minted by the hub when it becomes
    // reciprocal. Null until both parents have named each other.
    let partnerSessionId = null;
    // The hub's word on whether a non-reciprocal pairing row is a live proposal
    // ("awaiting") or the survivor of an unpair ("ended"). Client state cannot
    // tell those apart.
    let partnerProposalPending = false;
    let schedules = [], overrides = [], swaps = [], handoffs = [];
    // Every standing-schedule version this tenant has: agreed, pending,
    // superseded, withdrawn, declined. `schedules` is the agreed subset.
    let versions = [];
    /** This parent's own private schedule drafts — one per child at most.
     *
     *  Nobody else can read these: `row_policies.schedule_drafts` is
     *  `owner_only` with `adults_bypass: false`, so the other parent (an adult
     *  AND a steward here, which is exactly who the supervision bypass would
     *  have let in) gets nothing. The "only you can see this" label on the UI is
     *  a description of that policy, not a promise made by the UI. */
    let drafts = [];
    /** The tenant's zone, defaulted into a proposal so the parents SEE which
     *  clock their custody days are counted in and can correct it before it
     *  becomes an agreed term. Filled from the hub context at load. */
    let spaceTimeZone = "UTC";
    let custodyDays = [];                        // materialized rotation (agenda/glance source)
    /** The custody journal — each parent's account of exchanges and of where a
     *  child actually was. Append-only; read with the handoff notes. */
    let custodyLog = [];
    /** Holiday schedules — the amendment and the hub's agreement row merged,
     *  one record per proposal, like `versions`. Adults only. */
    let holidayVersions = [];
    /** The earliest day `custodyDays` is known to be complete from. The first
     *  read is a window around today (see CUSTODY_WINDOW_SQL); older months are
     *  fetched when the grid is turned to them, and this moves back as they
     *  arrive. Null until the first read lands — and in demo mode, where there
     *  is nothing older to fetch. */
    let custodyFrom = null;
    /** Handoffs older than that window, for filing old notes under the exchange
     *  they were written for. Transitions only — never mixed into custodyDays,
     *  which the grid relies on being every day from custodyFrom on. */
    let olderTransitions = [];
    let olderTransitionsFrom = null;
    /** A read that FAILED is not a read that came back empty. Without these the
     *  two looked the same, and a network blip on launch rendered as "No custody
     *  schedule yet" — to a child, and to a parent about to set one up twice. */
    let custodyReadFailed = false;
    let versionsReadFailed = false;
    /** Any other adults-only read. Counted for a parent only, like the versions:
     *  a child is refused those tables by policy on every launch. */
    let adultReadsFailed = false;
    // The FIRST load failed: nothing on any tab is known, so no tab is drawn.
    let loadFailed = false;
    let view = "schedule";
    let currentChildId = null;
    let calMonth = null;                         // { y, m } (m is 0-based)
    const DEMO = !DB;

    function memberName(id) { return memberMap.get(id)?.name ?? "Unknown"; }
    function childIds() { return [...new Set(schedules.map(s => s.child_id))]; }
    function adults() { return members.filter(m => isAdult(m, members)); }
    const canManage = () => !!me && isAdult(me, members);   // mirrors adult_writable / write_acl:adult

    /** The unambiguous co-parent, or null. Rule lives in logic.js (tested). */
    const likelyCoParent = () => soleCoParentCandidate(adults(), me?.id);

    // ── Loading ──────────────────────────────────────────────────────────────
    async function loadMembers() {
      if (!CONTEXT) {
        members = [
          { id: "demo-dad", name: "Dad", role: "adult" },
          { id: "demo-mom", name: "Mom", role: "adult" },
          { id: "demo-sam", name: "Sam", role: "child" },
        ];
        me = me ?? members[0];
        memberMap = new Map(members.map(m => [m.id, m]));
        return;
      }
      // Not caught: a roster that could not be read is a failed load, not a
      // household with nobody in it (no names, and canManage() silently false).
      // A 200 can still name a key the hub failed to read, in `$errors`.
      const res = await fetch(`${CONTEXT}?keys=family.members,family.preferences`);
      const ctx = await res.json().catch(() => null);
      if (!res.ok || !ctx || typeof ctx !== "object" || ctx.error) throw new Error("Couldn’t reach the hub. Try again.");
      if (Array.isArray(ctx.$errors) && ["family.members", "family.preferences"].some((k) => ctx.$errors.includes(k))) throw new Error("Couldn’t reach the hub. Try again.");
      members = ctx["family.members"] ?? [];
      // The TENANT's zone, not this browser's. Custody-day boundaries are a
      // term both parents agree to, so the default has to be the one they
      // share — a proposer in another timezone must not silently define the
      // handoff day from their own device clock.
      spaceTimeZone = ctx["family.preferences"]?.timezone || spaceTimeZone;
      memberMap = new Map(members.map(m => [m.id, m]));
    }

    function applyPartnerStatus(status) {
      partnerId = status.partner_id ?? null;
      partnerReciprocal = !!status.reciprocal;
      partnerSessionId = status.session_id ?? null;
      partnerProposalPending = !!status.proposal_pending;
    }

    /** `first` is the boot's read: there, a pairing that could not be read is a
     *  failed load, not "nobody is paired" (which would offer to pair again). */
    async function loadPartner({ first = false } = {}) {
      if (DEMO) { partnerId = "demo-mom"; partnerReciprocal = true; partnerSessionId = "demo-session"; partnerProposalPending = false; return; }
      try {
        const res = await fetch(`/run/${APP_ID}/api/partner`);
        const json = res.ok ? await res.json().catch(() => null) : null;
        if (first && (!json || typeof json !== "object" || json.error)) throw new Error("Couldn’t reach the hub. Try again.");
        applyPartnerStatus(res.ok && json ? json : {});
      } catch (e) {
        if (first) throw e;
        applyPartnerStatus({});
      }
    }

    /** The first-render read of the projection: a window around today, not the
     *  table. `custody_days` keeps a row per child per day for as long as
     *  retention allows, so reading all of it grew without bound — past ~600
     *  rows the hub drops the WHOLE preload as too large to inline, and past
     *  5,000 the read itself is refused. Written out in full because
     *  manifest.preload declares this exact text (with `:today` as its param). */
    const CUSTODY_WINDOW_SQL = "SELECT * FROM app_co_parenting__custody_days WHERE day >= date(?, '-45 days') ORDER BY day";

    /** Adopt a fresh window read. Older months already fetched are kept: the
     *  hub only ever rewrites from today forward, so they cannot have changed. */
    function adoptCustodyWindow(rows, today) {
      const windowStart = addDays(today, -CUSTODY_LOOKBACK_DAYS);
      const older = custodyFrom && custodyFrom < windowStart
        ? custodyDays.filter(r => r.day < windowStart) : [];
      custodyDays = [...older, ...rows];
      custodyFrom = older.length ? custodyFrom : windowStart;
      custodyReadFailed = false;
    }

    // One at a time: two month-back clicks in a row would otherwise each fetch
    // "from here to custodyFrom" against the same custodyFrom, and whichever
    // answered second would either duplicate the first or be thrown away.
    let custodyBackfill = Promise.resolve();
    let custodyBackfillFailed = false;

    /** Make sure every projected day from `firstDay` on is loaded. Resolves true
     *  when it fetched something the caller should redraw for. */
    function ensureCustodyFrom(firstDay) {
      if (DEMO || !custodyFrom || firstDay >= custodyFrom) return Promise.resolve(false);
      const run = custodyBackfill.then(async () => {
        if (firstDay >= custodyFrom) return false;
        const until = custodyFrom;
        const res = await db(`SELECT * FROM ${P}custody_days WHERE day >= ? AND day < ? ORDER BY day`, [firstDay, until]);
        custodyDays = [...res.rows, ...custodyDays];
        custodyFrom = firstDay;
        custodyBackfillFailed = false;
        return true;
      });
      custodyBackfill = run.catch(() => { custodyBackfillFailed = true; });
      return run.catch(() => true);   // redraw either way: the failure has a message of its own
    }

    /** Handoffs older than the loaded window, fetched once, so a note written
     *  months ago still files under its exchange instead of "Other notes". */
    function ensureOlderTransitions() {
      if (DEMO || !custodyFrom || !handoffs.length) return;
      const earliest = handoffs.reduce((min, h) => (h.note_date && h.note_date < min ? h.note_date : min), custodyFrom);
      const loadedFrom = olderTransitionsFrom ?? custodyFrom;
      if (earliest >= loadedFrom) return;
      // Claimed before the read, not after: render calls this, and the read
      // ends in a render.
      olderTransitionsFrom = earliest;
      db(`SELECT * FROM ${P}custody_days WHERE is_transition = 1 AND day >= ? AND day < ? ORDER BY day`, [earliest, loadedFrom])
        .then((res) => {
          olderTransitions = [...res.rows, ...olderTransitions];
          if (view === "handoffs") render();
        })
        // Non-fatal: the notes still show, dated, under "Other notes".
        .catch(() => {});
    }

    /** `membersReady` is the boot's in-flight loadMembers(): only the adult-only
     *  reads depend on who the viewer is, so everything else starts without
     *  waiting for it. A reload after a write passes nothing — members are
     *  already loaded. */
    async function loadData(membersReady = Promise.resolve()) {
      if (DEMO) { await membersReady; seedDemo(); return; }

      // Every read below is independent of the others, so they all go out
      // together rather than one wave after another. The statements written
      // out in full are the ones
      // manifest.preload declares — the hub answers them from the document only
      // when this text is exactly the manifest's, so they are not built from P.
      const none = () => ({ rows: [] });
      const today = todayStr();
      let versionsFailed = false, adultFailed = false;
      const failed = () => { adultFailed = true; return none(); };
      const [amd, ver, sr, sa, cd, adultOnly] = await Promise.all([
        db("SELECT * FROM app_co_parenting__schedule_amendments ORDER BY created_at DESC").catch(failed),
        db("SELECT * FROM app_co_parenting__schedule_versions").catch(() => { versionsFailed = true; return none(); }),
        db("SELECT * FROM app_co_parenting__swap_requests ORDER BY created_at DESC").catch(failed),
        db("SELECT * FROM app_co_parenting__swap_agreements").catch(failed),
        db(CUSTODY_WINDOW_SQL, [today]).catch(() => null),
        membersReady.then(() => canManage()
          ? Promise.all([
              db(`SELECT * FROM ${P}handoff_notes ORDER BY note_date DESC, created_at DESC`).catch(failed),
              db(`SELECT * FROM ${P}custody_log ORDER BY day DESC, created_at DESC`).catch(failed),
              db(`SELECT * FROM ${P}holiday_amendments ORDER BY created_at DESC`).catch(failed),
              db(`SELECT * FROM ${P}holiday_versions`).catch(failed),
              // "My drafts" is the only query this table has. The WHERE clause is
              // the row policy's, not ours — owner_only appends it — so an app-side
              // filter here would be decoration, and its absence is not a leak.
              db("SELECT * FROM app_co_parenting__schedule_drafts ORDER BY updated_at DESC").catch(failed),
            ])
          : null),
      ]);

      // The standing schedule is an agreement, so it is read the way the swap
      // agreements are: the mutable amendment row plus the hub-owned agreement
      // state, merged by id. Both are governed tables, so a JOIN is rejected.
      const verById = new Map(ver.rows.map(v => [v.id, v]));
      versions = amd.rows.map(a => mergeScheduleVersion(a, verById.get(a.id)));
      // An agreed version outlives its amendment row for retention purposes, so
      // the list is not derived from the amendments alone.
      const amendmentIds = new Set(amd.rows.map(a => a.id));
      for (const v of ver.rows) {
        if (!amendmentIds.has(v.id)) versions.push(mergeScheduleVersion({ id: v.id }, v));
      }
      // What the calendar and every other view treat as "the schedule" is
      // exactly the set of versions currently in force. A pending proposal is
      // never one of them — that is the whole point of countersigning.
      schedules = versions.filter(v => v.status === "agreed");
      // Only a parent's failure counts: a child's read of the versions is
      // refused by policy on every launch, which is the policy working.
      versionsReadFailed = versionsFailed && canManage();
      adultReadsFailed = adultFailed && canManage();

      // swap_requests (party_scoped) and swap_agreements (endpoint_only) are both
      // governed tables — a JOIN across them is rejected — so load both and merge by id.
      const agrById = new Map(sa.rows.map(a => [a.id, a]));
      swaps = sr.rows.map(r => mergeSwapRecord(r, agrById.get(r.id)));
      // An authoritative agreement survives deletion of its mutable request
      // row. Keep agreement-only records visible instead of deriving the list
      // from swap_requests.
      const requestIds = new Set(sr.rows.map(r => r.id));
      for (const agr of sa.rows) {
        if (!requestIds.has(agr.id)) swaps.push(mergeSwapRecord({ id: agr.id }, agr));
      }
      // Exceptions to the rotation are DERIVED from locked swaps — the
      // overrides table is no longer read or written (its rows were
      // adult_writable, so either parent could unwind an agreed swap).
      overrides = lockedSwapOverrides(sa.rows);

      // Read, never written: `custody_days` is endpoint_only and the hub's
      // materializer is its only writer. Children may read it, which is what
      // makes "where am I tonight" answerable to them. A failed read keeps
      // whatever was already on screen rather than replacing it with nothing.
      if (cd) adoptCustodyWindow(cd.rows, today);
      else custodyReadFailed = true;

      if (adultOnly) {
        const [hn, cl, ha, hv, dr] = adultOnly;
        handoffs = hn.rows; custodyLog = cl.rows; drafts = dr.rows;
        // Merged by id like the standing schedule: both are governed tables, so
        // a JOIN is rejected, and an agreed version outlives its amendment row.
        const hvById = new Map(hv.rows.map(v => [v.id, v]));
        holidayVersions = ha.rows.map(a => mergeHolidayVersion(a, hvById.get(a.id)));
        const haIds = new Set(ha.rows.map(a => a.id));
        for (const v of hv.rows) if (!haIds.has(v.id)) holidayVersions.push(mergeHolidayVersion({ id: v.id }, v));
      }
    }

    // ── Derived surfaces are the hub's now ───────────────────────────────────
    //
    // Until 1.6.0 this app computed the rotation in the browser and wrote it
    // into `custody_days` and the `calendar_events` store key. Both are gone,
    // and neither is a refactor:
    //
    //   - a projection any adult could write was one either parent could
    //     rewrite without touching what was agreed;
    //   - three independent computations of one rotation (Today, the glance
    //     tile, the calendar) could each be stale on their own;
    //   - a tab closed between the DELETE and the INSERTs left the calendar
    //     simply empty.
    //
    // The hub's `cycle_projection` materializer now writes both, from the agreed
    // version, inside the same transaction that countersigns it. This app READS
    // `custody_days` and holds no store write grant at all.
    //
    // The rotation engine in logic.js survives as the PREVIEW engine — it is
    // what renders the days a proposal would produce, before there is anything
    // agreed for the hub to project. The hub's own horizon (120 days, extended
    // by its daily sweep) is what bounds the real projection.

    /** Re-read the hub's projection after an agreement changes it. */
    async function reloadCustodyDays() {
      if (!DB) return;
      try {
        const today = todayStr();
        adoptCustodyWindow((await db(CUSTODY_WINDOW_SQL, [today])).rows, today);
      } catch {
        // Non-fatal: the schedule view and calendar grid render from the agreed
        // version directly, so only the status card goes stale until reload.
      }
    }

    // ── Endpoints ────────────────────────────────────────────────────────────
    /**
     * The one request-JSON-or-throw wrapper for every hub endpoint this app
     * calls. The hub can answer 200-with-{error} as well as a bare error
     * status; checking both in one place keeps the five callers from
     * drifting — the pairing endpoints used to skip the body check and
     * silently "succeed" on an error payload.
     */
    async function requestJson(path, { method = "POST", body, fallbackError }) {
      const res = await fetch(path, {
        method,
        ...(body === undefined ? {} : {
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        }),
      });
      const json = await res.json().catch(() => null);
      if (!res.ok || !json || typeof json !== "object" || json.error) {
        // The line shown is chosen from `status` (and `code`), never from the
        // hub's text. `retryAfter` marks the agreements endpoint's "another
        // change to this schedule is being applied" 409.
        throw Object.assign(new Error(json?.error || fallbackError), {
          status: res.status,
          ...(json?.code ? { code: json.code } : {}),
          ...(res.headers?.get?.("Retry-After") ? { retryAfter: true } : {}),
        });
      }
      return json;
    }

    function appendRecord(name, data) {
      return requestJson(`${APPEND_RECORD}/${encodeURIComponent(name)}`, {
        body: data, fallbackError: "Could not save",
      });
    }

    /** After a refused agreement call and a loadData(): what became of row `id`
     *  in `list`. Unknown when the re-read failed — loadData keeps going on a
     *  failed read with an empty list, which must not read as "removed". */
    function reReadState(list, id, open) {
      return agreementRowState(list.find(r => r.id === id), {
        readOk: !versionsReadFailed && !adultReadsFailed, open,
      });
    }

    /** "Retry after a lost response" for a countersign or decline: when the
     *  outcome is unknown and the re-read (a loadData() already made) shows
     *  this parent's own answer recorded, the row; otherwise null. Only then
     *  does the caller run its success path, once. */
    function landedUnheard(e, list, id, landed) {
      if (!outcomeUnknown(e) || versionsReadFailed || adultReadsFailed) return null;
      const row = list.find(r => r.id === id);
      return row && landed(row) ? row : null;
    }

    /**
     * End the current pairing. The hub drops this member's link and clears the
     * session on the other parent's row, and records the termination in its
     * audit trail, which is what makes "when did this end" answerable later.
     *
     * Nothing is deleted, which is why the confirmation says so. Messages are
     * the space's own and do not depend on the pairing at all.
     */
    async function unpair() {
      const ok = await hubConfirm({
        message: `End your pairing with ${memberName(partnerId)}?`,
        description: "This ends the pairing. Everything already recorded is kept.",
        destructive: true,
      });
      if (!ok) return;
      const btn = document.getElementById("unpair");
      if (btn) { btn.disabled = true; btn.textContent = "Ending…"; }
      try {
        await requestJson(`/run/${APP_ID}/api/partner`, {
          method: "DELETE", fallbackError: "Could not end the pairing",
        });
        await loadPartner();
        render();
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = "End pairing"; }
        console.error("end pairing failed", e);
        hubAlert(failureLine(e, { action: "end the pairing", thing: "pairing" }));
      }
    }

    function agree(id, agreed, expectedSnapshot, resolution) {
      return requestJson(`/run/${APP_ID}/api/agree`, {
        body: {
          table: "swap_agreements", id, agreed,
          ...(expectedSnapshot ? { expected_snapshot: expectedSnapshot } : {}),
          ...(resolution ? { resolution } : {}),
        },
        fallbackError: "Could not record agreement",
      });
    }

    /** Swap / handoff notices — addressed to the paired co-parent, which is who
     *  those records are between. */
    function notifyPartner(title, body, params) {
      if (!partnerId) return;
      sendHubNotification({ title, body, audience: [partnerId], url: hubAppUrl(APP_ID, params) }).catch(() => {});
    }

    /**
     * Standing-schedule notices — addressed from MEMBERSHIP, never from the
     * pairing.
     *
     * The pairing is an in-app act that names the swap counterparty; two
     * co-parents can be full members of this space without having completed it. Routing a
     * schedule amendment through it meant a proposal, a countersignature and a
     * supersession could all happen with nobody told. Rule lives in logic.js
     * (tested).
     */
    function notifySchedule(title, body, params) {
      const audience = scheduleNoticeAudience(members, me?.id);
      if (!audience.length) return;
      sendHubNotification({ title, body, audience, url: hubAppUrl(APP_ID, params) }).catch(() => {});
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  Rendering
    // ══════════════════════════════════════════════════════════════════════════
    const TABS = [
      ["schedule", "calendar",  "Schedule"],
      ["swaps",    "swap",      "Swaps"],
      ["messages", "messages",  "Messages"],
      ["handoffs", "checklist", "Handoffs"],
      ["holidays", "calendar",  "Holidays"],
      ["records",  "seal-document", "Records"],
      ["setup",    "gear",      "Setup"],
    ];

    function render() {
      journalRedrawOwed = false;   // this draw shows whatever was adopted
      const tabsEl = document.getElementById("tabs");
      if (loadFailed) {
        tabsEl.innerHTML = "";
        const failed = document.getElementById("content");
        failed.innerHTML = `<div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the custody schedule.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`;
        failed.querySelector('[data-testid="load-retry"]').addEventListener("click", firstLoad);
        return;
      }
      tabsEl.innerHTML = TABS.map(([id, icon, label]) =>
        `<button class="tab ${view === id ? "active" : ""}" data-tab="${id}">${glyph(icon)} ${esc(label)}</button>`
      ).join("");
      tabsEl.querySelectorAll("[data-tab]").forEach(b =>
        b.addEventListener("click", () => {
          view = b.dataset.tab;
          render();
          // An answer from the other parent in the journal is only ever
          // noticed by looking, and this is the look.
          if (JOURNAL_VIEWS.has(view)) refreshJournal();
        }));

      const el = document.getElementById("content");
      ({ schedule: renderSchedule, swaps: renderSwaps, messages: renderMessages,
         handoffs: renderHandoffs, holidays: renderHolidays, records: renderRecords, setup: renderSetup }[view] ?? renderSchedule)(el);
    }

    // ── Schedule view ────────────────────────────────────────────────────────
    function renderSchedule(el) {
      if (!schedules.length) {
        // A child reads the materialized projection but not the agreement that
        // produced it: `schedule_versions` is adult-read, because its `rationale`
        // is one parent's written argument for changing custody. So when there is
        // no readable version but there ARE projected days, draw the calendar from
        // `custody_days` — the same rows the hub's Today and glance surfaces use.
        if (custodyDays.length) { renderProjectedSchedule(el); return; }
        // Nothing to draw because a read failed is not "no schedule". Saying so
        // would send a parent to set up one that already exists, and tell a
        // child they have nowhere to be.
        if (custodyReadFailed || versionsReadFailed) {
          el.innerHTML = `<div class="empty"><div>${chickadee("searching", { size: 72 })}</div>We couldn't load the custody schedule just now.<br><br>
            <button class="btn btn-primary" data-reload>Try again</button></div>`;
          el.querySelector("[data-reload]").addEventListener("click", async (e) => {
            e.target.disabled = true; e.target.textContent = "Loading…";
            await loadData();
            render();
          });
          return;
        }
        el.innerHTML = `<div class="empty"><div>${chickadee("nest", { size: 72 })}</div>No custody schedule yet.<br><br>
          ${canManage() ? `<button class="btn btn-primary" data-goto="setup">Set up a schedule</button>` : `Ask a parent to set one up.`}</div>`;
        el.querySelector("[data-goto]")?.addEventListener("click", () => { view = "setup"; render(); });
        return;
      }
      const kids = childIds();
      if (!currentChildId || !kids.includes(currentChildId)) currentChildId = kids[0];
      const sch = schedules.find(s => s.child_id === currentChildId);
      if (!calMonth) { const d = new Date(); calMonth = { y: d.getFullYear(), m: d.getMonth() }; }

      const pills = kids.map(cid =>
        `<button class="pill ${cid === currentChildId ? "active" : ""}" data-child="${esc(cid)}">${esc(memberName(cid))}</button>`
      ).join("");
      const colA = memberColor(sch.parent_a_id, members);
      const colB = memberColor(sch.parent_b_id, members);
      const monthName = new Date(calMonth.y, calMonth.m, 1).toLocaleString(undefined, { month: "long", year: "numeric" });

      // "Where are the kids now, and when does that change" — the same two facts
      // the hub's Today row and glance tile show, from the same projection.
      const todayRow = custodyDays.find(r => r.child_id === currentChildId && r.day === todayStr());
      const upcoming = nextTransition(custodyDays, addDays(todayStr(), 1), currentChildId);
      // Days behind today are drawn from the record, not recomputed from the
      // version in force now — see calendarCell.
      const recordByDay = new Map(custodyDays.filter(r => r.child_id === currentChildId).map(r => [r.day, r]));
      // An ended schedule is still the agreed version (retirement adds an end
      // date, it does not change the status), so it is still what this view
      // draws — but it is no longer something a swap can change.
      const ended = scheduleHasEnded(sch, todayStr());
      const statusHtml = todayRow ? `
        <div class="card">
          <div class="spread">
            <div>
              <strong>${esc(todayRow.title)}</strong>
              <div class="muted">${esc(todayRow.subtitle ?? "")}</div>
            </div>
            ${upcoming ? `<div class="muted" style="text-align:right">Next handoff<br><strong>${esc(fmtHandoffDay(upcoming.day))}</strong></div>` : ""}
          </div>
          ${upcoming && canManage() ? `
            <div class="row" style="margin-top:10px;gap:8px">
              <button class="btn btn-sm" data-noteupcoming="${esc(upcoming.child_id)}|${esc(upcoming.day)}">+ Note for this handoff</button>
              ${(() => { const n = notesForTransition(handoffs, upcoming.child_id, upcoming.day).length;
                         return n ? `<span class="muted">${n} note${n === 1 ? "" : "s"} ready</span>` : ""; })()}
            </div>` : ""}
        </div>` : "";

      el.innerHTML = `
        <div class="pills">${pills}</div>
        ${statusHtml}
        <div class="card">
          <div class="cal-head">
            <button class="btn btn-sm" data-nav="-1">‹</button>
            <strong>${esc(monthName)}</strong>
            <button class="btn btn-sm" data-nav="1">›</button>
          </div>
          <div class="cal-grid">
            ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => `<div class="cal-dow">${d}</div>`).join("")}
            ${renderMonthCells(sch, colA, colB, recordByDay)}
          </div>
          ${custodyGapNote()}
          <div class="legend">
            <span><span class="sw" style="background:${colA}"></span>${esc(memberName(sch.parent_a_id))}</span>
            <span><span class="sw" style="background:${colB}"></span>${esc(memberName(sch.parent_b_id))}</span>
            <span><span class="ov-dot" style="position:static;display:inline-block"></span> swap / override</span>
            <span><span class="ov-dot hol-dot" style="position:static;display:inline-block"></span> holiday</span>
            ${canManage() ? `<span><span class="act-dot" style="position:static;display:inline-block"></span> recorded otherwise</span>` : ""}

          ${canManage() ? parentingTimeHtml(sch) : ""}
          <p class="muted" style="margin:10px 0 0">${esc(patternLabel(sch))}${sch.exchange_time ? " · exchange at " + esc(sch.exchange_time) : ""}${
            sch.effective_to ? ` · ${ended ? "ended" : "ends"} ${esc(fmtHandoffDay(sch.effective_to))}` : ""}</p>
        </div>
        ${canManage() && !ended ? `<button class="btn btn-primary" data-newswap>Propose a swap</button>` : ""}`;

      el.querySelectorAll("[data-child]").forEach(b =>
        b.addEventListener("click", () => { currentChildId = b.dataset.child; render(); }));
      el.querySelectorAll("[data-noteupcoming]").forEach(b =>
        b.addEventListener("click", () => {
          const [child_id, day] = b.dataset.noteupcoming.split("|");
          openHandoffModal({ child_id, day });

      el.querySelectorAll("[data-nav]").forEach(b =>
        b.addEventListener("click", () => {
          let m = calMonth.m + parseInt(b.dataset.nav, 10), y = calMonth.y;

        c.addEventListener("click", () => {

    /** Planned against recorded days this month, per parent. Days nobody
     *  recorded count as planned; a disputed day counts for nobody. */
    function parentingTimeHtml(sch) {
      const ym = `${calMonth.y}-${String(calMonth.m + 1).padStart(2, "0")}`;
      const sum = parentingTimeSummary(custodyDays, custodyLog, sch.child_id, ym);
      if (!sum.byParent.size) return "";
      const parts = [...sum.byParent.entries()].map(([pid, c]) =>
        `<span><b>${esc(memberName(pid))}</b> ${c.planned} planned${c.recorded !== c.planned || sum.recorded ? ` · ${c.recorded} recorded` : ""}</span>`);
      const dispute = sum.disputed ? `<span class="muted">${sum.disputed} disputed day${sum.disputed === 1 ? "" : "s"}</span>` : "";
      return `<div class="legend" data-testid="parenting-time" style="margin-top:8px">${parts.join("")}${dispute}</div>
        <p class="hint" style="margin:4px 0 0">Click a past day to record where ${esc(memberName(sch.child_id))} actually was.</p>`;
    }

    /**
     * The schedule view for someone who can read the projection but not the
     * agreement — today, a child.
     *
     * Deliberately NOT a degraded copy of the adult view: it draws only days the
     * hub actually materialized, so it stops at the projection horizon instead of
     * computing a rotation client-side. A child asking "where am I on a Tuesday
     * in 2029" gets no answer rather than one the parents never countersigned.
     */
    function renderProjectedSchedule(el) {
      const kids = [...new Set(custodyDays.map(r => r.child_id))].filter(Boolean);
      if (!currentChildId || !kids.includes(currentChildId)) currentChildId = kids[0];
      if (!calMonth) { const d = new Date(); calMonth = { y: d.getFullYear(), m: d.getMonth() }; }

      const mine = custodyDays.filter(r => r.child_id === currentChildId);
      const byDay = new Map(mine.map(r => [r.day, r]));
      // Colour by whoever actually appears in the projection; there is no
      // parent_a/parent_b to read without the agreement row.
      const parents = [...new Set(mine.map(r => r.parent_id))].filter(Boolean);
      const colorFor = id => memberColor(id, members);

      const pills = kids.map(cid =>
        `<button class="pill ${cid === currentChildId ? "active" : ""}" data-child="${esc(cid)}">${esc(memberName(cid))}</button>`
      ).join("");
      const monthName = new Date(calMonth.y, calMonth.m, 1).toLocaleString(undefined, { month: "long", year: "numeric" });
      const todayRow = byDay.get(todayStr());
      const upcoming = nextTransition(custodyDays, addDays(todayStr(), 1), currentChildId);

      el.innerHTML = `
        <div class="pills">${pills}</div>
        ${todayRow ? `
          <div class="card">
            <div class="spread">
              <div>
                <strong>${esc(todayRow.title)}</strong>
                <div class="muted">${esc(todayRow.subtitle ?? "")}</div>
              </div>
              ${upcoming ? `<div class="muted" style="text-align:right">Next handoff<br><strong>${esc(fmtHandoffDay(upcoming.day))}</strong></div>` : ""}
            </div>
          </div>` : ""}
        <div class="card">
          <div class="cal-head">
            <button class="btn btn-sm" data-nav="-1">‹</button>
            <strong>${esc(monthName)}</strong>
            <button class="btn btn-sm" data-nav="1">›</button>
          </div>
          <div class="cal-grid">
            ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => `<div class="cal-dow">${d}</div>`).join("")}
            ${renderProjectedCells(byDay, colorFor)}
          </div>
          ${custodyGapNote()}
          <div class="legend">
            ${parents.map(id => `<span><span class="sw" style="background:${colorFor(id)}"></span>${esc(memberName(id))}</span>`).join("")}
          </div>
        </div>`;

      el.querySelectorAll("[data-child]").forEach(b =>
        b.addEventListener("click", () => { currentChildId = b.dataset.child; render(); }));
      el.querySelectorAll("[data-nav]").forEach(b =>
        b.addEventListener("click", () => {
          let m = calMonth.m + parseInt(b.dataset.nav, 10), y = calMonth.y;
          if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
          calMonth = { y, m }; render();
          showCustodyMonth();
        }));

    /** Fetch the record for the month on screen if it lies before what is
     *  loaded, then redraw — but only if that month is still the one showing. */
    function showCustodyMonth() {
      const { y, m } = calMonth;
      ensureCustodyFrom(monthBounds(y, m).first).then((changed) => {
        if (changed && view === "schedule" && calMonth.y === y && calMonth.m === m) render();
      });
    }

    /** Said under the grid when a past month's record could not be fetched, so
     *  empty past days are not mistaken for days nobody had the children. */
    function custodyGapNote() {
      if (!custodyBackfillFailed || !custodyFrom || monthBounds(calMonth.y, calMonth.m).first >= custodyFrom) return "";
      return `<p class="muted" style="margin:8px 0 0">We couldn't load the record for this month — go to another month and back to try again.</p>`;
    }

    function renderProjectedCells(byDay, colorFor) {
      const first = new Date(calMonth.y, calMonth.m, 1);
      const daysInMonth = new Date(calMonth.y, calMonth.m + 1, 0).getDate();
      let cells = "";
      for (let i = 0; i < first.getDay(); i++) cells += `<div class="cal-cell empty-cell"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const date = `${calMonth.y}-${String(calMonth.m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const row = byDay.get(date);
        const bg = row ? colorFor(row.parent_id) : "transparent";
        const tint = bg === "transparent" ? "" : `background:${bg}22`;
        cells += `<div class="cal-cell ${date === todayStr() ? "today" : ""}" style="${tint}" title="${row ? esc(memberName(row.parent_id)) : ""}">
          ${row?.source === "exception" || row?.source === "override" ? `<span class="ov-dot"></span>` : ""}
          ${row?.source === "holiday" ? `<span class="ov-dot hol-dot"></span>` : ""}
          <span class="dnum">${d}</span>
          <span class="who" style="color:${bg === "transparent" ? "inherit" : bg}">${row ? esc(initial(memberName(row.parent_id))) : ""}</span>
        </div>`;
      }
      return cells;
    }

    function renderMonthCells(sch, colA, colB, recordByDay) {
      const first = new Date(calMonth.y, calMonth.m, 1);
      const daysInMonth = new Date(calMonth.y, calMonth.m + 1, 0).getDate();
      const today = todayStr();
      // Found and parsed once for the month, not once per cell.
      const agreedHoliday = agreedVersion(holidayVersions, sch.child_id);
      const holiday = agreedHoliday ? { ...agreedHoliday, rules: parseHolidayRules(agreedHoliday.rules) } : null;
      let cells = "";
      for (let i = 0; i < first.getDay(); i++) cells += `<div class="cal-cell empty-cell"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const date = `${calMonth.y}-${String(calMonth.m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const eff = calendarCell(sch, overrides, recordByDay, date, today, holiday);
        // A past day can belong to someone who is neither parent on the version
        // in force now (an earlier version named them, or a swap did), so the
        // record's own parent gets a colour rather than being drawn as nobody.
        const bg = !eff.parent_id ? "transparent"
          : eff.parent_id === sch.parent_a_id ? colA
          : eff.parent_id === sch.parent_b_id ? colB
          : memberColor(eff.parent_id, members);
        const tint = bg === "transparent" ? "" : `background:${bg}22`;
        const who = eff.parent_id ? esc(initial(memberName(eff.parent_id))) : "";
        // A past day a parent may record: where the child actually was. The
        // marker shows a recorded day that differs from the plan, or a dispute.
        const past = date <= today && !!eff.parent_id && canManage();
        const actual = past ? actualParentForDay(custodyLog, sch.child_id, date) : null;
        const differs = actual && (actual.disputed || actual.parent_id !== eff.parent_id);
        cells += `<div class="cal-cell ${date === today ? "today" : ""}${past ? " past" : ""}" style="${tint}" title="${eff.parent_id ? esc(memberName(eff.parent_id)) : ""}${eff.source === "holiday" && eff.label ? " · " + esc(eff.label) : ""}"${past ? ` data-actual="${esc(sch.child_id)}|${date}"` : ""}>
          ${eff.source === "override" ? `<span class="ov-dot"></span>` : ""}
          ${eff.source === "holiday" ? `<span class="ov-dot hol-dot"></span>` : ""}
          ${differs ? `<span class="act-dot${actual.disputed ? " disputed" : ""}" title="${actual.disputed ? "Disputed" : "Recorded: with " + esc(memberName(actual.parent_id))}"></span>` : ""}
          <span class="dnum">${d}</span>
          <span class="who" style="color:${bg === "transparent" ? "inherit" : bg}">${who}</span>
        </div>`;
      }
      return cells;
    }

    function patternLabel(sch) {
      if (sch.pattern === "alternating_weeks") return "Alternating weeks";
      if (sch.pattern === "two_two_three") return "2-2-3 rotation";
      // Alternating weekends falls through to the derived path below, like a
      // custom cycle: its nights are placed by position too, so "(Fri–Sun)" is
      // true of a Monday-anchored one and of no other. An agreement signed
      // years ago against a Tuesday anchor gets the name its nights earn.
      if (sch.pattern === "custom" || sch.pattern === "alternating_weekends") {
        // Derived from the cycle AND the anchor, never stored beside them. A
        // schedule already countersigned is frozen and cannot be relabelled, so
        // the only way its label can be true is for it to be computed from what
        // was actually signed — which is also what stops a historical row whose
        // anchor nobody checked from wearing a name its nights never had.
        const cyc = normalizeCycle(sch.cycle);
        return nameForCycle(cyc, sch.anchor_date) ?? `Custom ${cyc.length}-day cycle`;
      }
      // A draft is allowed to be half-finished, so it can reach here with no
      // pattern at all — which must read as unfinished, not as an empty label.
      return sch.pattern || "Not filled in yet";
    }

    // Every pattern is resolved as an offset from anchor_date, so the anchor is
    // what aligns a rotation to the days of the week. The fixed-shape patterns
    // therefore need the anchor on a specific weekday; say which, at the point
    // the date is picked, rather than leaving it to be discovered afterwards.
    function anchorHint(pattern, cycle) {
      if (pattern === "alternating_weekends") {
        return "Pick the Monday that opens a week in which Parent B has the weekend.";
      }
      if (pattern === "two_two_three") return "Pick the first day of Parent A's two-day block.";
      if (pattern === "alternating_weeks") return "Pick the first day of one of Parent A's weeks.";
      // A custom cycle that IS a known shape needs that shape's advice, which
      // on 2-2-5-5 is the difference between the pattern they asked for and a
      // valid-looking rotation that is not it.
      if (pattern === "custom") return cycleAnchorHint(cycle);
      return "The first day of the cycle; the sequence repeats from here.";
    }

    // ── Swaps view ───────────────────────────────────────────────────────────
    function renderSwaps(el) {
      if (!canManage()) { el.innerHTML = `<div class="empty">Swaps are managed by the parents.</div>`; return; }
      // Surfaced here rather than only as an alert from the New-swap button:
      // a swap is a request TO someone, so with no co-parent recorded there is
      // nobody to send it to.
      if (!partnerId) {
        el.innerHTML = pairingPrompt("A swap is a request to your co-parent, so we need to know who that is.");
        wirePairingPrompt(el);
        return;
      }
      const list = schedules.length
        ? (swaps.length ? swaps.map(swapCard).join("") : `<div class="empty"><div>${chickadee("nest", { size: 72 })}</div>No swap requests yet.</div>`)
        : `<div class="empty">Add a custody schedule in Setup before proposing swaps.</div>`;
      el.innerHTML = `
        <div class="spread" style="margin-bottom:12px">
          <span class="muted">Both parents must agree before a swap changes the calendar.</span>
          ${swappableSchedules().length ? `<button class="btn btn-primary btn-sm" data-newswap>+ New swap</button>` : ""}
        </div>
        ${list}`;
      el.querySelector("[data-newswap]")?.addEventListener("click", () => openSwapModal(swappableSchedules()[0]?.child_id));
      el.querySelectorAll("[data-agree]").forEach(b => b.addEventListener("click", () => onAgree(b.dataset.agree)));
      el.querySelectorAll("[data-decline]").forEach(b => b.addEventListener("click", () => onDecline(b.dataset.decline)));
      el.querySelectorAll("[data-cancel]").forEach(b => b.addEventListener("click", () => onCancel(b.dataset.cancel)));
    }

    /** The schedules a swap can still change: agreed, and not yet ended. */
    function swappableSchedules() {
      return schedules.filter(sch => !scheduleHasEnded(sch, todayStr()));
    }

    /** Why a swap both parents signed has not taken effect, for the card. */
    function stallMessage(s) {
      const reason = swapStallReason(s, todayStr());
      if (reason === "past") {
        return "You both agreed, but the dates had already passed by then, so the calendar was not changed. Withdraw it to clear it.";
      }
      if (reason === "too_far") {
        return `You both agreed, but it starts more than ${SWAP_HORIZON_DAYS} days ahead and the calendar is only worked out that far, so it has not taken effect. `
          + `It can be confirmed from ${fmtHandoffDay(addDays(s.start_date, -SWAP_HORIZON_DAYS))} — or withdraw it and ask again nearer the time.`;
      }
      return "You both agreed, but it has not been applied to the calendar. Confirm it again to apply it.";
    }

    function swapCard(s) {
      const mine = me && s.requester_id === me.id;
      const iAmResponder = me && s.responder_id === me.id;
      const badge = { pending: "b-pending", locked: "b-locked", declined: "b-declined", cancelled: "b-cancelled" }[s.status];
      // App-side only — see swapPartyIssue. Checked against the version in
      // force, and only where there is one to check against.
      const sch = agreedVersion(versions, s.child_id);
      const partyIssue = sch && (s.status === "pending" || s.status === "locked") ? swapPartyIssue(s, sch) : null;
      const stalled = swapIsStalled(s);
      let actions = "";
      let notice = "";
      if (partyIssue) {
        // Never offer to countersign it. A way out stays for whoever is party
        // to it; once locked there is none the app can offer, so it says so.
        notice = s.status === "locked"
          ? `This is confirmed and on the calendar, but it is not an ordinary swap. ${partyIssue} `
            + `The parents on ${memberName(s.child_id)}'s schedule are ${memberName(sch.parent_a_id)} and ${memberName(sch.parent_b_id)}.`
          : partyIssue;
        if (s.status === "pending") {
          actions = `${iAmResponder ? `<button class="btn btn-danger btn-sm" data-decline="${esc(s.id)}">Decline</button>` : ""}
                     ${mine ? `<button class="btn btn-sm" data-cancel="${esc(s.id)}">Withdraw</button>` : ""}`;
        }
      } else if (stalled) {
        // Both signatures are on it and it never locked (see swapIsStalled).
        // With both flags set nobody is offered "Agree", so this state needs
        // its own explanation and its own way out — for either parent.
        notice = stallMessage(s);
        if (mine || iAmResponder) {
          actions = `${swapStallReason(s, todayStr()) === "retry" ? `<button class="btn btn-primary btn-sm" data-agree="${esc(s.id)}">Confirm again</button>` : ""}
                     ${iAmResponder ? `<button class="btn btn-danger btn-sm" data-decline="${esc(s.id)}">Decline</button>` : ""}
                     ${mine ? `<button class="btn btn-sm" data-cancel="${esc(s.id)}">Withdraw</button>` : ""}`;
        }
      } else if (s.status === "pending") {
        if (canMemberAgreeToSwap(s, me?.id)) {
          actions = `<button class="btn btn-primary btn-sm" data-agree="${esc(s.id)}">Agree</button>
                     ${iAmResponder ? `<button class="btn btn-danger btn-sm" data-decline="${esc(s.id)}">Decline</button>` : ""}
                     ${mine ? `<button class="btn btn-sm" data-cancel="${esc(s.id)}">Cancel</button>` : ""}`;
        } else if (mine) {
          actions = `<span class="muted">${s.requester_agreed ? "Waiting for the other parent…" : ""}</span>
                     <button class="btn btn-sm" data-cancel="${esc(s.id)}">Cancel</button>`;
        }
      }
      const label = s.status === "locked" ? "confirmed" : s.status;
      return `<div class="card">
        <div class="spread">
          <strong>${esc(memberName(s.child_id))} → ${esc(memberName(s.to_parent_id))}</strong>
          <span class="badge ${badge}">${esc(label)}</span>
        </div>
        <p class="muted" style="margin:4px 0">${esc(fmtRange(s.start_date, s.end_date))}</p>
        ${s.note ? `<p style="margin:4px 0">${esc(s.note)}</p>` : ""}
        <p class="muted" style="margin:4px 0 8px">Proposed by ${esc(memberName(s.requester_id))} · to ${esc(memberName(s.responder_id))}</p>
        ${notice ? `<p class="immutable-note" style="margin:4px 0 8px">${glyph("warning")} ${esc(notice)}</p>` : ""}
        <div class="row" style="justify-content:flex-end">${actions}</div>
      </div>`;
    }

    /** "Fri" for the coming week, else the full date. Rule lives in logic.js
     *  (tested) — it needs today, which is the household's, not the device's. */
    function fmtHandoffDay(day) { return fmtHandoffDayFrom(day, todayStr()); }

    function fmtRange(a, b) {
      const f = (d) => new Date(d + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
      return a === b ? f(a) : `${f(a)} – ${f(b)}`;
    }

    function currentPairingState() {
      return pairingState({
        partnerId, reciprocal: partnerReciprocal, proposalPending: partnerProposalPending,
      });
    }

    /**
     * The blocked-on-pairing panel for Swaps.
     *
     * It used to send you to Setup to work out what was wrong. When the
     * co-parent is unambiguous the whole thing collapses to one button here;
     * otherwise it still explains itself rather than just refusing.
     */
    // Only ever drawn with no co-parent named: Swaps asks for one and nothing
    // more, so there is no awaiting or ended pairing to explain here.
    function pairingPrompt(why) {
      const suggested = likelyCoParent();
      if (suggested) {
        return `<div class="empty">${esc(why)}
          <br><br><button class="btn btn-primary" data-pair="${esc(suggested.id)}">Pair with ${esc(suggested.name)}</button></div>`;
      }
      return `<div class="empty">${esc(why)}
        <br><br><button class="btn btn-primary" data-goto="setup">Choose your co-parent</button></div>`;
    }

    function wirePairingPrompt(el) {
      el.querySelector("[data-goto]")?.addEventListener("click", () => { view = "setup"; render(); });
      const pairBtn = el.querySelector("[data-pair]");
      pairBtn?.addEventListener("click", () =>
        pairWith(pairBtn.dataset.pair, pairBtn, pairBtn.textContent));
    }

    // ── Messages view ────────────────────────────────────────────────────────
    /**
     * Messages are the space's own, in the hub's Messages — one inbox, kept as a
     * record there. This tab only points at it: at the conversation with the
     * co-parent when the app knows who that is (the pairing, or the one adult it
     * could be), otherwise at the inbox.
     *
     * The app runs in a sandboxed frame that cannot navigate the hub page, so
     * the hub's link shim opens this for it; `target="_top"` is what marks the
     * link as leaving the app. With no hub origin published the link cannot be
     * built, so the card says where to look instead of offering a dead button.
     *
     * No promise here that a message cannot be deleted: that is true of a
     * co-parenting space and not of an ordinary household, and the app cannot
     * tell which it is running in.
     */
    function renderMessages(el) {
      // Rules live in logic.js (tested).
      const paired = partnerId ? memberMap.get(partnerId) : null;
      const coParent = messagesCoParent({
        canManage: canManage(), partnerId, paired,
        pairedIsAdult: !!paired && isAdult(paired, members),
        candidate: partnerId ? null : likelyCoParent(),
      });
      const href = hubMessagesUrl(HUB_ORIGIN, coParent?.id);
      const label = coParent ? `Open messages with ${coParent.name}` : "Open Messages";
      el.innerHTML = `
        <div class="empty" data-testid="messages-card">
          <div>${chickadee("mail", { size: 72 })}</div>
          ${coParent
            ? `Your conversation with <b>${esc(coParent.name)}</b> is in this space's Messages.`
            : `Conversations are in this space's Messages.`}
          ${canManage() ? `<p class="immutable-note">${glyph("seal-document")} Your conversations with the other adults are part of the full record, under Records.</p>` : ""}
          ${href
            ? `<a class="btn btn-primary" data-testid="open-messages" href="${esc(href)}" target="_top">${esc(label)}</a>`
            : `<p class="muted">Open Messages from the space's menu.</p>`}
        </div>`;
    }

    function fmtDateTime(iso) {
      const d = new Date(iso);
      return isNaN(d) ? iso : d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }

    // ── Holidays view ────────────────────────────────────────────────────────
    // A holiday schedule is an agreement, like the standing schedule: one
    // parent proposes a list of rules, it takes effect when both have signed
    // (or on one signature when there is nobody else to ask), and the hub
    // works the rules out into custody days every year from then on — above
    // the rotation, beneath any countersigned swap. Nothing here writes a day.
    let holidayChildId = null;

    function partyName(holiday, tag) {
      return tag === "a" ? memberName(holiday.parent_a_id) : tag === "b" ? memberName(holiday.parent_b_id) : "";
    }

    /** "even years Dana · odd years Sam", "every year Dana", "even years Dana". */
    function holidayWho(holiday, rule) {
      if (rule.even_years && rule.even_years === rule.odd_years) return `every year ${partyName(holiday, rule.even_years)}`;
      return [
        rule.even_years ? `even years ${partyName(holiday, rule.even_years)}` : "",
        rule.odd_years ? `odd years ${partyName(holiday, rule.odd_years)}` : "",
      ].filter(Boolean).join(" · ");
    }

    function holidayRulesHtml(holiday) {
      const rules = parseHolidayRules(holiday.rules);
      const parties = { a: holiday.parent_a_id, b: holiday.parent_b_id };
      if (!rules.length) return `<p class="muted">No rules could be read from this document.</p>`;
      return rules.map(rule => {
        const next = nextHolidayOccurrence(rule, parties, todayStr());
        return `
          <div data-testid="holiday-rule" style="padding:8px 0;border-top:1px solid var(--hub-border,#f3f4f6)">
            <div class="spread">
              <div><strong>${esc(rule.label)}</strong>
                <div class="muted">${esc(describeHolidayRule(rule))}${rule.exchange_time ? ` · exchange ${esc(fmtExchangeTime(rule.exchange_time))}` : ""}</div>
                <div class="muted">${esc(holidayWho(holiday, rule))}</div></div>
              ${next ? `<div class="muted" style="text-align:right">Next<br><strong>${esc(fmtHandoffDay(next.start, todayStr()))}</strong><br>${esc(memberName(next.parent_id))}</div>` : ""}
            </div>
          </div>`;
      }).join("");
    }

    function renderHolidays(el) {
      if (!canManage()) { el.innerHTML = `<div class="empty">Holiday schedules are agreed between the parents.</div>`; return; }
      const kids = childIds();
      if (!kids.length) {
        el.innerHTML = `<div class="empty">Agree a custody schedule in Setup first — holidays are exceptions to it.</div>`;
        return;
      }
      if (!holidayChildId || !kids.includes(holidayChildId)) holidayChildId = currentChildId && kids.includes(currentChildId) ? currentChildId : kids[0];
      const cid = holidayChildId;
      const agreed = agreedVersion(holidayVersions, cid);
      // An agreed schedule with no rules is a retired one: nothing is in force,
      // and it is still the version a new proposal must be written against.
      const inForce = agreed && parseHolidayRules(agreed.rules).length ? agreed : null;
      const pending = openAmendment(holidayVersions, cid);
      const pendingEnds = pending && !parseHolidayRules(pending.rules).length;
      const mine = pending?.proposed_by === me?.id;
      // Which side has signed is inferred from who proposed, as the standing
      // schedule does; the hub corrects it on the first countersign attempt.
      const stance = pending ? amendmentStance(pending, me?.id, signedElsewhere.has(pending.id)) : null;

      el.innerHTML = `
        ${kids.length > 1 ? `<div class="pills">${kids.map(k =>
          `<button class="pill ${k === cid ? "active" : ""}" data-hchild="${esc(k)}">${esc(memberName(k))}</button>`).join("")}</div>` : ""}
        <div class="card">
          <p class="muted" style="margin:0">A holiday schedule is agreed once and applies every year. It overrides the regular rotation on the days it names; a countersigned swap still overrides it.</p>
        </div>
        ${pending ? `
          <div class="card" data-testid="holiday-pending">
            <strong>${glyph("hourglass")} ${pendingEnds ? "Ending the holiday schedule proposed" : "Holiday schedule proposed"}${pending.proposed_by ? ` by ${esc(memberName(pending.proposed_by))}` : ""}</strong>
            ${pending.rationale ? `<div class="muted">“${esc(pending.rationale)}”</div>` : ""}
            ${pendingEnds
              ? `<p class="muted">This names no days. Once countersigned, every day follows the regular rotation.</p>`
              : holidayRulesHtml(pending)}
            <p class="muted" style="margin:8px 0 0">${stance === "awaiting_them"
              ? `Waiting for your co-parent to countersign. ${inForce ? "The holiday schedule in force stays as it is until they do." : "Nothing changes until they do."}`
              : "This takes effect only once you countersign it."}</p>
            <div class="row" style="margin-top:8px;gap:8px">
              ${canSignAmendment(pending, me?.id, signedElsewhere.has(pending.id))
                ? `<button class="btn btn-primary btn-sm" data-signhol="${esc(pending.id)}">Countersign</button>` : ""}
              <button class="btn btn-sm btn-danger" data-declinehol="${esc(pending.id)}">${mine ? "Withdraw" : "Decline"}</button>
            </div>
          </div>` : ""}
        ${inForce ? `
          <div class="card" data-testid="holiday-agreed">
            <div class="spread">
              <strong>${esc(memberName(cid))}'s holiday schedule</strong>
              <span class="badge b-locked">In force</span>
            </div>
            <div class="muted">${versionSignatures(agreed) === "both"
              ? (agreed.countersigned_at
                ? `In force since ${esc(fmtDateTime(agreed.agreed_at))} · countersigned ${esc(fmtDateTime(agreed.countersigned_at))}`
                : `Countersigned ${esc(fmtDateTime(agreed.agreed_at))}`)
              : `In force since ${esc(fmtDateTime(agreed.agreed_at))} on one parent's signature — nobody else was here to countersign it`}</div>
            ${holidayRulesHtml(agreed)}
            ${unilateralStance(agreed, me?.id) === "unsigned_parent" ? `
              <div class="muted" style="margin-top:8px">${glyph("warning")} ${esc(agreed.proposed_by ? memberName(agreed.proposed_by) : "The other parent")} put this in force
                on their signature alone. You have not signed it — countersign it if it is what you agreed, or propose changes.</div>
              <div class="row" style="margin-top:8px"><button class="btn btn-primary btn-sm" data-latesignhol="${esc(agreed.id)}">Countersign</button></div>` : ""}
          </div>` : (pending ? "" : `
          <div class="empty" data-testid="holiday-empty"><div>${chickadee("nest", { size: 72 })}</div>${agreed ? "The holiday schedule was ended." : "No holiday schedule yet."}<br>
            <span class="muted">Until there is one, every day follows the regular rotation.</span></div>`)}
        ${pending ? "" : `<button class="btn btn-primary" data-newhol>${inForce ? "Propose changes" : "Propose a holiday schedule"}</button>`}
        ${inForce && !pending ? `<p class="hint">To end the holiday schedule, propose changes with nothing ticked.</p>` : ""}`;

      el.querySelectorAll("[data-hchild]").forEach(b =>
        b.addEventListener("click", () => { holidayChildId = b.dataset.hchild; render(); }));
      el.querySelector("[data-newhol]")?.addEventListener("click", () => openHolidayModal(cid, agreed));
      el.querySelector("[data-signhol]")?.addEventListener("click", e => onSignHoliday(e.currentTarget.dataset.signhol, e.currentTarget));
      el.querySelector("[data-declinehol]")?.addEventListener("click", e => onDeclineHoliday(e.currentTarget.dataset.declinehol, e.currentTarget));
      el.querySelector("[data-latesignhol]")?.addEventListener("click", e => onCountersignHolidayInForce(e.currentTarget.dataset.latesignhol));
    }

    /** The editor's working list: the agreed rules (ticked), then every preset
     *  not already among them (ticked by its own default only on a first
     *  schedule — a change starts from what is in force, nothing more). */
    function holidayEditorRows(agreed) {
      const current = agreed ? parseHolidayRules(agreed.rules) : [];
      const have = new Set(current.map(r => r.id));
      return [
        ...current.map(r => ({ ...r, on: true })),
        ...HOLIDAY_PRESETS.filter(p => !have.has(p.id)).map(p => ({
          // Defaults are for a first schedule (or one after a retired one); a
          // change to rules in force starts from those rules and nothing more.
          ...p, on: current.length ? false : p.on,
          even_years: "a", odd_years: p.same ? "a" : "b",
        })),
      ];
    }

    function openHolidayModal(childId, agreed) {
      const sch = schedules.find(s => s.child_id === childId);
      if (!sch) { hubAlert("Agree a custody schedule for this child first."); return; }
      // The parents named on the holiday schedule are its own terms: those in
      // force on it already, or the standing schedule's for a first one.
      const parent_a_id = agreed?.parent_a_id ?? sch.parent_a_id;
      const parent_b_id = agreed?.parent_b_id ?? sch.parent_b_id;
      const rows = holidayEditorRows(agreed);
      // A retired schedule (agreed, no rules) is still the version a proposal is
      // written against, but there is nothing in force to change or to end.
      const inForce = !!agreed && parseHolidayRules(agreed.rules).length > 0;
      let customCount = 0;
      const MONTH_OPTIONS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"]
        .map((name, i) => `<option value="${i + 1}">${name}</option>`).join("");
      const whoSelect = (i, field, value) => `
        <select data-hwho="${i}|${field}" aria-label="${field === "even_years" ? "Even years" : "Odd years"}">
          <option value="a" ${value === "a" ? "selected" : ""}>${esc(memberName(parent_a_id))}</option>
          <option value="b" ${value === "b" ? "selected" : ""}>${esc(memberName(parent_b_id))}</option>
          <option value="" ${!value ? "selected" : ""}>Regular schedule</option>
        </select>`;
      const rowsHtml = () => rows.map((r, i) => `
        <div data-testid="holiday-edit-row" data-rule="${esc(r.id)}" style="padding:8px 0;border-top:1px solid var(--hub-border,#f3f4f6)">
          <label class="row" style="gap:8px"><input type="checkbox" data-hon="${i}" ${r.on ? "checked" : ""}>
            <span><strong>${esc(r.label)}</strong> <span class="muted">${esc(describeHolidayRule(r))}</span></span></label>
          <div class="row" style="gap:8px;margin:6px 0 0 24px;${r.on ? "" : "display:none"}" data-hdetail="${i}">
            <label class="field" style="flex:1"><span>Even years</span>${whoSelect(i, "even_years", r.even_years)}</label>
            <label class="field" style="flex:1"><span>Odd years</span>${whoSelect(i, "odd_years", r.odd_years)}</label>
          </div>
        </div>`).join("");

      openModal(`
        <h3>${inForce ? "Propose changes to the holiday schedule" : "Propose a holiday schedule"}</h3>
        <p class="muted">For ${esc(memberName(childId))}. Tick the days it covers and choose who has each. It takes effect once ${esc(memberName(partnerId) || "the other parent")} countersigns, and then applies every year.</p>
        <div id="h-rows">${rowsHtml()}</div>
        <div class="card" style="margin-top:10px">
          <strong>Add a date or a break</strong>
          <label class="field"><span>Name</span><input type="text" id="hc-label" maxlength="80" placeholder="e.g. Spring break, ${esc(memberName(childId))}'s birthday"></label>
          <div class="row" style="gap:8px">
            <label class="field" style="flex:1"><span>From</span><span class="row" style="gap:4px"><select id="hc-sm">${MONTH_OPTIONS}</select><input type="number" id="hc-sd" min="1" max="31" value="1" style="width:4.5em"></span></label>
            <label class="field" style="flex:1"><span>To (same day for one day)</span><span class="row" style="gap:4px"><select id="hc-em">${MONTH_OPTIONS}</select><input type="number" id="hc-ed" min="1" max="31" value="1" style="width:4.5em"></span></label>
          </div>
          <button class="btn btn-sm" id="hc-add" type="button">Add</button>
        </div>
        <label class="field"><span>Reason (optional)</span><textarea id="h-rationale" maxlength="500" placeholder="e.g. As set out in our parenting plan."></textarea></label>
        <div class="modal-actions">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" id="save-hol">Propose and sign</button>
        </div>`);

      const rowsEl = modalEl.querySelector("#h-rows");
      // Delegated: the list is redrawn when a custom entry is added.
      rowsEl.addEventListener("change", e => {
        const on = e.target.dataset.hon, who = e.target.dataset.hwho;
        if (on !== undefined) {
          rows[Number(on)].on = e.target.checked;
          rowsEl.querySelector(`[data-hdetail="${on}"]`).style.display = e.target.checked ? "" : "none";
        } else if (who) {
          const [i, field] = who.split("|");
          rows[Number(i)][field] = e.target.value || null;
        }
      });
      modalEl.querySelector("#hc-add").addEventListener("click", () => {
        const label = modalEl.querySelector("#hc-label").value.trim();
        const start = { month: Number(modalEl.querySelector("#hc-sm").value), day: Number(modalEl.querySelector("#hc-sd").value) };
        const end = { month: Number(modalEl.querySelector("#hc-em").value), day: Number(modalEl.querySelector("#hc-ed").value) };
        const single = start.month === end.month && start.day === end.day;
        let id;
        do { id = `custom-${++customCount}`; } while (rows.some(r => r.id === id));
        const rule = single
          ? { id, label, kind: "fixed", month: start.month, day: start.day, even_years: "a", odd_years: "b", on: true }
          : { id, label, kind: "range", start, end, even_years: "a", odd_years: "b", on: true };
        const blocker = holidayRulesBlocker([rule]);
        if (blocker) { hubAlert(blocker); return; }
        rows.push(rule);
        rowsEl.innerHTML = rowsHtml();
        modalEl.querySelector("#hc-label").value = "";
      });
      modalEl.querySelector("#save-hol").addEventListener("click", () =>
        onProposeHoliday({
          child_id: childId, parent_a_id, parent_b_id,
          rules: rows.filter(r => r.on),
          rationale: modalEl.querySelector("#h-rationale").value.trim(),
          base_version_id: agreed?.id ?? null,
          retiring: inForce,
        }));
    }

    function agreeHoliday(id, agreed, resolution, expectedSnapshot) {
      return requestJson(`/run/${APP_ID}/api/agree`, {
        body: {
          table: "holiday_versions", id, agreed,
          ...(resolution ? { resolution } : {}),
          ...(expectedSnapshot ? { expected_snapshot: expectedSnapshot } : {}),
        },
        fallbackError: "Could not record your decision",
      });
    }

    // Same retry rule as the standing schedule's proposeAndSign: the hub mints
    // the proposal's id, so a proposal that was written but could be neither
    // signed nor withdrawn is remembered against its exact terms, and sending
    // those terms again signs THAT row instead of proposing twice.
    let unsignedHoliday = null;   // { key, id }

    async function onProposeHoliday(input) {
      const retiring = !!input.retiring;
      const blocker = holidayRulesBlocker(input.rules, { retiring });
      if (blocker) { hubAlert(blocker); return; }
      if (!input.rules.length) {
