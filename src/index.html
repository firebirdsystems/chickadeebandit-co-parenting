<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/run/co-parenting/" />
  <title>Co-Parenting</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      font-size: var(--hub-font-size, 15px);
      background: var(--hub-bg, #f9fafb);
      color: var(--hub-text, #000000);
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
    h1 { font-size: 1.35rem; margin: 0 0 2px; }
    .sub { color: var(--hub-text-muted, #6b7280); font-size: 0.85rem; margin: 0 0 16px; }

    /* Tabs */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--hub-border, #e5e7eb); margin-bottom: 16px; overflow-x: auto; }
    .tab { padding: 8px 14px; border: none; background: none; cursor: pointer; color: var(--hub-text-muted, #6b7280);
      font-size: 0.9rem; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab.active { color: var(--hub-primary, #4f46e5); border-bottom-color: var(--hub-primary, #4f46e5); font-weight: 600; }

    /* Cards */
    .card { background: var(--hub-surface, #fff); border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: var(--hub-radius, 10px); padding: 14px; margin-bottom: 12px; }
    .card h3 { margin: 0 0 8px; font-size: 1rem; }

    .row { display: flex; align-items: center; gap: 8px; }
    .spread { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .muted { color: var(--hub-text-muted, #6b7280); font-size: 0.85rem; }
    .empty { text-align: center; color: var(--hub-text-muted, #6b7280); padding: 32px 16px; }

    /* Buttons */
    .btn { border: 1px solid var(--hub-border, #d1d5db); background: var(--hub-surface, #fff); color: var(--hub-text, #000000);
      padding: 7px 12px; border-radius: 8px; cursor: pointer; font-size: 0.88rem; }
    .btn:hover { background: var(--hub-bg, #f3f4f6); }
    .btn-primary { background: var(--hub-primary, #4f46e5); color: var(--hub-primary-fg, #fff); border-color: var(--hub-primary, #4f46e5); }
    .btn-primary:hover { background: var(--hub-primary-hover, #4338ca); }
    .btn-danger { color: #b91c1c; border-color: #fca5a5; }
    .btn:disabled { opacity: 0.55; cursor: default; }
    .btn-sm { padding: 4px 9px; font-size: 0.8rem; }

    /* Avatars */
    .avatar { width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 0.72rem; font-weight: 700; flex-shrink: 0; }

    /* Calendar */
    .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .cal-dow { text-align: center; font-size: 0.68rem; color: var(--hub-text-muted, #6b7280); padding: 2px 0; text-transform: uppercase; }
    .cal-cell { aspect-ratio: 1 / 1; border-radius: 7px; padding: 3px 4px; font-size: 0.72rem; position: relative;
      display: flex; flex-direction: column; justify-content: space-between; color: #1f2937; overflow: hidden; }
    .cal-cell.empty-cell { background: transparent; }
    .cal-cell .dnum { font-weight: 600; opacity: 0.85; }
    .cal-cell .who { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
    .cal-cell.today { outline: 2px solid var(--hub-primary, #4f46e5); outline-offset: -2px; }
    .cal-cell .ov-dot { position: absolute; top: 3px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: #1f2937; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 0.8rem; }
    .legend .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; margin-right: 5px; vertical-align: -1px; }

    /* Child tabs (pills) */
    .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .pill { padding: 5px 12px; border-radius: 999px; border: 1px solid var(--hub-border, #e5e7eb); background: var(--hub-surface,#fff);
      cursor: pointer; font-size: 0.85rem; }
    .pill.active { background: var(--hub-primary, #4f46e5); color: var(--hub-primary-fg, #fff); border-color: var(--hub-primary, #4f46e5); }

    /* Messages */
    .thread { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; max-height: 55vh; overflow-y: auto; }
    .msg { max-width: 78%; padding: 8px 11px; border-radius: 12px; font-size: 0.9rem; line-height: 1.35; white-space: pre-wrap; word-break: break-word; }
    .msg .meta { font-size: 0.68rem; opacity: 0.7; margin-top: 4px; }
    .msg.mine { align-self: flex-end; background: var(--hub-primary, #4f46e5); color: var(--hub-primary-fg, #fff); border-bottom-right-radius: 3px; }
    .msg.theirs { align-self: flex-start; background: var(--hub-bg, #eef0f3); border-bottom-left-radius: 3px; }
    .compose { display: flex; gap: 8px; align-items: flex-end; }
    .compose textarea { flex: 1; }
    .immutable-note { font-size: 0.75rem; color: var(--hub-text-muted, #6b7280); margin: 0 0 10px; }
    /* An ended relationship's record: same bubbles, visibly set apart so it
       never reads as part of the conversation with the current co-parent. */
    .archive-group { display: flex; flex-direction: column; gap: 8px; padding: 8px 0 12px; border-bottom: 1px dashed var(--hub-border, #d1d5db); margin-bottom: 4px; opacity: 0.85; }
    .archive-head { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--hub-text-muted, #6b7280); align-self: center; }

    /* Badges */
    .badge { font-size: 0.7rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; letter-spacing: 0.02em; }
    .b-pending { background: #fef3c7; color: #92400e; }
    .b-locked { background: #dcfce7; color: #166534; }
    .b-declined { background: #fee2e2; color: #991b1b; }
    .b-cancelled { background: #f3f4f6; color: #4b5563; }

    /* Forms */
    label.field { display: block; margin-bottom: 10px; font-size: 0.85rem; }
    label.field > span { display: block; margin-bottom: 4px; color: var(--hub-text-muted, #6b7280); }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--hub-border, #d1d5db);
      border-radius: 8px; font: inherit; background: var(--hub-surface, #fff); color: var(--hub-text, #000000); }
    textarea { resize: vertical; min-height: 44px; }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center;
      justify-content: center; padding: 16px; z-index: 50; }
    .modal { background: var(--hub-surface, #fff); border-radius: var(--hub-radius, 12px); padding: 18px;
      max-width: 440px; width: 100%; max-height: 90vh; overflow-y: auto; }
    .modal h3 { margin: 0 0 14px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

    .radio-list label { display: flex; align-items: center; gap: 8px; padding: 8px; border: 1px solid var(--hub-border, #e5e7eb);
      border-radius: 8px; margin-bottom: 6px; cursor: pointer; }
    .radio-list input { width: auto; }
    .hint { font-size: 0.78rem; color: var(--hub-text-muted, #6b7280); margin-top: -4px; margin-bottom: 10px; }
    .note-cat { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; padding: 2px 7px; border-radius: 5px;
      background: var(--hub-bg, #eef0f3); color: var(--hub-text-muted, #4b5563); }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>🧭 Co-Parenting</h1>
    <p class="sub">Custody schedule, swaps, and a shared record — kept straight between two homes.</p>
    <div id="tabs" class="tabs"></div>
    <div id="content"></div>
  </div>

  <script type="module">
    import {
      memberColor, initial, esc, isAdult, hubConfirm, hubAlert,
      sendHubNotification, hubAppUrl, searchMatch,
    } from "/hub-sdk.js";
    import {
      effectiveForDate, normalizeCycle, addDays, validateSwap, buildCustodyDays,
      nextTransition, upcomingTransitions, groupNotesByTransition,
      notesForTransition, searchableFields, describeScheduleChange,
      soleCoParentCandidate, lockedSwapOverrides, mergeSwapRecord, canMemberAgreeToSwap,
      pairingState, partitionMessagesBySession, counterpartOf,
      compileCycle, mergeScheduleVersion, agreedVersion, openAmendment,
      amendmentStance, canSignAmendment, scheduleNoticeAudience,
    } from "./logic.js";

    // ── Runtime globals ──────────────────────────────────────────────────────
    const CONTEXT       = window.__CONTEXT_URL       ?? "";
    const DB            = window.__DB_URL            ?? "";
    const APPEND_RECORD = window.__APPEND_RECORD_URL ?? "";
    const APP_ID        = window.__APP_ID            ?? "co-parenting";
    const P             = "app_co_parenting__";       // table prefix

    async function db(sql, params = []) {
      if (!DB) return { rows: [] };
      const res = await fetch(DB, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sql, params }),
      });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || `DB error ${res.status}`);
      return res.json();
    }

    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    }

    // ── State ────────────────────────────────────────────────────────────────
    let me = window.__CURRENT_MEMBER ?? null;   // may be replaced with a demo adult below
    let members = [], memberMap = new Map();
    let partnerId = null, partnerReciprocal = false;
    // The id of the CURRENT pairing. The hub stamps it onto every message it
    // accepts, so the thread can separate this relationship's record from an
    // earlier one's instead of running them together. Null until the pairing is
    // reciprocal — there is no session until both parents have named each other.
    let partnerSessionId = null;
    // The hub's word on whether a non-reciprocal pairing row is a live proposal
    // ("awaiting") or the survivor of an unpair ("ended"). Client state cannot
    // tell those apart — message history certainly can't.
    let partnerProposalPending = false;
    let schedules = [], overrides = [], swaps = [], messages = [], handoffs = [];
    // Every standing-schedule version this tenant has: agreed, pending,
    // superseded, withdrawn, declined. `schedules` is the agreed subset.
    let versions = [];
    /** The tenant's zone, defaulted into a proposal so the parents SEE which
     *  clock their custody days are counted in and can correct it before it
     *  becomes an agreed term. Filled from the hub context at load. */
    let spaceTimeZone = "UTC";
let searchQ = "";       // in-app search (see logic.js searchableFields)
    let custodyDays = [];                        // materialized rotation (agenda/glance source)
    let view = "schedule";
    let currentChildId = null;
    let calMonth = null;                         // { y, m } (m is 0-based)
    const DEMO = !DB;

    function memberName(id) { return memberMap.get(id)?.name ?? "Unknown"; }
    function childIds() { return [...new Set(schedules.map(s => s.child_id))]; }
    function adults() { return members.filter(m => isAdult(m, members)); }
    const canManage = () => !!me && isAdult(me, members);   // mirrors adult_writable / write_acl:adult

    /** The unambiguous co-parent, or null. Rule lives in logic.js (tested). */
    const likelyCoParent = () => soleCoParentCandidate(adults(), me?.id);

    // ── Loading ──────────────────────────────────────────────────────────────
    async function loadMembers() {
      if (!CONTEXT) {
        members = [
          { id: "demo-dad", name: "Dad", role: "adult" },
          { id: "demo-mom", name: "Mom", role: "adult" },
          { id: "demo-sam", name: "Sam", role: "child" },
        ];
        me = me ?? members[0];
        memberMap = new Map(members.map(m => [m.id, m]));
        return;
      }
      try {
        const res = await fetch(`${CONTEXT}?keys=family.members,family.preferences`);
        const ctx = await res.json();
        members = ctx["family.members"] ?? [];
        // The TENANT's zone, not this browser's. Custody-day boundaries are a
        // term both parents agree to, so the default has to be the one they
        // share — a proposer in another timezone must not silently define the
        // handoff day from their own device clock.
        spaceTimeZone = ctx["family.preferences"]?.timezone || spaceTimeZone;
      } catch { members = []; }
      memberMap = new Map(members.map(m => [m.id, m]));
    }

    function applyPartnerStatus(status) {
      partnerId = status.partner_id ?? null;
      partnerReciprocal = !!status.reciprocal;
      partnerSessionId = status.session_id ?? null;
      partnerProposalPending = !!status.proposal_pending;
    }

    async function loadPartner() {
      if (DEMO) { partnerId = "demo-mom"; partnerReciprocal = true; partnerSessionId = "demo-session"; partnerProposalPending = false; return; }
      try {
        const res = await fetch(`/run/${APP_ID}/api/partner`);
        applyPartnerStatus(res.ok ? await res.json() : {});
      } catch { applyPartnerStatus({}); }
    }

    /** The one SELECT for the thread — the initial load and every refresh must
     *  render the same record, so they share the query. */
    const loadMessages = () => db(`SELECT * FROM ${P}messages ORDER BY sent_at ASC`).catch(() => null);

    async function loadData() {
      if (DEMO) { seedDemo(); return; }

      // The standing schedule is an agreement, so it is read the way the swap
      // agreements are: the mutable amendment row plus the hub-owned agreement
      // state, merged by id. Both are governed tables, so a JOIN is rejected.
      const [amd, ver] = await Promise.all([
        db(`SELECT * FROM ${P}schedule_amendments ORDER BY created_at DESC`).catch(() => ({ rows: [] })),
        db(`SELECT * FROM ${P}schedule_versions`).catch(() => ({ rows: [] })),
      ]);
      const verById = new Map(ver.rows.map(v => [v.id, v]));
      versions = amd.rows.map(a => mergeScheduleVersion(a, verById.get(a.id)));
      // An agreed version outlives its amendment row for retention purposes, so
      // the list is not derived from the amendments alone.
      const amendmentIds = new Set(amd.rows.map(a => a.id));
      for (const v of ver.rows) {
        if (!amendmentIds.has(v.id)) versions.push(mergeScheduleVersion({ id: v.id }, v));
      }
      // What the calendar and every other view treat as "the schedule" is
      // exactly the set of versions currently in force. A pending proposal is
      // never one of them — that is the whole point of countersigning.
      schedules = versions.filter(v => v.status === "agreed");

      // swap_requests (party_scoped) and swap_agreements (endpoint_only) are both
      // governed tables — a JOIN across them is rejected — so load both and merge by id.
      const [sr, sa] = await Promise.all([
        db(`SELECT * FROM ${P}swap_requests ORDER BY created_at DESC`).catch(() => ({ rows: [] })),
        db(`SELECT * FROM ${P}swap_agreements`).catch(() => ({ rows: [] })),
      ]);
      const agrById = new Map(sa.rows.map(a => [a.id, a]));
      swaps = sr.rows.map(r => mergeSwapRecord(r, agrById.get(r.id)));
      // An authoritative agreement survives deletion of its mutable request
      // row. Keep agreement-only records visible instead of deriving the list
      // from swap_requests.
      const requestIds = new Set(sr.rows.map(r => r.id));
      for (const agr of sa.rows) {
        if (!requestIds.has(agr.id)) swaps.push(mergeSwapRecord({ id: agr.id }, agr));
      }
      // Exceptions to the rotation are DERIVED from locked swaps — the
      // overrides table is no longer read or written (its rows were
      // adult_writable, so either parent could unwind an agreed swap).
      overrides = lockedSwapOverrides(sa.rows);

      // Read, never written: `custody_days` is endpoint_only and the hub's
      // materializer is its only writer. Children may read it, which is what
      // makes "where am I tonight" answerable to them.
      custodyDays = (await db(`SELECT * FROM ${P}custody_days ORDER BY day`).catch(() => ({ rows: [] }))).rows;

      if (canManage()) {
        const [msg, hn] = await Promise.all([
          loadMessages(),
          db(`SELECT * FROM ${P}handoff_notes ORDER BY note_date DESC, created_at DESC`).catch(() => ({ rows: [] })),
        ]);
        messages = msg?.rows ?? []; handoffs = hn.rows;
      }
    }

    // ── Demo seed ────────────────────────────────────────────────────────────
    function seedDemo() {
      // Anchor on the Monday of last week so "today" lands mid-rotation.
      const dow = new Date().getDay();               // 0=Sun
      const anchor = addDays(todayStr(), -(((dow + 6) % 7) + 7));
      // A demo version carries the CANONICAL cycle, exactly as a real agreed
      // version does — the demo must not model a shape the product no longer has.
      versions = [{
        id: "demo-sch", child_id: "demo-sam", pattern: "alternating_weeks",
        cycle: JSON.stringify(compileCycle("alternating_weeks")), cycle_length: 14, anchor_date: anchor,
        parent_a_id: "demo-dad", parent_b_id: "demo-mom", exchange_time: "17:00",
        timezone: "America/Denver", effective_from: null, effective_to: null,
        status: "agreed", proposed_by: "demo-dad", household_a_agreed: 1, household_b_agreed: 1,
        agreed_at: "2026-01-01T00:00:00Z", created_at: "2026-01-01T00:00:00Z", updated_at: "2026-01-01T00:00:00Z",
      }];
      schedules = versions.filter(v => v.status === "agreed");
      custodyDays = buildCustodyDays(schedules, [], {
        startDate: todayStr(), endDate: addDays(todayStr(), 120),
        childName: memberName, parentName: memberName,
      });
      overrides = [];
      swaps = [{
        id: "demo-swap", requester_id: "demo-mom", responder_id: "demo-dad", child_id: "demo-sam",
        start_date: addDays(todayStr(), 10), end_date: addDays(todayStr(), 12), to_parent_id: "demo-mom",
        note: "School play weekend", status: "pending", created_at: "2026-01-01T00:00:00Z", updated_at: "2026-01-01T00:00:00Z",
        requester_agreed: 1, responder_agreed: 0, locked_at: null,
      }];
      messages = [
        { id: "m1", author_id: "demo-mom", recipient_id: "demo-dad", body: "Sam has a dentist appt Thursday at 4.", sent_at: addDays(todayStr(), -2) + "T14:03:00Z", session_id: "demo-session" },
        { id: "m2", author_id: "demo-dad", recipient_id: "demo-mom", body: "Thanks — I'll take him and send the paperwork.", sent_at: addDays(todayStr(), -2) + "T15:20:00Z", session_id: "demo-session" },
      ];
      handoffs = [
        { id: "h1", child_id: "demo-sam", note_date: addDays(todayStr(), 1), category: "items", body: "Soccer cleats + shin guards in his blue bag.", created_by: "demo-mom", created_at: "2026-01-01T00:00:00Z" },
        { id: "h2", child_id: "demo-sam", note_date: todayStr(), category: "health", body: "Allergy meds each morning with breakfast.", created_by: "demo-dad", created_at: "2026-01-01T00:00:00Z" },
      ];
    }

    // ── Derived surfaces are the hub's now ───────────────────────────────────
    //
    // Until 1.6.0 this app computed the rotation in the browser and wrote it
    // into `custody_days` and the `calendar_events` store key. Both are gone,
    // and neither is a refactor:
    //
    //   - a projection any adult could write was one either parent could
    //     rewrite without touching what was agreed;
    //   - three independent computations of one rotation (Today, the glance
    //     tile, the calendar) could each be stale on their own;
    //   - a tab closed between the DELETE and the INSERTs left the calendar
    //     simply empty.
    //
    // The hub's `cycle_projection` materializer now writes both, from the agreed
    // version, inside the same transaction that countersigns it. This app READS
    // `custody_days` and holds no store write grant at all.
    //
    // The rotation engine in logic.js survives as the PREVIEW engine — it is
    // what renders the days a proposal would produce, before there is anything
    // agreed for the hub to project. The hub's own horizon (120 days, extended
    // by its daily sweep) is what bounds the real projection.

    /** Re-read the hub's projection after an agreement changes it. */
    async function reloadCustodyDays() {
      if (!DB) return;
      try {
        custodyDays = (await db(`SELECT * FROM ${P}custody_days ORDER BY day`)).rows;
      } catch {
        // Non-fatal: the schedule view and calendar grid render from the agreed
        // version directly, so only the status card goes stale until reload.
      }
    }

    // ── Endpoints ────────────────────────────────────────────────────────────
    /**
     * The one request-JSON-or-throw wrapper for every hub endpoint this app
     * calls. The hub can answer 200-with-{error} as well as a bare error
     * status; checking both in one place keeps the five callers from
     * drifting — the pairing endpoints used to skip the body check and
     * silently "succeed" on an error payload.
     */
    async function requestJson(path, { method = "POST", body, fallbackError }) {
      const res = await fetch(path, {
        method,
        ...(body === undefined ? {} : {
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        }),
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || json.error) throw new Error(json.error || fallbackError);
      return json;
    }

    function appendRecord(name, data) {
      return requestJson(`${APPEND_RECORD}/${encodeURIComponent(name)}`, {
        body: data, fallbackError: "Could not save",
      });
    }

    /**
     * End the current pairing. The hub drops this member's link and clears the
     * session on the other parent's row, so neither side can send again — and
     * records the termination in its audit trail, which is what makes "when did
     * this end" answerable later.
     *
     * Nothing is deleted: both parents keep every message, which is why the
     * confirmation says so. Re-pairing with the same person mints a NEW session,
     * so the old record stays a separate, closed chapter.
     */
    async function unpair() {
      const ok = await hubConfirm({
        message: `End your pairing with ${memberName(partnerId)}?`,
        description: "Neither of you will be able to send new messages. Everything you've already exchanged "
          + "is kept and stays readable to you both.",
        destructive: true,
      });
      if (!ok) return;
      const btn = document.getElementById("unpair");
      if (btn) { btn.disabled = true; btn.textContent = "Ending…"; }
      try {
        await requestJson(`/run/${APP_ID}/api/partner`, {
          method: "DELETE", fallbackError: "Could not end the pairing",
        });
        await loadPartner();
        render();
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = "End pairing"; }
        hubAlert(e.message);
      }
    }

    /**
     * The message log's only write path. Unlike the append-record lane it
     * replaces, the hub decides the recipient from the reciprocal pairing and
     * refuses outright when there isn't one, so a message cannot be addressed
     * to anyone but the co-parent who is currently paired back. The hub also
     * sends the recipient's push itself, applying their preview preference —
     * the manifest's generic text is the default, and the message body is used
     * only after an explicit opt-in — so the send path must not notify again.
     */
    function pairedMessage(payload) {
      return requestJson(`/run/${APP_ID}/api/paired-message`, {
        body: payload, fallbackError: "Could not send",
      });
    }

    function agree(id, agreed, expectedSnapshot, resolution) {
      return requestJson(`/run/${APP_ID}/api/agree`, {
        body: {
          table: "swap_agreements", id, agreed,
          ...(expectedSnapshot ? { expected_snapshot: expectedSnapshot } : {}),
          ...(resolution ? { resolution } : {}),
        },
        fallbackError: "Could not record agreement",
      });
    }

    /** Swap / handoff notices — addressed to the paired co-parent, which is who
     *  those records are between. */
    function notifyPartner(title, body, params) {
      if (!partnerId) return;
      sendHubNotification({ title, body, audience: [partnerId], url: hubAppUrl(APP_ID, params) }).catch(() => {});
    }

    /**
     * Standing-schedule notices — addressed from MEMBERSHIP, never from the
     * pairing.
     *
     * The pairing is an in-app act that opens the message log; two co-parents
     * can be full members of this space without having completed it. Routing a
     * schedule amendment through it meant a proposal, a countersignature and a
     * supersession could all happen with nobody told. Rule lives in logic.js
     * (tested).
     */
    function notifySchedule(title, body, params) {
      const audience = scheduleNoticeAudience(members, me?.id);
      if (!audience.length) return;
      sendHubNotification({ title, body, audience, url: hubAppUrl(APP_ID, params) }).catch(() => {});
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  Rendering
    // ══════════════════════════════════════════════════════════════════════════
    const TABS = [
      ["schedule", "📅 Schedule"],
      ["swaps",    "🔄 Swaps"],
      ["messages", "💬 Messages"],
      ["handoffs", "📋 Handoffs"],
      ["setup",    "⚙️ Setup"],
    ];

    function render() {
      const tabsEl = document.getElementById("tabs");
      tabsEl.innerHTML = TABS.map(([id, label]) =>
        `<button class="tab ${view === id ? "active" : ""}" data-tab="${id}">${esc(label)}</button>`
      ).join("");
      tabsEl.querySelectorAll("[data-tab]").forEach(b =>
        b.addEventListener("click", () => {
          view = b.dataset.tab;
          render();
          // Opening the thread is the moment "have they written back?" is being
          // asked, and the only moment the app can honestly answer it — there
          // is no realtime channel here. It is also when the messages are
          // actually being read, so it is when the receipt is earned.
          if (view === "messages") refreshMessages();
        }));

      const el = document.getElementById("content");
      ({ schedule: renderSchedule, swaps: renderSwaps, messages: renderMessages,
         handoffs: renderHandoffs, setup: renderSetup }[view] ?? renderSchedule)(el);
    }

    // ── Schedule view ────────────────────────────────────────────────────────
    function renderSchedule(el) {
      if (!schedules.length) {
        el.innerHTML = `<div class="empty">No custody schedule yet.<br><br>
          ${canManage() ? `<button class="btn btn-primary" data-goto="setup">Set up a schedule</button>` : `Ask a parent to set one up.`}</div>`;
        el.querySelector("[data-goto]")?.addEventListener("click", () => { view = "setup"; render(); });
        return;
      }
      const kids = childIds();
      if (!currentChildId || !kids.includes(currentChildId)) currentChildId = kids[0];
      const sch = schedules.find(s => s.child_id === currentChildId);
      if (!calMonth) { const d = new Date(); calMonth = { y: d.getFullYear(), m: d.getMonth() }; }

      const pills = kids.map(cid =>
        `<button class="pill ${cid === currentChildId ? "active" : ""}" data-child="${esc(cid)}">${esc(memberName(cid))}</button>`
      ).join("");
      const colA = memberColor(sch.parent_a_id, members);
      const colB = memberColor(sch.parent_b_id, members);
      const monthName = new Date(calMonth.y, calMonth.m, 1).toLocaleString(undefined, { month: "long", year: "numeric" });

      // "Where are the kids now, and when does that change" — the same two facts
      // the hub's Today row and glance tile show, from the same projection.
      const todayRow = custodyDays.find(r => r.child_id === currentChildId && r.day === todayStr());
      const upcoming = nextTransition(custodyDays, addDays(todayStr(), 1), currentChildId);
      const statusHtml = todayRow ? `
        <div class="card">
          <div class="spread">
            <div>
              <strong>${esc(todayRow.title)}</strong>
              <div class="muted">${esc(todayRow.subtitle ?? "")}</div>
            </div>
            ${upcoming ? `<div class="muted" style="text-align:right">Next handoff<br><strong>${esc(fmtHandoffDay(upcoming.day))}</strong></div>` : ""}
          </div>
          ${upcoming && canManage() ? `
            <div class="row" style="margin-top:10px;gap:8px">
              <button class="btn btn-sm" data-noteupcoming="${esc(upcoming.child_id)}|${esc(upcoming.day)}">+ Note for this handoff</button>
              ${(() => { const n = notesForTransition(handoffs, upcoming.child_id, upcoming.day).length;
                         return n ? `<span class="muted">${n} note${n === 1 ? "" : "s"} ready</span>` : ""; })()}
            </div>` : ""}
        </div>` : "";

      el.innerHTML = `
        <div class="pills">${pills}</div>
        ${statusHtml}
        <div class="card">
          <div class="cal-head">
            <button class="btn btn-sm" data-nav="-1">‹</button>
            <strong>${esc(monthName)}</strong>
            <button class="btn btn-sm" data-nav="1">›</button>
          </div>
          <div class="cal-grid">
            ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d => `<div class="cal-dow">${d}</div>`).join("")}
            ${renderMonthCells(sch, colA, colB)}
          </div>
          <div class="legend">
            <span><span class="sw" style="background:${colA}"></span>${esc(memberName(sch.parent_a_id))}</span>
            <span><span class="sw" style="background:${colB}"></span>${esc(memberName(sch.parent_b_id))}</span>
            <span><span class="ov-dot" style="position:static;display:inline-block"></span> swap / override</span>
          </div>
          <p class="muted" style="margin:10px 0 0">${esc(patternLabel(sch))}${sch.exchange_time ? " · exchange at " + esc(sch.exchange_time) : ""}</p>
        </div>
        ${canManage() ? `<button class="btn btn-primary" data-newswap>Propose a swap</button>` : ""}`;

      el.querySelectorAll("[data-child]").forEach(b =>
        b.addEventListener("click", () => { currentChildId = b.dataset.child; render(); }));
      el.querySelectorAll("[data-noteupcoming]").forEach(b =>
        b.addEventListener("click", () => {
          const [child_id, day] = b.dataset.noteupcoming.split("|");
          openHandoffModal({ child_id, day });
        }));
      el.querySelectorAll("[data-nav]").forEach(b =>
        b.addEventListener("click", () => {
          let m = calMonth.m + parseInt(b.dataset.nav, 10), y = calMonth.y;
          if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
          calMonth = { y, m }; render();
        }));
      el.querySelector("[data-newswap]")?.addEventListener("click", () => openSwapModal(sch.child_id));
    }

    function renderMonthCells(sch, colA, colB) {
      const first = new Date(calMonth.y, calMonth.m, 1);
      const daysInMonth = new Date(calMonth.y, calMonth.m + 1, 0).getDate();
      let cells = "";
      for (let i = 0; i < first.getDay(); i++) cells += `<div class="cal-cell empty-cell"></div>`;
      for (let d = 1; d <= daysInMonth; d++) {
        const date = `${calMonth.y}-${String(calMonth.m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
        const eff = effectiveForDate(sch, overrides, date);
        const bg = eff.parent_id === sch.parent_a_id ? colA : eff.parent_id === sch.parent_b_id ? colB : "transparent";
        const tint = bg === "transparent" ? "" : `background:${bg}22`;
        const who = eff.parent_id ? esc(initial(memberName(eff.parent_id))) : "";
        cells += `<div class="cal-cell ${date === todayStr() ? "today" : ""}" style="${tint}" title="${esc(memberName(eff.parent_id))}">
          ${eff.source === "override" ? `<span class="ov-dot"></span>` : ""}
          <span class="dnum">${d}</span>
          <span class="who" style="color:${bg === "transparent" ? "inherit" : bg}">${who}</span>
        </div>`;
      }
      return cells;
    }

    function patternLabel(sch) {
      if (sch.pattern === "alternating_weeks") return "Alternating weeks";
      if (sch.pattern === "two_two_three") return "2-2-3 rotation";
      if (sch.pattern === "alternating_weekends") return "Alternating weekends";
      if (sch.pattern === "custom") return `Custom ${normalizeCycle(sch.cycle).length}-day cycle`;
      return sch.pattern;
    }

    // Every pattern is resolved as an offset from anchor_date, so the anchor is
    // what aligns a rotation to the days of the week. The fixed-shape patterns
    // therefore need the anchor on a specific weekday; say which, at the point
    // the date is picked, rather than leaving it to be discovered afterwards.
    function anchorHint(pattern) {
      if (pattern === "alternating_weekends") {
        return "Pick the Monday that opens a week in which Parent B has the weekend.";
      }
      if (pattern === "two_two_three") return "Pick the first day of Parent A's two-day block.";
      if (pattern === "alternating_weeks") return "Pick the first day of one of Parent A's weeks.";
      return "The first day of the cycle; the sequence repeats from here.";
    }

    // ── Swaps view ───────────────────────────────────────────────────────────
    function renderSwaps(el) {
      if (!canManage()) { el.innerHTML = `<div class="empty">Swaps are managed by the parents.</div>`; return; }
      // Surfaced here rather than only as an alert from the New-swap button:
      // a swap is a request TO someone, so with no co-parent recorded there is
      // nobody to send it to.
      if (!partnerId) {
        el.innerHTML = pairingPrompt("A swap is a request to your co-parent, so we need to know who that is.");
        wirePairingPrompt(el);
        return;
      }
      const list = schedules.length
        ? (swaps.length ? swaps.map(swapCard).join("") : `<div class="empty">No swap requests yet.</div>`)
        : `<div class="empty">Add a custody schedule in Setup before proposing swaps.</div>`;
      el.innerHTML = `
        <div class="spread" style="margin-bottom:12px">
          <span class="muted">Both parents must agree before a swap changes the calendar.</span>
          ${schedules.length ? `<button class="btn btn-primary btn-sm" data-newswap>+ New swap</button>` : ""}
        </div>
        ${list}`;
      el.querySelector("[data-newswap]")?.addEventListener("click", () => openSwapModal(childIds()[0]));
      el.querySelectorAll("[data-agree]").forEach(b => b.addEventListener("click", () => onAgree(b.dataset.agree)));
      el.querySelectorAll("[data-decline]").forEach(b => b.addEventListener("click", () => onDecline(b.dataset.decline)));
      el.querySelectorAll("[data-cancel]").forEach(b => b.addEventListener("click", () => onCancel(b.dataset.cancel)));
    }

    function swapCard(s) {
      const mine = me && s.requester_id === me.id;
      const iAmResponder = me && s.responder_id === me.id;
      const badge = { pending: "b-pending", locked: "b-locked", declined: "b-declined", cancelled: "b-cancelled" }[s.status];
      let actions = "";
      if (s.status === "pending") {
        if (canMemberAgreeToSwap(s, me?.id)) {
          actions = `<button class="btn btn-primary btn-sm" data-agree="${esc(s.id)}">Agree</button>
                     ${iAmResponder ? `<button class="btn btn-danger btn-sm" data-decline="${esc(s.id)}">Decline</button>` : ""}
                     ${mine ? `<button class="btn btn-sm" data-cancel="${esc(s.id)}">Cancel</button>` : ""}`;
        } else if (mine) {
          actions = `<span class="muted">${s.requester_agreed ? "Waiting for the other parent…" : ""}</span>
                     <button class="btn btn-sm" data-cancel="${esc(s.id)}">Cancel</button>`;
        }
      }
      const label = s.status === "locked" ? "confirmed" : s.status;
      return `<div class="card">
        <div class="spread">
          <strong>${esc(memberName(s.child_id))} → ${esc(memberName(s.to_parent_id))}</strong>
          <span class="badge ${badge}">${esc(label)}</span>
        </div>
        <p class="muted" style="margin:4px 0">${esc(fmtRange(s.start_date, s.end_date))}</p>
        ${s.note ? `<p style="margin:4px 0">${esc(s.note)}</p>` : ""}
        <p class="muted" style="margin:4px 0 8px">Proposed by ${esc(memberName(s.requester_id))} · to ${esc(memberName(s.responder_id))}</p>
        <div class="row" style="justify-content:flex-end">${actions}</div>
      </div>`;
    }

    /** "Fri" this week, else "Fri, Aug 8". Parsed at noon so no TZ day-shift. */
    function fmtHandoffDay(day) {
      const d = new Date(day + "T12:00:00");
      const within7 = (d - new Date(todayStr() + "T12:00:00")) < 7 * 86400000;
      return d.toLocaleDateString(undefined, within7
        ? { weekday: "short" }
        : { weekday: "short", month: "short", day: "numeric" });
    }

    function fmtRange(a, b) {
      const f = (d) => new Date(d + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
      return a === b ? f(a) : `${f(a)} – ${f(b)}`;
    }

    /**
     * The blocked-on-pairing panel, shared by Messages and Swaps.
     *
     * Both used to send you to Setup to work out what was wrong. When the
     * co-parent is unambiguous the whole thing collapses to one button here;
     * otherwise it still explains itself rather than just refusing.
     */
    /** True when any message survives from a pairing with this member. */
    function historyWith(pid) {
      return !!pid && messages.some(m => counterpartOf(m, me?.id) === pid);
    }

    function currentPairingState() {
      return pairingState({
        partnerId, reciprocal: partnerReciprocal, proposalPending: partnerProposalPending,
      });
    }

    /** Why the log is closed — one string, whichever branch renders it. */
    const PAIRING_WHY = "The message log is private to the two of you, so it opens once you've each named the other.";

    function pairingPrompt(why) {
      const state = currentPairingState();
      // No one-click pair button for someone this parent has a record with:
      // right after ending that pairing, the obvious suggestion is the person
      // they just left. Setup still offers them — deliberately, radio + save.
      const suggested = partnerId ? null : likelyCoParent();
      if (suggested && !historyWith(suggested.id)) {
        return `<div class="empty">${esc(why)}
          <br><br><button class="btn btn-primary" data-pair="${esc(suggested.id)}">Pair with ${esc(suggested.name)}</button></div>`;
      }
      if (state === "awaiting") {
        return `<div class="empty">Waiting for ${esc(memberName(partnerId))} to name you back — we've let them know.
          <br><br>${esc(why)}</div>`;
      }
      // Ended: never tell someone to keep waiting on a pairing that is over.
      // Their record of it is kept and stays readable under "Earlier record".
      if (state === "ended") {
        return `<div class="empty">Your pairing with ${esc(memberName(partnerId))} has ended, so no new messages can be sent in it.
          Everything you two exchanged is kept and stays readable to both of you.
          <br><br><button class="btn btn-primary" data-goto="setup">Set up a new pairing</button></div>`;
      }
      return `<div class="empty">${esc(why)}
        <br><br><button class="btn btn-primary" data-goto="setup">Choose your co-parent</button></div>`;
    }

    function wirePairingPrompt(el) {
      el.querySelector("[data-goto]")?.addEventListener("click", () => { view = "setup"; render(); });
      const pairBtn = el.querySelector("[data-pair]");
      pairBtn?.addEventListener("click", () =>
        pairWith(pairBtn.dataset.pair, pairBtn, pairBtn.textContent));
    }

    /**
     * Re-read the thread and mark what the other parent sent as read.
     *
     * This app has no realtime channel and loads once, so without this the
     * thread a parent is looking at is however stale their last page load was.
     * Refreshing on open (and on returning to the tab) is the cheap honest
     * version: no polling, but never a silently frozen conversation.
     *
     * Failures are swallowed on purpose — a read receipt is a courtesy, and
     * neither it nor a refresh is worth an error dialog over the record itself.
     */
    let refreshInFlight = null;    // concurrent callers share one refresh
    let messagesVersion = 0;       // bumped on any local append so a stale SELECT can't clobber it
    let markReadDone = false;      // one receipt per batch of unread mail, not one per tab focus

    async function refreshMessages() {
      if (DEMO || !canManage()) return;
      // visibilitychange fires on every tab/app switch and screen unlock, and
      // nothing serializes the SELECTs — without this, two in-flight refreshes
      // can resolve out of order and the older one wins.
      if (refreshInFlight) return refreshInFlight;
      refreshInFlight = (async () => {
        // The pairing itself can change while the tab is open — the partner
        // confirms, unpairs, or rotates — and the thread partition keys on the
        // session, so refresh both together or the first message of a
        // fresh pairing files under "Earlier record" with no composer.
        const versionBefore = messagesVersion;
        const partnerBefore = [partnerId, partnerReciprocal, partnerSessionId, partnerProposalPending].join("|");
        const [res] = await Promise.all([loadMessages(), loadPartner()]);
        const partnerChanged = [partnerId, partnerReciprocal, partnerSessionId, partnerProposalPending].join("|") !== partnerBefore;
        let changed = false;
        // A row appended locally after this SELECT left is newer than the
        // result — adopting the result would visibly unsend that message.
        if (res && versionBefore === messagesVersion) {
          changed = res.rows.length !== messages.length
            || res.rows.some((row, i) => row.id !== messages[i]?.id || row.read_at !== messages[i]?.read_at);
          if (changed) {
            messages = res.rows;
            markReadDone = false;   // fresh rows may need a receipt
          }
        }
        if ((changed || partnerChanged) && view === "messages") render();

        // Only the recipient's own unread rows are touched. This remains valid
        // after unpairing: historical messages are still readable, and opening
        // that record is enough to earn their recipient-only receipt. The
        // response patches the local rows — without that, `unread` stays true
        // and every tab focus re-posts a receipt the hub already recorded.
        const unread = messages.some(m => m.recipient_id === me?.id && !m.read_at);
        if (!unread || markReadDone) return;
        markReadDone = true;
        const receipt = await pairedMessage({ action: "mark_read" })
          .catch(() => { markReadDone = false; return null; });   // retry on next open
        if (receipt?.read_at) {
          for (const m of messages) {
            if (m.recipient_id === me?.id && !m.read_at) m.read_at = receipt.read_at;
          }
        }
      })().finally(() => { refreshInFlight = null; });
      return refreshInFlight;
    }

    // ── Messages view ────────────────────────────────────────────────────────
    function renderMessages(el) {
      if (!canManage()) { el.innerHTML = `<div class="empty">The message log is private to the two parents.</div>`; return; }
      const active = currentPairingState() === "active";
      // Without an active pairing there is nothing to send, but there may still
      // be a record to READ: the parent's own history does not disappear
      // because a relationship ended. Show the prompt above it and drop only
      // the composer, rather than returning early and hiding the record.
      if (!active && !messages.length) {
        el.innerHTML = pairingPrompt(PAIRING_WHY);
        wirePairingPrompt(el);
        return;
      }
      // Captured before the rebuild: a background refresh must not steal the
      // caret from someone mid-sentence or mid-search, wipe their draft, or
      // yank a reader scrolled up in the archive down to the newest message.
      const prevThread = el.querySelector(".thread");
      const stickToLatest = !prevThread
        || prevThread.scrollTop + prevThread.clientHeight >= prevThread.scrollHeight - 40;
      const draft = el.querySelector("#msg-body")?.value ?? "";
      const focusedId = document.activeElement?.id ?? null;

      const shown = searchQ
        ? messages.filter(m => searchMatch(searchQ, searchableFields(m, memberName(m.author_id))))
        : messages;
      const bubbles = (list) => list.map(m => {
        const mine = me && m.author_id === me.id;
        // Only on your own messages: "Read" on something you received tells you
        // what you already know, and on a permanent record the useful fact is
        // whether the other parent has seen what you sent.
        const receipt = mine && m.read_at ? ` · Read` : "";
        return `<div class="msg ${mine ? "mine" : "theirs"}">
          <div>${esc(m.body)}</div>
          <div class="meta">${esc(mine ? "You" : memberName(m.author_id))} · ${esc(fmtDateTime(m.sent_at))}${receipt}</div>
        </div>`;
      }).join("");

      // Messages from a co-parent relationship that has ended stay readable to
      // the two people who wrote them, but they are a separate record — shown
      // above the current thread under their own heading, most recent
      // relationship first, never merged into the conversation with today's
      // co-parent.
      const { current, earlier } = partitionMessagesBySession(shown, me?.id, partnerSessionId);
      const archive = earlier.map(group => `
        <div class="archive-group">
          <div class="archive-head">Earlier record — with ${esc(group.counterpartId ? memberName(group.counterpartId) : "a former co-parent")}</div>
          ${bubbles(group.messages)}
        </div>`).join("");
      const thread = shown.length ? archive + bubbles(current) : (searchQ
        ? `<div class="empty">No messages match "${esc(searchQ)}".</div>`
        : `<div class="empty">No messages yet. Say hello to ${esc(memberName(partnerId))}.</div>`);

      el.innerHTML = `
        <p class="immutable-note">🔒 Messages are permanent — they can't be edited or deleted, so this stays a trustworthy record for both of you.</p>
        ${messages.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search messages…" aria-label="Search messages" value="${esc(searchQ)}" /></div>` : ""}
        <div class="thread">${thread}</div>
        ${active ? `
        <div class="compose">
          <textarea id="msg-body" data-autofocus placeholder="Message ${esc(memberName(partnerId))}…" maxlength="5000"></textarea>
          <button class="btn btn-primary" id="msg-send">Send</button>
        </div>` : pairingPrompt(PAIRING_WHY)}`;
      el.querySelector("#search")?.addEventListener("input", (e) => {
        searchQ = e.target.value;
        renderMessages(el);   // focus/caret restore below covers this redraw too
      });
      if (active) {
        el.querySelector("#msg-send").addEventListener("click", onSendMessage);
        el.querySelector("#msg-body").addEventListener("keydown", (e) => {
          if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) onSendMessage();
        });
      } else {
        wirePairingPrompt(el);
      }
      // Restore what the rebuild destroyed. Autofocus only on a fresh open —
      // on a redraw it would steal the caret from wherever it was.
      const box = el.querySelector("#msg-body");
      if (box && draft) box.value = draft;
      if (focusedId === "search" || focusedId === "msg-body") {
        const field = el.querySelector(`#${focusedId}`);
        if (field) {
          field.focus();
          field.setSelectionRange(field.value.length, field.value.length);
        }
      } else if (!prevThread) {
        focusAutofocus(el);
      }
      const thr = el.querySelector(".thread");
      thr.scrollTop = stickToLatest ? thr.scrollHeight : prevThread.scrollTop;
    }

    function fmtDateTime(iso) {
      const d = new Date(iso);
      return isNaN(d) ? iso : d.toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    }

    // ── Handoffs view ────────────────────────────────────────────────────────
    const CATEGORIES = ["health", "school", "mood", "items", "general"];
    function renderHandoffs(el) {
      if (!canManage()) { el.innerHTML = `<div class="empty">Handoff notes are shared between the parents.</div>`; return; }

      // Notes are grouped under the exchange they were written for. The
      // association is derived by date (see groupNotesByTransition) — notes
      // that match no transition still appear, under "Other notes", because an
      // append-only record must never become invisible.
      const { groups, unanchored } = groupNotesByTransition(handoffs, custodyDays, todayStr());

      const groupHtml = groups.map(g => `
        <div class="card">
          <div class="spread" style="margin-bottom:8px">
            <div>
              <strong>${esc(g.transition.title)}</strong>
              <div class="muted">${esc(fmtHandoffDay(g.transition.day))}${g.transition.exchange_time ? ` · ${esc(fmtExchangeTimeLabel(g.transition))}` : ""}</div>
            </div>
            <span class="badge ${g.isUpcoming ? "b-pending" : "b-cancelled"}">${g.isUpcoming ? "Upcoming" : "Past"}</span>
          </div>
          ${g.notes.map(noteRow).join("")}
          ${g.isUpcoming ? `<div style="margin-top:10px"><button class="btn btn-sm" data-addfor="${esc(g.transition.child_id)}|${esc(g.transition.day)}">+ Add another note</button></div>` : ""}
        </div>`).join("");

      const otherHtml = unanchored.length ? `
        <div class="card">
          <div class="spread" style="margin-bottom:8px">
            <strong>Other notes</strong>
            <span class="muted">Not tied to an exchange</span>
          </div>
          ${unanchored.map(noteRow).join("")}
        </div>` : "";

      const body = (groups.length || unanchored.length)
        ? groupHtml + otherHtml
        : `<div class="empty">No handoff notes yet.<br><span class="muted">Write one ahead of the next exchange — meds, school, mood, items to pack.</span></div>`;

      el.innerHTML = `
        <div class="spread" style="margin-bottom:12px">
          <span class="muted">Notes for an exchange — meds, school, mood, items to pack.</span>
          ${childIds().length ? `<button class="btn btn-primary btn-sm" data-newnote>+ Add note</button>` : ""}
        </div>
        ${childIds().length ? body : `<div class="empty">Add a custody schedule in Setup first.</div>`}`;

      el.querySelector("[data-newnote]")?.addEventListener("click", () => openHandoffModal());
      el.querySelectorAll("[data-addfor]").forEach(b => b.addEventListener("click", () => {
        const [child_id, day] = b.dataset.addfor.split("|");
        openHandoffModal({ child_id, day });
      }));
    }

    function noteRow(h) {
      return `
        <div style="padding:8px 0;border-top:1px solid var(--hub-border,#f3f4f6)">
          <div class="row" style="margin-bottom:4px">
            <span class="note-cat">${esc(h.category)}</span>
            <span class="muted">${esc(memberName(h.child_id))}</span>
          </div>
          <div style="white-space:pre-wrap;word-break:break-word">${esc(h.body)}</div>
          <p class="muted" style="margin:6px 0 0">— ${esc(memberName(h.created_by))}</p>
        </div>`;
    }

    // ── Setup view ───────────────────────────────────────────────────────────
    function renderSetup(el) {
      if (!canManage()) { el.innerHTML = `<div class="empty">Only a parent can configure Co-Parenting.</div>`; return; }
      const others = adults().filter(m => me && m.id !== me.id);
      const suggested = partnerId ? null : likelyCoParent();
      const pairStatus = {
        unpaired: suggested
          ? `<p class="muted">Confirm <b>${esc(suggested.name)}</b> as your co-parent to open your shared message log and enable swap requests.</p>`
          : `<p class="muted">Not paired yet. Choose your co-parent so you can share a private message log.</p>`,
        active: `<p>✅ Paired with <b>${esc(memberName(partnerId))}</b>.</p>`,
        awaiting: `<p>⏳ You chose <b>${esc(memberName(partnerId))}</b> — waiting for them to choose you back. We've let them know.</p>`,
        // Naming a new co-parent starts a new record; it never reopens the old
        // one, and never exposes it to whoever comes next.
        ended: `<p>⛔ Your pairing with <b>${esc(memberName(partnerId))}</b> has ended. Your record of it is kept and stays readable to you both.
          Choosing someone else starts a separate record.</p>`,
      }[currentPairingState()];
      // Pre-checked, never pre-saved: the radio still has to be confirmed, so
      // the private message log is never opened without a deliberate act.
      const checkedId = partnerId ?? suggested?.id ?? null;

      // One row per child, showing the agreed version and — separately, never
      // mixed in with it — any proposal awaiting a countersignature. A pending
      // amendment must never read as though it were the schedule.
      const scheduledChildIds = [...new Set([
        ...schedules.map(s => s.child_id),
        ...versions.filter(v => v.status === "pending" || v.status === "draft").map(v => v.child_id),
      ])].filter(Boolean);

      const schedRows = scheduledChildIds.length ? scheduledChildIds.map(cid => {
        const agreed = agreedVersion(versions, cid);
        const pending = openAmendment(versions, cid);
        const signed = pending ? signedElsewhere.has(pending.id) : false;
        const stance = pending ? amendmentStance(pending, me?.id, signed) : null;
        const changed = pending && agreed ? describeScheduleChange(agreed, pending) : null;
        return `
        <div style="padding:8px 0;border-top:1px solid var(--hub-border,#eee)">
          <div class="spread">
            <div>
              <strong>${esc(memberName(cid))}</strong>
              ${agreed
                ? `<div class="muted">${esc(patternLabel(agreed))} · ${esc(memberName(agreed.parent_a_id))} / ${esc(memberName(agreed.parent_b_id))}
                     ${agreed.effective_to ? ` · ends ${esc(agreed.effective_to)}` : ""}</div>
                   <div class="muted">Countersigned ${esc(fmtDateTime(agreed.agreed_at))} · days counted in ${esc(agreed.timezone ?? "UTC")}</div>`
                : `<div class="muted">No agreed schedule yet.</div>`}
            </div>
            <div class="row">
              ${pending ? "" : `<button class="btn btn-sm" data-editsch="${esc(cid)}">${agreed ? "Propose change" : "Propose schedule"}</button>`}
              ${agreed && !pending ? `<button class="btn btn-sm btn-danger" data-retiresch="${esc(agreed.id)}">Propose ending it</button>` : ""}
            </div>
          </div>
          ${pending ? `
            <div class="card" style="margin:8px 0 0">
              <strong>⏳ Change proposed${pending.proposed_by ? ` by ${esc(memberName(pending.proposed_by))}` : ""}</strong>
              <div class="muted">${changed ? `Changes ${esc(changed)}.` : "Sets the standing schedule."}
                ${pending.rationale ? ` “${esc(pending.rationale)}”` : ""}</div>
              <div class="muted">${esc(patternLabel(pending))} · from ${esc(pending.anchor_date ?? "?")}
                ${pending.exchange_time ? ` · exchange ${esc(pending.exchange_time)}` : ""}
                · days counted in ${esc(pending.timezone ?? "UTC")}</div>
              <p class="muted" style="margin:6px 0 0">${stance === "awaiting_them"
                ? "Waiting for your co-parent to countersign. The current schedule stays in force until they do."
                : "This takes effect only once you countersign it."}</p>
              <div class="row" style="margin-top:8px;gap:8px">
                ${canSignAmendment(pending, me?.id, signed)
                  ? `<button class="btn btn-primary btn-sm" data-signsch="${esc(pending.id)}">Countersign</button>` : ""}
                <button class="btn btn-sm btn-danger" data-declinesch="${esc(pending.id)}">${
                  pending.proposed_by === me?.id ? "Withdraw" : "Decline"}</button>
              </div>
            </div>` : ""}
        </div>`;
      }).join("") : `<p class="muted">No schedules yet.</p>`;

      el.innerHTML = `
        <div class="card">
          <h3>Co-parent</h3>
          ${pairStatus}
          <div class="radio-list" style="margin-top:8px">
            ${others.length ? others.map(m => `
              <label><input type="radio" name="partner" value="${esc(m.id)}" ${m.id === checkedId ? "checked" : ""}>
              <span class="avatar" style="background:${memberColor(m.id, members)}">${esc(initial(m.name))}</span> ${esc(m.name)}</label>
            `).join("") : `<p class="muted">No other adults in this household yet.</p>`}
          </div>
          ${others.length ? `<button class="btn btn-primary btn-sm" id="save-partner">${suggested ? `Confirm ${esc(suggested.name)}` : "Save co-parent"}</button>` : ""}
          ${partnerId ? `<button class="btn btn-sm" id="unpair">End pairing</button>` : ""}
        </div>
        <div class="card">
          <div class="spread"><h3 style="margin:0">Custody schedules</h3>
            <button class="btn btn-primary btn-sm" data-newsch>+ Add child</button></div>
          <p class="hint" style="margin:4px 0 0">The standing schedule is an agreement: it changes only when
            both parents countersign, and every version you have agreed to is kept.</p>
          ${schedRows}
        </div>`;

      el.querySelector("#save-partner")?.addEventListener("click", onSavePartner);
      el.querySelector("#unpair")?.addEventListener("click", unpair);
      el.querySelector("[data-newsch]")?.addEventListener("click", () => openScheduleModal(null));
      el.querySelectorAll("[data-editsch]").forEach(b =>
        b.addEventListener("click", () => openScheduleModal(agreedVersion(versions, b.dataset.editsch))));
      el.querySelectorAll("[data-retiresch]").forEach(b =>
        b.addEventListener("click", () => onProposeRetirement(b.dataset.retiresch)));
      el.querySelectorAll("[data-signsch]").forEach(b =>
        b.addEventListener("click", () => onSignAmendment(b.dataset.signsch)));
      el.querySelectorAll("[data-declinesch]").forEach(b =>
        b.addEventListener("click", () => onDeclineAmendment(b.dataset.declinesch)));
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  Modals
    // ══════════════════════════════════════════════════════════════════════════
    let modalEl = null;
    function openModal(html) {
      closeModal();
      modalEl = document.createElement("div");
      modalEl.className = "modal-backdrop";
      modalEl.innerHTML = `<div class="modal">${html}</div>`;
      modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
      document.body.appendChild(modalEl);
      modalEl.querySelector("[data-close]")?.addEventListener("click", closeModal);
      focusAutofocus(modalEl);
    }
    function closeModal() { modalEl?.remove(); modalEl = null; }
    function focusAutofocus(root) {
      const t = root.querySelector("[data-autofocus]");
      if (t) setTimeout(() => t.focus(), 30);
    }
    function optionList(ids, selected) {
      return ids.map(id => `<option value="${esc(id)}" ${id === selected ? "selected" : ""}>${esc(memberName(id))}</option>`).join("");
    }

    // Propose a standing-schedule amendment.
    //
    // `existing` is the currently AGREED version being amended (null for a
    // child that has none yet). The form is pre-filled from it so the other
    // parent is asked to countersign a specific difference rather than a fresh
    // schedule they have to diff themselves.
    function openScheduleModal(existing) {
      const kids = members.filter(m => !isAdult(m, members));
      const adultIds = adults().map(a => a.id);
      const e = existing || {};
      const zones = [...new Set([e.timezone, spaceTimeZone, "UTC"].filter(Boolean))];
      openModal(`
        <h3>${existing ? "Propose a schedule change" : "Propose a custody schedule"}</h3>
        <p class="hint">${existing
          ? "The current schedule stays in force until your co-parent countersigns this."
          : "This becomes the schedule once your co-parent countersigns it."}</p>
        <label class="field"><span>Child</span>
          <select id="f-child" ${existing ? "disabled" : ""}>
            ${kids.length ? kids.map(k => `<option value="${esc(k.id)}" ${k.id === e.child_id ? "selected" : ""}>${esc(k.name)}</option>`).join("")
              : `<option value="">No children in household</option>`}
          </select></label>
        <div class="row" style="gap:10px">
          <label class="field" style="flex:1"><span>Parent A</span><select id="f-pa">${optionList(adultIds, e.parent_a_id ?? me?.id)}</select></label>
          <label class="field" style="flex:1"><span>Parent B</span><select id="f-pb">${optionList(adultIds, e.parent_b_id ?? partnerId ?? adultIds.find(id => id !== me?.id))}</select></label>
        </div>
        <label class="field"><span>Pattern</span>
          <select id="f-pattern">
            <option value="alternating_weeks" ${e.pattern === "alternating_weeks" ? "selected" : ""}>Alternating weeks (7/7)</option>
            <option value="two_two_three" ${e.pattern === "two_two_three" ? "selected" : ""}>2-2-3 rotation</option>
            <option value="alternating_weekends" ${e.pattern === "alternating_weekends" ? "selected" : ""}>Alternating weekends (Fri–Sun)</option>
            <option value="custom" ${e.pattern === "custom" ? "selected" : ""}>Custom cycle</option>
          </select></label>
        <div id="f-custom-wrap" style="display:${e.pattern === "custom" ? "block" : "none"}">
          <label class="field"><span>Cycle — a = Parent A day, b = Parent B day</span>
            <input id="f-cycle" placeholder="a,a,b,b,a,a,a" value="${esc(normalizeCycle(e.cycle).join(","))}"></label>
          <p class="hint">One letter per day; the sequence repeats.</p>
        </div>
        <label class="field"><span>Cycle start date (day 1 of the pattern)</span>
          <input type="date" id="f-anchor" value="${esc(e.anchor_date ?? todayStr())}"></label>
        <p class="hint" id="f-anchor-hint">${esc(anchorHint(e.pattern ?? "alternating_weeks"))}</p>
        <label class="field"><span>Exchange time (optional)</span>
          <input type="time" id="f-time" value="${esc(e.exchange_time ?? "")}"></label>
        <label class="field"><span>Custody days are counted in</span>
          <select id="f-tz">${zones.map(z => `<option value="${esc(z)}" ${z === (e.timezone ?? spaceTimeZone) ? "selected" : ""}>${esc(z)}</option>`).join("")}</select></label>
        <p class="hint">Whose midnight ends a custody day. Agreed as part of the schedule, so a
          later settings change can't quietly move a handoff — only a new countersigned change can.</p>
        <label class="field"><span>Reason for the change (optional)</span>
          <textarea id="f-why" maxlength="500" placeholder="Why you're proposing this…"></textarea></label>
        <div class="modal-actions">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" id="save-sch">Send for countersignature</button>
        </div>`);
      const patSel = modalEl.querySelector("#f-pattern");
      patSel.addEventListener("change", () => {
        modalEl.querySelector("#f-custom-wrap").style.display = patSel.value === "custom" ? "block" : "none";
        modalEl.querySelector("#f-anchor-hint").textContent = anchorHint(patSel.value);
      });
      modalEl.querySelector("#save-sch").addEventListener("click", () => onProposeAmendment(existing));
    }

    // Swap proposal
    function openSwapModal(preChild) {
      if (!partnerId) { hubAlert("Pair with your co-parent in Setup before proposing a swap."); return; }
      const kids = childIds();
      const parentIds = [...new Set(schedules.flatMap(s => [s.parent_a_id, s.parent_b_id]))];
      openModal(`
        <h3>Propose a swap</h3>
        <p class="hint">The other parent must agree before it changes the calendar.</p>
        <label class="field"><span>Child</span><select id="s-child">${kids.map(c => `<option value="${esc(c)}" ${c === preChild ? "selected" : ""}>${esc(memberName(c))}</option>`).join("")}</select></label>
        <div class="row" style="gap:10px">
          <label class="field" style="flex:1"><span>From</span><input type="date" id="s-start" data-autofocus value="${esc(addDays(todayStr(), 1))}"></label>
          <label class="field" style="flex:1"><span>To</span><input type="date" id="s-end" value="${esc(addDays(todayStr(), 1))}"></label>
        </div>
        <label class="field"><span>Who should have them?</span><select id="s-parent">${optionList(parentIds, me?.id)}</select></label>
        <label class="field"><span>Note (optional)</span><textarea id="s-note" maxlength="500" placeholder="Reason for the swap…"></textarea></label>
        <div class="modal-actions">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" id="save-swap">Send request</button>
        </div>`);
      modalEl.querySelector("#save-swap").addEventListener("click", onCreateSwap);
    }

    // Handoff note
    // `preset` — a custody_days transition row to pre-select (from "Add note for
    // this handoff" on the schedule card).
    function openHandoffModal(preset) {
      const kids = childIds();
      const initialChild = preset?.child_id ?? kids[0];
      const initialDate  = preset?.day ?? todayStr();

      openModal(`
        <h3>Add handoff note</h3>
        <label class="field"><span>Child</span><select id="h-child">${kids.map(c =>
          `<option value="${esc(c)}" ${c === initialChild ? "selected" : ""}>${esc(memberName(c))}</option>`).join("")}</select></label>
        <label class="field"><span>For which handoff</span>
          <select id="h-when"></select>
        </label>
        <div class="row" style="gap:10px">
          <label class="field" style="flex:1"><span>Date</span><input type="date" id="h-date" value="${esc(initialDate)}"></label>
          <label class="field" style="flex:1"><span>Category</span><select id="h-cat">${CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join("")}</select></label>
        </div>
        <p class="hint" id="h-hint"></p>
        <label class="field"><span>Note</span><textarea id="h-body" data-autofocus maxlength="2000" placeholder="e.g. Needs library books returned Monday."></textarea></label>
        <div class="modal-actions">
          <button class="btn" data-close>Cancel</button>
          <button class="btn btn-primary" id="save-note">Add note</button>
        </div>`);

      // The picker and the date field are two views of one value. The picker is
      // the discoverable path (it knows when the next exchange actually is);
      // the date field stays because a note for an ordinary day is still valid.
      const whenEl = modalEl.querySelector("#h-when");
      const dateEl = modalEl.querySelector("#h-date");
      const childEl = modalEl.querySelector("#h-child");

      function refreshWhen() {
        const childId = childEl.value;
        const options = upcomingTransitions(custodyDays, todayStr(), { childId });
        whenEl.innerHTML = options.map(t =>
          `<option value="${esc(t.day)}">${esc(fmtHandoffDay(t.day))} · ${esc(t.title)}${t.exchange_time ? ` · ${esc(fmtExchangeTimeLabel(t))}` : ""}</option>`
        ).join("") + `<option value="">Another day…</option>`;
        // Keep whatever date is already chosen if it's one of the options.
        whenEl.value = options.some(t => t.day === dateEl.value) ? dateEl.value : "";
        syncHint();
      }
      function syncHint() {
        const hint = modalEl.querySelector("#h-hint");
        const filed = notesForTransition(handoffs, childEl.value, dateEl.value).length;
        hint.textContent = filed
          ? `${filed} note${filed === 1 ? "" : "s"} already filed for that day.`
          : "";
      }

      whenEl.addEventListener("change", () => {
        if (whenEl.value) dateEl.value = whenEl.value;
        syncHint();
      });
      dateEl.addEventListener("change", () => {
        whenEl.value = [...whenEl.options].some(o => o.value === dateEl.value) ? dateEl.value : "";
        syncHint();
      });
      childEl.addEventListener("change", refreshWhen);
      refreshWhen();

      modalEl.querySelector("#save-note").addEventListener("click", onSaveHandoff);
    }

    /** "6:00 PM" for a custody_days row, from its stored 'HH:MM'. */
    function fmtExchangeTimeLabel(t) {
      return (t.subtitle ?? "").replace(/^Handoff /, "");
    }

    // ══════════════════════════════════════════════════════════════════════════
    //  Actions
    // ══════════════════════════════════════════════════════════════════════════
    async function onSavePartner() {
      const chosen = document.querySelector('input[name="partner"]:checked')?.value;
      if (!chosen) { hubAlert("Choose a co-parent first."); return; }
      await pairWith(chosen, document.getElementById("save-partner"), "Save co-parent");
    }

    /**
     * Record `chosen` as this member's co-parent.
     *
     * Pairing is one row per member — mine names them, theirs names me — and
     * `couple_scoped` only opens the message log once BOTH exist. So the second
     * parent has to act too, and until they do the first parent is left staring
     * at a tab that simply refuses to work. Nudging them is what turns pairing
     * from a step you have to discover into one that completes itself.
     */
    async function pairWith(chosen, btn, restoreLabel) {
      if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
      try {
        if (!DEMO) {
          // The POST answers with the resulting pairing status, so no
          // follow-up GET is needed.
          applyPartnerStatus(await requestJson(`/run/${APP_ID}/api/partner`, {
            body: { partner_id: chosen }, fallbackError: "Could not save",
          }));
        } else { partnerId = chosen; partnerReciprocal = true; }
        // Notified directly rather than via notifyPartner, which targets the
        // *paired* partner — and from this side the pairing may not be mutual
        // yet, which is precisely what they are being asked to fix.
        if (!partnerReciprocal && !DEMO) {
          sendHubNotification({
            title: "Confirm your co-parent",
            body: `${me?.name} named you as their co-parent. Confirm to open your shared message log.`,
            audience: [chosen],
            url: hubAppUrl(APP_ID, { view: "setup" }),
          }).catch(() => {});
        }
        render();
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = restoreLabel; }
        hubAlert(e.message);
      }
    }

    /**
     * Propose a standing-schedule amendment.
     *
     * Two calls, deliberately, and in this order:
     *
     *   1. `/api/propose-agreement` writes the amendment row. The app cannot
     *      write it directly — it is endpoint_only, and its party columns hold
     *      the two participating HOUSEHOLD ids, which the hub resolves from the
     *      live roster. That is what makes a supporting adult unable to propose
     *      a custody change, and what keeps a demoted-and-refilled co-parent
     *      seat a party to a proposal it did not personally make.
     *   2. `/api/agree` records the proposer's own signature, which is also
     *      what LOCKS the amendment when there is only one participating
     *      household (a household install, or a space the other parent never
     *      joined) — there is no second party to protect, so the same rule
     *      governed operations use applies here.
     *
     * The pattern the parents picked is compiled to a canonical cycle array
     * BEFORE it is sent, because that array is what gets countersigned and what
     * the hub projects. See compileCycle in logic.js.
     */
    async function onProposeAmendment(existing) {
      const child_id = existing?.child_id ?? modalEl.querySelector("#f-child").value;
      const parent_a_id = modalEl.querySelector("#f-pa").value;
      const parent_b_id = modalEl.querySelector("#f-pb").value;
      const pattern = modalEl.querySelector("#f-pattern").value;
      const anchor_date = modalEl.querySelector("#f-anchor").value;
      const exchange_time = modalEl.querySelector("#f-time").value || null;
      const timezone = modalEl.querySelector("#f-tz").value;
      const rationale = modalEl.querySelector("#f-why").value.trim() || null;
      const customArr = pattern === "custom"
        ? normalizeCycle(modalEl.querySelector("#f-cycle").value.split(",").map(s => s.trim().toLowerCase())) : [];

      if (!child_id) { hubAlert("Pick a child."); return; }
      if (parent_a_id === parent_b_id) { hubAlert("The two parents must be different people."); return; }
      if (!anchor_date) { hubAlert("Pick a cycle start date."); return; }
      if (pattern === "custom" && !customArr.length) { hubAlert("Enter a custom cycle like a,a,b,b."); return; }

      const cycleArr = compileCycle(pattern, customArr);
      if (!cycleArr.length) { hubAlert("That pattern can't be worked out into a rotation."); return; }
      const cycle = JSON.stringify(cycleArr);

      const terms = {
        child_id, parent_a_id, parent_b_id, pattern, cycle,
        cycle_length: cycleArr.length, anchor_date, exchange_time, timezone,
        effective_from: existing?.effective_from ?? null,
        effective_to: existing?.effective_to ?? null,
        rationale,
        base_version_id: existing?.id ?? null,
      };
      // Nothing to countersign is not a proposal. Refused here rather than sent,
      // so the other parent is never asked to sign an identical schedule.
      if (existing && !describeScheduleChange(existing, terms)) {
        hubAlert("Nothing has changed, so there is nothing to propose.");
        return;
      }

      const btn = modalEl.querySelector("#save-sch");
      btn.disabled = true; btn.textContent = "Sending…";
      try {
        const { id } = await requestJson(`/run/${APP_ID}/api/propose-agreement`, {
          body: { table: "schedule_versions", values: terms },
          fallbackError: "Could not record the proposal",
        });
        const result = await agreeSchedule(id, true);
        closeModal();
        currentChildId = child_id;
        await loadData();
        render();
        notifySchedule(
          result.locked ? "Custody schedule updated" : "Custody schedule change proposed",
          result.locked
            ? `${me?.name} set the standing schedule for ${memberName(child_id)}.`
            : `${me?.name} proposed a change to ${memberName(child_id)}'s schedule. It takes effect when you countersign it.`,
          { view: "setup" });
      } catch (e) {
        btn.disabled = false; btn.textContent = "Send for countersignature";
        hubAlert(e.message);
      }
    }

    /**
     * Propose retiring a schedule.
     *
     * There is no delete. A standing schedule is a record both parents rely on,
     * so ending one is an amendment like any other: the terms are unchanged
     * except for an end date, and it takes effect only when the other parent
     * countersigns. Every prior agreed version is kept regardless.
     */
    async function onProposeRetirement(versionId) {
      const current = versions.find(v => v.id === versionId);
      if (!current) return;
      const until = todayStr();
      const ok = await hubConfirm({
        message: `Propose ending ${memberName(current.child_id)}'s schedule?`,
        description: "It stays in force until your co-parent countersigns. Custody days after "
          + `${until} stop being published; everything already agreed is kept.`,
        destructive: true,
      });
      if (!ok) return;
      try {
        const { id } = await requestJson(`/run/${APP_ID}/api/propose-agreement`, {
          body: {
            table: "schedule_versions",
            values: {
              child_id: current.child_id,
              parent_a_id: current.parent_a_id,
              parent_b_id: current.parent_b_id,
              pattern: current.pattern,
              cycle: current.cycle,
              cycle_length: current.cycle_length,
              anchor_date: current.anchor_date,
              exchange_time: current.exchange_time ?? null,
              timezone: current.timezone ?? spaceTimeZone,
              effective_from: current.effective_from ?? null,
              effective_to: until,
              rationale: "Ending this schedule.",
              base_version_id: current.id,
            },
          },
          fallbackError: "Could not propose the change",
        });
        const result = await agreeSchedule(id, true);
        await loadData();
        render();
        notifySchedule(
          result.locked ? "Custody schedule ended" : "End of custody schedule proposed",
          result.locked
            ? `${me?.name} ended ${memberName(current.child_id)}'s standing schedule.`
            : `${me?.name} proposed ending ${memberName(current.child_id)}'s schedule. It stays in force until you countersign.`,
          { view: "setup" });
      } catch (e) { hubAlert(e.message); }
    }

    /** Countersign, decline, or withdraw a standing-schedule amendment. */
    function agreeSchedule(id, agreed, resolution) {
      return requestJson(`/run/${APP_ID}/api/agree`, {
        body: {
          table: "schedule_versions", id, agreed,
          ...(resolution ? { resolution } : {}),
        },
        fallbackError: "Could not record your decision",
      });
    }

    /**
     * Amendment ids the hub has told us this side had already signed.
     *
     * The app infers which side it is from who proposed, which is exact except
     * for a co-parent seat replaced while a proposal is open. `/api/agree`
     * answers that authoritatively — it resolves the caller's household live —
     * so one countersign attempt corrects the view for the rest of the session.
     */
    const signedElsewhere = new Set();

    async function onSignAmendment(id) {
      const amendment = versions.find(v => v.id === id);
      if (!amendment) return;
      try {
        const result = await agreeSchedule(id, true);
        if (result.already_agreed) {
